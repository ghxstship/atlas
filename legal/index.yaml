# Legal document registry for XOS 4.0 (Section 14.4).
# Wave 2 reads this file to publish /legal/{slug} with version history and to
# record acceptances (document version, timestamp, IP address and user).
#
# Fields
#   slug: URL segment under /legal; stable across versions
#   title: display title (Title Case)
#   version: semantic version of the current text; "-draft" means not yet in effect
#   file: path from the repository root
#   audience: who the document addresses
#   publish: public (served at /legal) or internal (kept in the repository, shared on request)
#   requires_acceptance_at_signup: true when signup cannot finish without acceptance
#   acceptance_by: who accepts, and when (empty when no acceptance is recorded)
#   material_change: true when this version requires re-acceptance with 30 days' notice
#   owner_inputs: OWNER_INPUTS.md items the published text depends on
registry_version: 1
documents:
  - slug: terms-of-service
    title: Terms of Service
    version: 1.0.0-draft
    file: legal/terms-of-service.md
    audience: Customer organizations
    publish: public
    requires_acceptance_at_signup: true
    acceptance_by: [org_owner_at_signup]
    material_change: false
    owner_inputs: [1, 2, 3, 6]
