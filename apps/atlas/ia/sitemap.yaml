                      views: [resource-schedule, table, list, calendar]
                      default: resource-schedule
                  - id: project.engagements
                    kind: tab
                    label: nav.atlas.projectTabs.engagements
                    route: "/{org}/p/{projectKey}/engagements"
                    twin: opportunities
                    list: { views: [table, list, board], default: table }
                  - id: project.credentials
                    kind: tab
                    label: nav.atlas.projectTabs.credentials
                    route: "/{org}/p/{projectKey}/credentials"
                    twin: credentials
                    list: { views: [table, list, matrix], default: table }
                  - id: project.safety
                    kind: tab
                    label: nav.atlas.projectTabs.safety
                    route: "/{org}/p/{projectKey}/safety"
                    twin: safety
                    list: { views: [list, table, map, board], default: list }
                  - id: project.budget
                    kind: tab
                    label: nav.atlas.projectTabs.budget
                    route: "/{org}/p/{projectKey}/budget"
                    twin: finance
                    list: { views: [spreadsheet, table, matrix], default: spreadsheet }
                  - id: project.procurement
                    kind: tab
                    label: nav.atlas.projectTabs.procurement
                    route: "/{org}/p/{projectKey}/procurement"
                    twin: procurement
                    list: { views: [table, list, board], default: table }
              - id: project.act.show
                kind: group
                label: nav.atlas.acts.show
                placement: tab-bar
                children:
                  - id: project.documents
                    kind: tab
                    label: nav.atlas.projectTabs.documents
                    route: "/{org}/p/{projectKey}/documents"
                    visibilityFrom: knowledge
                    list: { views: [list, table, gallery], default: list }
                  - id: project.reports
                    kind: tab
                    label: nav.atlas.projectTabs.reports
                    route: "/{org}/p/{projectKey}/reports"
                    twin: reports
                    list: { views: [list, table], default: list }
                  - id: project.activity
                    kind: tab
                    label: nav.atlas.projectTabs.activity
                    route: "/{org}/p/{projectKey}/activity"
                    visibilityFrom: activity
                    list: { views: [feed, list], default: feed }
                  - id: project.settings
                    kind: tab
                    label: nav.atlas.projectTabs.settings
                    route: "/{org}/p/{projectKey}/settings"
                    visibility:
                      owner: full
                      admin: full
                      manager: full
                      member: read
                      collaborator: hidden
                      field: hidden
                      viewer: hidden
      - id: schedule
        kind: item
