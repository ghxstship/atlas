                    twin: advancing
                    list: { views: [list, table, board], default: list }
              - id: project.act.build
                kind: group
                label: nav.atlas.acts.build
                placement: tab-bar
                children:
                  - id: project.logistics
                    kind: tab
                    label: nav.atlas.projectTabs.logistics
                    route: "/{org}/p/{projectKey}/logistics"
                    twin: logistics
                    list: { views: [list, table, calendar, resource-schedule], default: list }
                  - id: project.hospitality
                    kind: tab
                    label: nav.atlas.projectTabs.hospitality
                    route: "/{org}/p/{projectKey}/hospitality"
