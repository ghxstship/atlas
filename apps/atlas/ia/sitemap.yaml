# Atlas information architecture (Section 4.5.1 to 4.5.6, role visibility 4.5.9).
# Single source for the sidebar, project tabs, routes, breadcrumbs, route guards and the
# command menu index (Section 3.15). Order is render order. Labels are i18n keys in
# packages/i18n. Validated by packages/ia; owned by A06 after the Wave 1 contract freeze.
#
# Visibility is declared once per row of the 4.5.9 table and inherited by every node
# below it. Project tabs that share a page with a level-both module name it as their
# twin and take its visibility. List routes accept view, group, sort, filter and scope.
schemaVersion: 1
shell: atlas
home: home
params:
  org: { type: slug, reserved: [advance, sign, legal, partner, ical, api] }
  projectKey: { type: project-key }
  recordKey: { type: record-key }
  viewId: { type: uuid }
  objectKey: { type: slug }
  partnerSlug: { type: slug }
  document: { type: slug }
  token: { type: token }
  feedToken: { type: token }
globalQuery: { peek: recordKey }
audience:
  dimension: platform-role
  roles: [owner, admin, manager, member, collaborator, field, viewer]
chrome:
  sidebarTop: [action.search, home, inbox, my-work]
  sidebarPinned: [action.favorites, projects]
  mobileBottomBar: [home, inbox, action.search, my-work, action.menu]
personas:
  org-owner: []
  org-admin: []
  producer: [group.production]
  department-head: [group.production, group.operations]
  finance-lead: [group.commercial]
  production-coordinator: [group.operations]
  field-supervisor: [group.operations, group.people]
  field-employee: []
nodes:
  - id: group.chrome
    kind: group
    label: nav.atlas.groups.chrome
    placement: chrome
    children:
      - id: action.search
        kind: action
        label: nav.atlas.actions.search
      - id: action.favorites
        kind: action
        label: nav.atlas.actions.favorites
      - id: action.menu
        kind: action
        label: nav.atlas.actions.menu
  - id: group.workspace
    kind: group
    label: nav.atlas.groups.workspace
    placement: sidebar
    visibility:
      owner: full
      admin: full
      manager: full
      member: full
      collaborator: full
      field: full
      viewer: read
    children:
      - id: home
        kind: item
        label: nav.atlas.items.home
        route: "/{org}/home"
        level: org
        children:
          - id: home.today
            kind: page
            label: nav.atlas.pages.home.today
            route: "/{org}/home/today"
            list: { views: [feed, list], default: feed }
          - id: home.gate-readiness
            kind: page
            label: nav.atlas.pages.home.gateReadiness
            route: "/{org}/home/gate-readiness"
            list: { views: [table, matrix, chart], default: table }
          - id: home.alerts
            kind: page
            label: nav.atlas.pages.home.alerts
            route: "/{org}/home/alerts"
            list: { views: [list, inbox], default: list }
          - id: home.recent
            kind: page
            label: nav.atlas.pages.home.recent
            route: "/{org}/home/recent"
            list: { views: [list, table], default: list }
      - id: inbox
        kind: item
        label: nav.atlas.items.inbox
        route: "/{org}/inbox"
        level: org
        list: { views: [inbox, list], default: inbox }
      - id: my-work
        kind: item
        label: nav.atlas.items.myWork
        route: "/{org}/my-work"
        level: org
        list: { views: [list, table, board, calendar], default: list }
  - id: group.production
    kind: group
    label: nav.atlas.groups.production
    placement: sidebar
    visibility:
      owner: full
      admin: full
      manager: full
      member: full
      collaborator: assigned
      field: assigned
      viewer: read
    children:
      - id: projects
        kind: item
        label: nav.atlas.items.projects
        route: "/{org}/projects"
        level: org
        list: { views: [table, list, board, timeline, calendar], default: table }
        children:
          - id: projects.all
            kind: page
            label: nav.atlas.pages.projects.all
            route: "/{org}/projects/all"
            list: { views: [table, list, board, gallery], default: table }
          - id: projects.by-phase
            kind: page
            label: nav.atlas.pages.projects.byPhase
            route: "/{org}/projects/by-phase"
            list: { views: [board], default: board }
          - id: projects.portfolio-timeline
            kind: page
            label: nav.atlas.pages.projects.portfolioTimeline
            route: "/{org}/projects/portfolio-timeline"
            list: { views: [timeline, calendar], default: timeline }
          - id: projects.templates
            kind: page
            label: nav.atlas.pages.projects.templates
            route: "/{org}/projects/templates"
            list: { views: [list, gallery], default: list }
          - id: project
            kind: record
            label: nav.atlas.routes.project
            route: "/{org}/p/{projectKey}"
            children:
              - id: project.act.plan
                kind: group
                label: nav.atlas.acts.plan
                placement: tab-bar
                children:
                  - id: project.overview
                    kind: tab
                    label: nav.atlas.projectTabs.overview
                    route: "/{org}/p/{projectKey}/overview"
                  - id: project.scope
                    kind: tab
                    label: nav.atlas.projectTabs.scope
                    route: "/{org}/p/{projectKey}/scope"
                    list: { views: [tree, list, matrix], default: tree }
                  - id: project.gates
                    kind: tab
                    label: nav.atlas.projectTabs.gates
                    route: "/{org}/p/{projectKey}/gates"
                    list: { views: [list, board], default: list }
                  - id: project.schedule
                    kind: tab
                    label: nav.atlas.projectTabs.schedule
                    route: "/{org}/p/{projectKey}/schedule"
                    twin: schedule
                    list: { views: [timeline, calendar, list], default: timeline }
                  - id: project.work
                    kind: tab
                    label: nav.atlas.projectTabs.work
                    route: "/{org}/p/{projectKey}/work"
                    twin: work
                    list: { views: [list, table, board, calendar, timeline], default: list }
                  - id: project.show
                    kind: tab
                    label: nav.atlas.projectTabs.show
