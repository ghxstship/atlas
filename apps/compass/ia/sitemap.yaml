# Compass information architecture (Section 4.3 and 4.5.7).
# Single source for the tab bar, More menu, scan modes, settings and deep links
# (Section 3.15). Order is render order. Validated by packages/ia; owned by A17 after
# the Wave 1 contract freeze.
#
# Visibility keys are audiences: internal field users (field-supervisor stands for Field
# Supervisor and above), then each external role type. The five tabs are the same for
# everyone; the Crew tab renders only for field-supervisor. More menu additions for an
# external role come first, so internal users see the base list in the 4.5.7 order.
schemaVersion: 1
shell: compass
home: today
params:
  recordKey: { type: record-key }
audience:
  dimension: compass-audience
  roles:
    - field
    - field-supervisor
    - client
    - vendor
    - contractor
    - crew
    - staff
    - artist
    - artist-representative
    - sponsor
chrome: { tabBar: [today, schedule, scan, inbox, more, crew] }
scanContainer: scan
contentBlocks:
  - id: shifts
    label: nav.compass.content.shifts
  - id: tasks
    label: nav.compass.content.tasks
  - id: day-sheet
    label: nav.compass.content.daySheet
  - id: run-of-show
    label: nav.compass.content.runOfShow
  - id: engaged-shifts-and-positions
    label: nav.compass.content.engagedShiftsAndPositions
  - id: briefings
    label: nav.compass.content.briefings
  - id: call-times
    label: nav.compass.content.callTimes
  - id: dock-slot
    label: nav.compass.content.dockSlot
  - id: load-in-and-load-out-windows
    label: nav.compass.content.loadInAndLoadOutWindows
  - id: delivery-instructions
    label: nav.compass.content.deliveryInstructions
  - id: tasks-and-deliverables-due
    label: nav.compass.content.tasksAndDeliverablesDue
  - id: site-access-times
    label: nav.compass.content.siteAccessTimes
  - id: set-time
    label: nav.compass.content.setTime
  - id: hospitality
    label: nav.compass.content.hospitality
  - id: guest-list
    label: nav.compass.content.guestList
  - id: show-day-schedule
    label: nav.compass.content.showDaySchedule
  - id: approvals-waiting
    label: nav.compass.content.approvalsWaiting
  - id: activation-schedule
    label: nav.compass.content.activationSchedule
  - id: entitlement-checklist
    label: nav.compass.content.entitlementChecklist
contentProfiles:
  field:
    today: [shifts, tasks, day-sheet, run-of-show]
    scanModes:
      - mode: asset
        scope: all
      - mode: receiving
        scope: all
      - mode: credential
        scope: all
      - mode: lookup
        scope: all
  field-supervisor:
    today: [shifts, tasks, day-sheet, run-of-show]
    scanModes:
      - mode: asset
        scope: all
      - mode: receiving
        scope: all
      - mode: credential
        scope: all
      - mode: lookup
        scope: all
  client: { today: [show-day-schedule, approvals-waiting], scanModes: [] }
  vendor:
    today: [dock-slot, load-in-and-load-out-windows, delivery-instructions]
    scanModes:
      - mode: receiving
        scope: acknowledgment
      - mode: credential
        scope: own
  contractor:
    today: [tasks-and-deliverables-due, site-access-times]
    scanModes:
      - mode: credential
        scope: own
  crew:
    today: [engaged-shifts-and-positions, briefings, call-times]
    scanModes:
      - mode: credential
        scope: own
      - mode: asset
        scope: assigned
  staff:
    today: [engaged-shifts-and-positions, briefings, call-times]
    scanModes:
      - mode: credential
        scope: own
      - mode: asset
        scope: assigned
  artist:
    today: [day-sheet, set-time, call-times, hospitality, guest-list]
    scanModes:
      - mode: credential
        scope: own-and-party
  artist-representative:
    today: [day-sheet, set-time, call-times, hospitality, guest-list]
    scanModes:
      - mode: credential
        scope: own-and-party
  sponsor: { today: [activation-schedule, entitlement-checklist], scanModes: [] }
deepLinks:
  - pattern: compass://r/{recordKey}
    node: record
