appId: pro.ghxstship.compass
# What a new sign-in answers before anything else (ADR 0156): 18 or older, then the documents.
---
- extendedWaitUntil:
    visible:
      id: "legal-gate-age"
    timeout: 30000
- tapOn:
    id: "legal-gate-age-over"
- extendedWaitUntil:
    visible:
      id: "legal-gate-documents"
    timeout: 15000
- tapOn:
    id: "legal-gate-agree"
- tapOn:
    id: "legal-gate-accept"
