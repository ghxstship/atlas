appId: pro.ghxstship.compass
---
# Signs out from Settings, confirming when changes still wait to upload. Sign-out wipes the device.
# Tapped until More shows: right after a bundle reload the first tap can land before the tabs take touches.
- repeat:
    times: 4
    while:
      notVisible:
        id: "more"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 3000
# Centered, so the row is clear of the tab bar. A short menu (crew, vendor) cannot scroll Settings to the
# centre and already shows it whole, so a scroll that cannot centre it is not a failure.
- scrollUntilVisible:
    element:
      id: "more-settings"
    direction: DOWN
    centerElement: true
    optional: true
- tapOn:
    id: "more-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
- tapOn:
    id: "settings-sign-out"
# With changes still waiting, the first tap only warns and the button turns into the confirmation. Wait for
# either outcome: checking for the sign-in screen at once races the sign-out in progress.
- extendedWaitUntil:
    visible:
      id: "sign-in|settings-sign-out-queued"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "settings-sign-out-queued"
    commands:
      - tapOn:
          id: "settings-sign-out"
