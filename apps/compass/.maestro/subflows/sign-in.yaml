appId: pro.ghxstship.compass
---
# Signs in with the seeded demo account given in EMAIL; the password comes from XOS_DEMO_PASSWORD.
- launchApp:
    clearState: true
    permissions:
      camera: allow
      location: allow
- extendedWaitUntil:
    visible:
      id: "sign-in"
    timeout: 20000
- tapOn:
    id: "sign-in-toggle"
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${XOS_DEMO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible:
      id: "tab-bar"
    timeout: 30000
