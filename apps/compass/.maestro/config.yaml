# Maestro flows for the Compass field journeys (Wave 4 exit, walked on the iOS simulator by A39; the whole
# suite, kiosk and offline flows included, by A66). Run against a freshly reset local stack seeded with
# supabase/seeds (0010 identity, 0107 project, 0217 Compass data, 1090 the Demo Field Tech, 1490 the Demo Road Crew) and the app
# built against it. On an iOS simulator use scripts/maestro-ios.sh: it grants location, camera and
# microphone, starts the network helper that cuts the server for the offline flows (Maestro sets airplane
# mode only on Android) and passes the variables below. By hand:
#   maestro test -e XOS_DEMO_PASSWORD=<the demo password from 0010_demo_identity.sql> \
#     -e SUPABASE_URL=<local API URL> -e SUPABASE_ANON_KEY=<local anon key> apps/compass/.maestro
# supervisor-kiosk registers its own kiosk and PIN as the Demo Admin; pass KIOSK_DEVICE_KEY and
# KIOSK_PIN_1 to KIOSK_PIN_4 to use one registered beforehand. Against a development build also pass
# DEV_URL, the expo-development-client link to Metro. Flows run in the order below (Maestro matches it
# against each flow's name, so every flow is named after its file); those that change state (accepting
# and claiming shifts, the kiosk punch) expect the fresh seed.
flows:
  - "flows/*.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - field-sign-in
    - field-clock-in-out
    - field-shift-second-device
    - field-claim-open-shift
    - field-clock-offline
    - field-incident-report
    - field-resumable-upload
    - field-inspection-walk
    - field-gate-scan
    - field-receive-batch
    - field-asset-scan
    - field-nfc-scan
    - desk-asset-custody
    - field-run-of-show
    - handoff-open-record
    - supervisor-kiosk
    - supervisor-kiosk-rekey
    - field-expense-receipt
    - crew-external-today
    - crew-external-work
    - vendor-external-scan
    - multi-org-today
    - settings-identity-profile
    - settings-identity-privacy
    - settings-identity-account
    - settings-identity-security
    - settings-identity-organizations
    - account-delete
    - settings-sunlight-sign-out
