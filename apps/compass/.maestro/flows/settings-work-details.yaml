appId: pro.ghxstship.compass
# Settings, Work Details in Compass (A111, S4.5.6-44): a member records a shirt size and an emergency contact. Both
# save online with the member's session, and the Profile shows the contact read-only.
# Named after its file: config.yaml orders flows by name.
name: settings-work-details
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: field@example.com
- runFlow:
    file: ../subflows/open-route.yaml
    env:
      ROUTE: settings/work-details
- extendedWaitUntil:
    visible:
      id: "work-uniform"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "work-uniform-shirtSize"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "work-uniform-shirtSize"
- tapOn:
    id: "work-uniform-shirtSize-sheet-L"
- scrollUntilVisible:
    element:
      id: "work-uniform-save"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "work-uniform-save"
- extendedWaitUntil:
    visible:
      id: "work-uniform-saved"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "work-contact-fullName"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "work-contact-fullName"
- inputText: "Maestro Contact"
- tapOn:
    id: "work-contact-relationship"
- inputText: "Sibling"
- tapOn:
    id: "work-contact-phone"
- inputText: "305 555 0177"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "work-contact-add"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "work-contact-add"
- extendedWaitUntil:
    visible:
      id: "work-contacts-saved"
    timeout: 30000
- scrollUntilVisible:
    element: "Maestro Contact · Sibling"
    direction: UP
    timeout: 20000
# The Profile keeps them read-only, read from the server.
- runFlow:
    file: ../subflows/open-route.yaml
    env:
      ROUTE: profile
- scrollUntilVisible:
    element:
      id: "profile-emergency-contacts"
    direction: DOWN
    timeout: 30000
- assertVisible: "Maestro Contact · Sibling"
- scrollUntilVisible:
    element:
      id: "profile-uniform-sizes"
    direction: DOWN
    timeout: 20000
- assertVisible: "Shirt: L"
