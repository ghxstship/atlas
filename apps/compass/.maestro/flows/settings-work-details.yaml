appId: pro.ghxstship.compass
# Settings, Work Details in Compass (A111, S4.5.6-44): a member sees that uniform sizes and travel preferences moved to
# each project (R6a) and records an emergency contact. It saves online with the member's session, and the Profile
# shows the contact read-only, with no uniform sizes card.
# Named after its file: config.yaml orders flows by name.
name: settings-work-details
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: field@example.com
- runFlow:
    file: ../subflows/open-route.yaml
    env:
      ROUTE: settings/work-details
# Uniform sizes and travel preferences are asked per project since R6a: a notice says so, and no card edits them.
- extendedWaitUntil:
    visible:
      id: "work-details-moved"
    timeout: 30000
- assertNotVisible: "Uniform sizes"
- scrollUntilVisible:
    element:
      id: "work-contact-fullName"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "work-contact-fullName"
- inputText: "Maestro Contact"
- tapOn:
    id: "work-contact-relationship"
- inputText: "Sibling"
- tapOn:
    id: "work-contact-phone"
- inputText: "305 555 0177"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "work-contact-add"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "work-contact-add"
- extendedWaitUntil:
    visible:
      id: "work-contacts-saved"
    timeout: 30000
- scrollUntilVisible:
    element: "Maestro Contact · Sibling"
    direction: UP
    timeout: 20000
# The Profile keeps them read-only, read from the server.
- runFlow:
    file: ../subflows/open-route.yaml
    env:
      ROUTE: profile
- scrollUntilVisible:
    element:
      id: "profile-emergency-contacts"
    direction: DOWN
    timeout: 30000
- assertVisible: "Maestro Contact · Sibling"
- assertNotVisible: "Uniform sizes"
