appId: pro.ghxstship.compass
# Journey 66, claim an open shift under the org's claiming rule.
# Named after its file: config.yaml orders flows by name.
name: field-claim-open-shift
---
# Seed 0113 publishes an open rigging shift on March 14, 2027. The demo org keeps the default claiming rule,
# approval (scheduling.open_shift_claiming, migration 1322): the Demo Field Tech's claim uploads as a waiting
# claim for a supervisor to decide, and the shift stays open on the device until then.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: tech@example.com
- tapOn:
    id: "tab-schedule"
- scrollUntilVisible:
    element: "Claim"
    direction: DOWN
    timeout: 20000
- tapOn: "Claim"
- assertVisible:
    id: "schedule-notice"
- assertVisible: "Claim sent.*"
- extendedWaitUntil:
    notVisible:
      id: "sync-queued"
    timeout: 30000
# Nothing was refused: the claim uploaded and waits for a supervisor, so no change waits for the person.
- assertNotVisible:
    id: "sync-conflicts"
