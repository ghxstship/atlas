appId: pro.ghxstship.compass
# Journey 66, claim an open shift under the org's claiming rule.
# Named after its file: config.yaml orders flows by name.
name: field-claim-open-shift
---
# Seed 0113 publishes an open rigging shift on March 14, 2027. The Demo Field Tech (seed 1090) holds no
# shift that overlaps it, so claim_open_shift gives it to them; it moves to My Shifts at once and stays
# there once the claim uploads.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: tech@example.com
- tapOn:
    id: "tab-schedule"
- scrollUntilVisible:
    element: "Claim"
    direction: DOWN
    timeout: 20000
- tapOn: "Claim"
- assertVisible:
    id: "schedule-notice"
- assertVisible: "Shift claimed.*"
- extendedWaitUntil:
    notVisible:
      id: "sync-queued"
    timeout: 30000
# Nothing was refused: no change waits for a decision, and the claimed shift reads Accepted.
- assertNotVisible:
    id: "sync-conflicts"
- scrollUntilVisible:
    element: "Sun, Mar 14"
    direction: UP
- assertVisible: "No open shifts right now."
