appId: pro.ghxstship.compass
# Clock in at the venue, take a break, clock out.
# Named after its file: config.yaml orders flows by name.
name: field-clock-in-out
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: tech@example.com
# The Demo Field Tech (seed 1090) has no worked time after the reset day, so the clock-in overlaps
# nothing (SIM-001). The simulator stands inside Pier Site, the geofence of the demo project's venue
# (seed 0109); seed 0217's Northwind Pier venue is not the project's, so Field members never see it.
- setLocation:
    latitude: 25.7752
    longitude: -80.1855
- extendedWaitUntil:
    visible: "You're at Pier Site"
    timeout: 20000
- tapOn:
    id: "clock-button"
# On shift, the Live Activity card holds the break toggle and clock out.
- extendedWaitUntil:
    visible:
      id: "clock-live"
    timeout: 5000
- tapOn: "Start Break"
- assertVisible: ".*On Break.*"
- tapOn: "End Break"
- assertVisible: ".*On Shift.*"
- tapOn: "Clock Out"
- extendedWaitUntil:
    notVisible:
      id: "clock-live"
    timeout: 5000
# Every punch uploaded: nothing waits in the queue.
- tapOn:
    id: "tab-more"
- tapOn:
    id: "more-offline-queue"
- extendedWaitUntil:
    visible:
      id: "queue-empty"
    timeout: 15000
