appId: pro.ghxstship.compass
name: Field lead signs in and sees the five tabs
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: field@example.com
- assertVisible:
    id: "today"
- assertVisible:
    id: "tab-today"
- assertVisible:
    id: "tab-schedule"
- assertVisible:
    id: "tab-scan"
- assertVisible:
    id: "tab-inbox"
- assertVisible:
    id: "tab-more"
# The Crew tab is not asserted: the Field role holds safety.incident.dispatch, which Compass reads as
# supervisor mode, so Field members see it today (SIM-007).
- assertVisible:
    id: "clock-button"
