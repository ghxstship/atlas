appId: pro.ghxstship.compass
name: Check badges at the Main Gate
---
# The Main Gate zone sits at seed 0217's Northwind Pier venue; Field members see it because the project's
# access grid names it (migration 1092).
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: field@example.com
- tapOn:
    id: "tab-scan"
- tapOn:
    id: "scan-mode-credential"
- tapOn: "Main Gate"
# The simulator camera cannot see a badge, so the badge number is typed, as at a worn label.
- tapOn:
    id: "scan-manual"
- inputText: "CR-999999"
- tapOn:
    id: "scan-manual-submit"
- assertVisible: ".*Access denied.*"
