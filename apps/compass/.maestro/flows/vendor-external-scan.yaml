appId: pro.ghxstship.compass
# Vendor sees purchase orders, deliveries and submittals as Compass screens (A92), never internal tools.
# Named after its file: config.yaml orders flows by name.
name: vendor-external-scan
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: vendor@example.com
- tapOn:
    id: "tab-more"
# Purchase orders, deliveries and submittals are Compass screens; nothing opens Gateway from the menu.
- assertVisible:
    id: "more-purchase-orders"
- assertVisible:
    id: "more-deliveries"
- assertVisible:
    id: "more-submittals"
- assertNotVisible:
    id: "more-open-gateway"
- assertNotVisible:
    id: "more-inspections"
# The demo vendor's engagement is Complete (seed 0228), so Compass holds none of its project's orders
# (Section 8.7): the screen says so instead of showing an empty page.
- tapOn:
    id: "more-purchase-orders"
- extendedWaitUntil:
    visible:
      id: "external-purchase-orders-empty"
    timeout: 30000
