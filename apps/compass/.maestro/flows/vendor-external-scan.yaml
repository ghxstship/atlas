appId: pro.ghxstship.compass
# Vendor sees purchase orders, deliveries and submittals as Compass screens (A92), never internal tools.
# Named after its file: config.yaml orders flows by name.
name: vendor-external-scan
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: vendor@example.com
- tapOn:
    id: "tab-more"
# Purchase orders, deliveries and submittals are Compass screens; nothing opens Gateway from the menu.
# On the 320 by 640 Android emulator this screen runs below the fold; each target is scrolled to first
# (a no-op where it is already in view).
- scrollUntilVisible:
    element:
      id: "more-purchase-orders"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible:
    id: "more-purchase-orders"
- scrollUntilVisible:
    element:
      id: "more-deliveries"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible:
    id: "more-deliveries"
- scrollUntilVisible:
    element:
      id: "more-submittals"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible:
    id: "more-submittals"
- assertNotVisible:
    id: "more-open-gateway"
- assertNotVisible:
    id: "more-inspections"
# The demo vendor's engagement is Complete (seed 0228), so Compass holds none of its project's orders
# (Section 8.7): the screen says so instead of showing an empty page.
- scrollUntilVisible:
    element:
      id: "more-purchase-orders"
    direction: UP
    visibilityPercentage: 100
    timeout: 15000
- tapOn:
    id: "more-purchase-orders"
- extendedWaitUntil:
    visible:
      id: "external-purchase-orders-empty"
    timeout: 30000
