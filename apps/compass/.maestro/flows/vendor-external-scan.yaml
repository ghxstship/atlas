appId: pro.ghxstship.compass
# Vendor reaches purchase orders and deliveries in Gateway, never internal tools.
# Named after its file: config.yaml orders flows by name.
name: vendor-external-scan
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: vendor@example.com
- tapOn:
    id: "tab-more"
# Purchase orders, deliveries and submittals open in Gateway, named on one row (finding A59-026).
- assertVisible:
    id: "more-open-gateway"
- assertVisible: ".*Purchase Orders.*Deliveries.*Submittals.*"
- assertNotVisible:
    id: "more-purchase-orders"
- assertNotVisible:
    id: "more-inspections"
