appId: pro.ghxstship.compass
name: Vendor reaches purchase orders and deliveries in Gateway, never internal tools
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: vendor@example.com
- tapOn:
    id: "tab-more"
# Purchase orders, deliveries and submittals open in Gateway, named on one row (finding A59-026).
- assertVisible:
    id: "more-open-gateway"
- assertVisible: ".*Purchase Orders.*Deliveries.*Submittals.*"
- assertNotVisible:
    id: "more-purchase-orders"
- assertNotVisible:
    id: "more-inspections"
