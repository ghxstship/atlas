appId: pro.ghxstship.compass
# B8 (RRR-232, G-145): In and Out at a gate, and a supervisor's override of a denial.
# Named after its file: config.yaml orders flows by name.
name: field-gate-in-out-override
---
# Run as the Demo Producer, who issues credentials on NWS and so may override (cached once online). BADGE is the
# Demo Field Lead's CREW badge number from seed 0217 (CR-...), for example from the Atlas Issued page. Backstage opens
# to that category at noon New York time on the seeded day, and no sooner than eight hours after the seed ran, so on a
# freshly seeded stack an In scan there is denied as outside the access window, which is the denial this flow
# overrides.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: producer@example.com
- tapOn:
    id: "tab-scan"
- tapOn:
    id: "scan-mode-credential"
- tapOn: "Main Gate"
# The scan page scrolls on the 320 by 640 Android emulator: the result row and Done sit below the access
# points, and the code field and mode chips above them once it has scrolled.
- scrollUntilVisible:
    element:
      id: "scan-direction"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible:
    id: "scan-direction"
# Out is never refused, and it skips the device's decision.
- tapOn: "Out"
- tapOn:
    id: "scan-manual"
- inputText: "${BADGE}"
- tapOn:
    id: "scan-manual-submit"
- scrollUntilVisible:
    element:
      text: ".*Exit recorded.*"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: ".*Exit recorded.*"
# The direction stays on this device across restarts, and changing zone keeps it, so go back to In for the denial.
- scrollUntilVisible:
    element:
      text: "Backstage"
    direction: UP
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "Backstage"
- scrollUntilVisible:
    element:
      id: "scan-direction"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- tapOn: "In"
- scrollUntilVisible:
    element:
      id: "scan-manual"
    direction: UP
    visibilityPercentage: 100
    timeout: 15000
- tapOn:
    id: "scan-manual"
- inputText: "${BADGE}"
- tapOn:
    id: "scan-manual-submit"
- scrollUntilVisible:
    element:
      text: ".*Access denied.*"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: ".*Access denied.*"
- tapOn:
    id: "scan-override"
- tapOn:
    id: "scan-override-reason"
- inputText: "Escorted by the production office."
# The keyboard covers the sheet's footer on a small screen (run 43690467981: the Android emulator's
# keyboard rose to the reason field, and the submit button left the hierarchy).
- hideKeyboard
- tapOn:
    id: "scan-override-submit"
- scrollUntilVisible:
    element:
      text: ".*Override recorded.*"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: ".*Override recorded.*"
- scrollUntilVisible:
    element:
      id: "scan-direction"
    direction: UP
    visibilityPercentage: 100
    timeout: 15000
- assertNotVisible:
    id: "scan-override"
