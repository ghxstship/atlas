appId: pro.ghxstship.compass
# Journey 38, delete an account from inside Compass and receive confirmation.
# Named after its file: config.yaml orders flows by name.
name: account-delete
---
# A throwaway account with no organization or engagement lands on the screen Compass shows such a sign-in;
# it offers Delete Account there, as Settings, Account does for members and crew (SIM-004).
- runScript:
    file: ../scripts/throwaway-account.js
- assertTrue: ${output.throwaway.status == 200}
- launchApp:
    stopApp: true
- runFlow:
    when:
      true: ${typeof DEV_URL !== "undefined" && DEV_URL !== ""}
    file: ../subflows/open-dev-bundle.yaml
- extendedWaitUntil:
    visible:
      id: "sign-in|tab-bar|identity-failed"
    timeout: 120000
- runFlow:
    when:
      visible:
        id: "tab-bar"
    file: ../subflows/sign-out.yaml
- runFlow:
    when:
      visible:
        id: "identity-failed"
    commands:
      - tapOn:
          id: "identity-failed-sign-out"
- tapOn:
    id: "sign-in-toggle"
- tapOn:
    id: "sign-in-email"
- inputText: ${output.throwaway.email}
- tapOn:
    id: "sign-in-password"
- inputText: ${XOS_DEMO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS offers to save the password after a password sign-in; it covers the app, hiding the screen
# underneath from Maestro, until answered. Android offers none, so the wait for it may time out.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "identity-failed"
    timeout: 30000
- tapOn:
    id: "identity-failed-delete-account"
- extendedWaitUntil:
    visible:
      id: "account-email"
    timeout: 20000
- assertVisible: "What is kept, and why"
- tapOn:
    id: "account-email"
- inputText: ${output.throwaway.email}
- hideKeyboard
# Hold to delete: a tap never deletes an account.
- longPressOn:
    id: "account-delete"
- extendedWaitUntil:
    visible:
      id: "account-deleted"
    timeout: 20000
- assertVisible: "Your account is deleted"
- tapOn:
    id: "account-deleted-done"
- extendedWaitUntil:
    visible:
      id: "sign-in"
    timeout: 20000
