appId: pro.ghxstship.compass
name: Kiosk mode refuses a wrong PIN without revealing anything, then clocks a worker in
---
# Needs a kiosk registered in Atlas (app.register_kiosk_device) and a kiosk PIN for the Demo Field Tech
# (app.set_kiosk_pin): pass the device key as KIOSK_DEVICE_KEY and the PIN's four digits as KIOSK_PIN_1
# to KIOSK_PIN_4. The Demo Admin holds org.time_attendance.write.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: admin@example.com
- repeat:
    times: 4
    while:
      notVisible:
        id: "more"
    commands:
      - tapOn:
          id: "tab-more"
      - waitForAnimationToEnd:
          timeout: 3000
- scrollUntilVisible:
    element:
      id: "more-kiosk"
    direction: DOWN
- tapOn:
    id: "more-kiosk"
# A device that already holds its kiosk key opens straight on the roster.
- extendedWaitUntil:
    visible:
      id: "kiosk-key|kiosk-search"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "kiosk-key"
    commands:
      - tapOn:
          id: "kiosk-key"
      - inputText: ${KIOSK_DEVICE_KEY}
      - hideKeyboard
      - tapOn:
          id: "kiosk-start"
- tapOn:
    id: "kiosk-search"
- inputText: "Tech"
- hideKeyboard
- tapOn: "Demo Field Tech"
# A wrong PIN says only how many attempts are left.
- tapOn:
    id: "kiosk-key-0"
- tapOn:
    id: "kiosk-key-0"
- tapOn:
    id: "kiosk-key-0"
- tapOn:
    id: "kiosk-key-0"
- tapOn:
    id: "kiosk-submit"
- assertVisible: "4 attempts left"
# The right PIN clocks the worker in through the kiosk-punch Edge Function.
- tapOn:
    id: "kiosk-key-${KIOSK_PIN_1}"
- tapOn:
    id: "kiosk-key-${KIOSK_PIN_2}"
- tapOn:
    id: "kiosk-key-${KIOSK_PIN_3}"
- tapOn:
    id: "kiosk-key-${KIOSK_PIN_4}"
- tapOn:
    id: "kiosk-submit"
- extendedWaitUntil:
    visible: "Demo Field Tech clocked in"
    timeout: 15000
