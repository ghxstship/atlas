appId: pro.ghxstship.compass
# Legal issue 4 (ADR 0156): a new sign-in answers the age and accepts the Mobile EULA and Worker Terms before anything else, and the next launch does not ask again.
# Named after its file: config.yaml orders flows by name.
name: first-sign-in-acceptance
---
- runScript:
    file: ../scripts/throwaway-account.js
- assertTrue: ${output.throwaway.status == 200}
- launchApp:
    stopApp: true
- runFlow:
    when:
      true: ${typeof DEV_URL !== "undefined" && DEV_URL !== ""}
    file: ../subflows/open-dev-bundle.yaml
- extendedWaitUntil:
    visible:
      id: "sign-in|tab-bar|identity-failed|legal-gate-age"
    timeout: 120000
- runFlow:
    when:
      visible:
        id: "tab-bar"
    file: ../subflows/sign-out.yaml
- runFlow:
    when:
      visible:
        id: "identity-failed"
    commands:
      - tapOn:
          id: "identity-failed-sign-out"
- tapOn:
    id: "sign-in-toggle"
- tapOn:
    id: "sign-in-email"
- inputText: ${output.throwaway.email}
- tapOn:
    id: "sign-in-password"
- inputText: ${XOS_DEMO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
# iOS offers to save the password after a password sign-in; it covers the app until answered.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow: ../subflows/first-sign-in-answers.yaml
- extendedWaitUntil:
    visible:
      id: "identity-failed"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "identity-failed"
    timeout: 60000
- assertNotVisible:
    id: "legal-gate-age"
- tapOn:
    id: "identity-failed-delete-account"
