appId: pro.ghxstship.compass
# Switch to Sunlight and sign out, which wipes the device.
# Named after its file: config.yaml orders flows by name.
name: settings-sunlight-sign-out
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: field@example.com
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element:
      id: "more-settings"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "more-settings"
- tapOn:
    id: "settings-theme-sunlight"
- assertVisible: "Highest contrast for bright sun."
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
- tapOn:
    id: "settings-sign-out"
- extendedWaitUntil:
    visible:
      id: "sign-in"
    timeout: 10000
