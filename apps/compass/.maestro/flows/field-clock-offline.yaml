appId: pro.ghxstship.compass
name: Clock in during airplane mode, then the queue drains on reconnect
# CI runs this flow on Android only (apps/compass/scripts/maestro-ci.sh --exclude-tags airplane-mode).
tags:
  - airplane-mode
---
# Maestro toggles airplane mode on Android emulators; on iOS simulators run this flow on Android or
# disconnect the host network by hand at the marked step.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: tech@example.com
# Pier Site, the demo project's venue geofence (seed 0109); the Field Tech can clock in (SIM-001).
- setLocation:
    latitude: 25.7752
    longitude: -80.1855
- extendedWaitUntil:
    visible: "You're at Pier Site"
    timeout: 20000
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: "sync-offline"
    timeout: 15000
- tapOn:
    id: "clock-button"
- assertVisible:
    id: "clock-live"
- assertVisible:
    id: "clock-notice"
# The offline banner shows the queued count beside its message; screen readers hear it as words.
- assertVisible: ".*offline.*"
- assertVisible: "1 change waiting to upload"
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: "sync-offline"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "sync-queued"
    timeout: 30000
- tapOn: "Clock Out"
