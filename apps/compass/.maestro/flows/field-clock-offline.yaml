appId: pro.ghxstship.compass
name: Clock in during airplane mode, then the queue drains on reconnect
---
# Maestro toggles airplane mode on Android emulators; on iOS simulators run this flow on Android or
# disconnect the host network by hand at the marked step.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: field@example.com
- setLocation:
    latitude: 25.7795
    longitude: -80.1860
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: "sync-offline"
    timeout: 15000
- tapOn:
    id: "clock-button"
- assertVisible:
    id: "clock-live"
- assertVisible:
    id: "clock-notice"
# The offline banner shows the queued count; assistive technology hears it as words.
- assertVisible: ".*offline.*\\(1\\).*"
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: "sync-offline"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "sync-queued"
    timeout: 30000
- tapOn: "Clock Out"
