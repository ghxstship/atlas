appId: pro.ghxstship.compass
# Follow the live run of show in show mode.
# Named after its file: config.yaml orders flows by name.
name: field-run-of-show
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: field@example.com
- tapOn:
    id: "tab-more"
# The field menu can be longer than the screen (an Android emulator): bring the row into view first.
- scrollUntilVisible:
    element:
      id: "more-show"
    direction: DOWN
    centerElement: true
    optional: true
- tapOn:
    id: "more-show"
- assertVisible:
    id: "run-of-show"
- assertVisible: "Walk-in Music Out"
- assertVisible:
    id: "next-cue-countdown"
# Pick a department once: the current and next cue cards show its call (ADR 0131).
- tapOn:
    id: "show-department-lighting"
- assertVisible:
    id: "your-call-next"
- tapOn:
    id: "show-department-all"
- tapOn:
    id: "show-mode"
- assertVisible: "Exit Show Mode"
- tapOn:
    id: "show-mode"
