appId: pro.ghxstship.compass
# The crew member's certifications and documents on Profile, online and then offline (A109, Section 4.3 item 13).
# Named after its file: config.yaml orders flows by name.
name: profile-credentials
# Tagged for runs that can take the device or the server offline: airplane mode on Android, the network
# helper on iOS (apps/compass/scripts/maestro-network.ts). A run without either excludes the tag.
tags:
  - airplane-mode
---
# The demo crew person holds Arena Rigging, recorded and verified by the demo org (seed 0230), and keeps a
# passport in Work Details (seed 1340). Both download with the rest of their work (api_external.my_profile_*, 1730).
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: crew@example.com
- runFlow:
    file: ../subflows/open-route.yaml
    env:
      ROUTE: profile
- extendedWaitUntil:
    visible:
      id: "profile-certifications"
    timeout: 30000
- extendedWaitUntil:
    visible: "Arena Rigging"
    timeout: 30000
- assertVisible: ".*Verified by.*"
- scrollUntilVisible:
    element:
      id: "profile-documents"
    direction: DOWN
- assertVisible: "Passport"
- assertVisible: ".*Expires Apr 30, 2031.*"
# Offline: Android turns on airplane mode; on iOS the network helper stops the local stack's API gateway.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible:
            id: "sync-offline"
          timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: ../scripts/network.js
          env:
            STEP: offline
      - assertTrue: ${output.network.ok}
# Compass starts again with no server: it opens on the identity it kept and reads Profile from the device.
- launchApp:
    stopApp: true
- runFlow:
    when:
      true: ${typeof DEV_URL !== "undefined" && DEV_URL !== ""}
    file: ../subflows/open-dev-bundle.yaml
- extendedWaitUntil:
    visible:
      id: "tab-bar"
    timeout: 120000
- runFlow:
    file: ../subflows/open-route.yaml
    env:
      ROUTE: profile
- extendedWaitUntil:
    visible: "Arena Rigging"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "profile-documents"
    direction: DOWN
- assertVisible: "Passport"
# Back online for the flows after this one.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
      - extendedWaitUntil:
          notVisible:
            id: "sync-offline"
          timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: ../scripts/network.js
          env:
            STEP: online
      - assertTrue: ${output.network.ok}
