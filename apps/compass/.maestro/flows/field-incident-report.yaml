appId: pro.ghxstship.compass
# Journeys 16 and 54, report an incident in three steps with photos and a voice note, filed once.
# Named after its file: config.yaml orders flows by name.
name: field-incident-report
---
# Offline (journey 54): the three steps, the photos, the voice notes and the submit all happen with no
# server. Android goes into airplane mode; on iOS the network helper (scripts/maestro-network.ts, started
# by scripts/maestro-ios.sh) stops the local stack's API gateway instead. On reconnect the report, its
# photos and its voice note replay once, keyed by their device-minted ids.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: tech@example.com
- setLocation:
    latitude: 25.7752
    longitude: -80.1855
- tapOn:
    id: "tab-more"
- tapOn:
    id: "more-incidents"
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: ../scripts/network.js
          env:
            STEP: offline
      - assertTrue: ${output.network.ok}
- tapOn:
    id: "incident-report"
- assertVisible: "Step 1 of 3"
# Level 2 - Major from the canon Incident Severity grid (not critical, so no hold to confirm).
- tapOn: "Level 2 - Major"
- assertVisible:
    id: "incident-location"
- tapOn:
    id: "incident-next"
- tapOn:
    id: "incident-title"
- inputText: "Guest slipped near Gate A"
- hideKeyboard
# Two photos; the simulator's capture returns an image without a camera.
- tapOn:
    id: "incident-photo"
- tapOn:
    id: "photo-take"
- assertVisible: "1 attached"
- tapOn:
    id: "incident-photo"
- tapOn:
    id: "photo-take"
- assertVisible: "2 attached"
# A voice note: hold to record, play it back; a second one is recorded and deleted (SIM-003). Grant the
# microphone first; the simulator records from the Mac's input.
- longPressOn:
    id: "incident-voice-record"
- extendedWaitUntil:
    visible:
      id: "incident-voice-note-0"
    timeout: 5000
- tapOn:
    id: "incident-voice-play-0"
- longPressOn:
    id: "incident-voice-record"
- extendedWaitUntil:
    visible:
      id: "incident-voice-note-1"
    timeout: 5000
- tapOn:
    id: "incident-voice-delete-1"
- assertNotVisible:
    id: "incident-voice-note-1"
- tapOn:
    id: "incident-submit"
- extendedWaitUntil:
    visible:
      id: "incident-filed"
    timeout: 10000
- assertVisible: "Guest slipped near Gate A"
# Filed on the device only: the report and its three files wait to upload.
- extendedWaitUntil:
    visible: ".*changes waiting to upload.*"
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- runFlow:
    when:
      platform: iOS
    commands:
      - runScript:
          file: ../scripts/network.js
          env:
            STEP: online
      - assertTrue: ${output.network.ok}
# The retry backoff grows while the server is away, so the drain may wait for the next attempt.
- extendedWaitUntil:
    notVisible:
      id: "sync-queued|sync-offline"
    timeout: 120000
- runScript:
    file: ../scripts/incident-filed-once.js
    env:
      EMAIL: tech@example.com
      TITLE: "Guest slipped near Gate A"
- assertTrue: ${output.filed.status == 200 && output.filed.incidents == 1 && output.filed.photos == 2 && output.filed.voiceNotes == 1}
