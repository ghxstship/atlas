# Secret scan configuration (Section 9). Extends the default gitleaks rules and allowlists
# only exact values that were reviewed and verified fake: documented API examples, a test
# fixture and a canon column name. Add a value here only after confirming it is not a secret.
[extend]
useDefault = true

[[allowlists]]
description = "Reviewed example and fixture values (2026-10-11)"
regexTarget = "secret"
regexes = [
  '''^regular_hours_1_0x$''',
  '''^xos_live_7Hq2$''',
  '''^xos_live_7Hq2wQ1nC8vL0pR4tY6u$''',
  '''^xinv_3f9a1c0d7e2b4a6f8c1d0e9b7a5c3f1e$''',
  '''^0192f1e2-7c3a-7b4d-9e8f-1a2b3c4d5e6f$''',
  '''^abcdefghijklmnop1234$''',
]

[[allowlists]]
description = "Stripe lookup keys of the ATLVS catalogue v3 in packages/schemas/plans.yaml (public identifiers, 2026-10-14)"
regexTarget = "secret"
regexes = [
  '''^atlvs_plan_(core|pro|team|enterprise)(_unlimited_(monthly|annual))?_v3$''',
  # Stripe lookup keys of the v4 catalogue in packages/schemas/plans.yaml (public identifiers, 2026-10-20)
  '''^xos_(plan|seat|addon)_[a-z0-9_]+_v4$''',
]

[[allowlists]]
description = "Reviewed fake and public values in fixtures and API examples (2026-10-16)"
regexTarget = "secret"
regexes = [
  # OpenAPI document examples (generated from the catalog) and an identity test fixture
  '''^whsec_5Jk2pQ8xL1nV7cR3$''',
  '''^cal_9fQ2mX4vT7kL1pR8$''',
  '''^xos-verify=6f1c2d$''',
  '''^xos-verify-7d1c$''',
  # The public anon key of every local Supabase stack (issuer supabase-demo), used by Playwright locally
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9\.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0$''',
  # The jwt.io sample token in the log redaction test
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U$''',
  # A fake Stripe test key in the billing unit test
  '''^sk_test_abcdefghij$''',
  # Fake Stripe keys in the setup script's test-mode guard tests (packages/platform/test/stripe-setup.test.ts, 2026-10-20)
  '''^(sk|rk)_test_abcdefgh123$''',
  '''^sk_live_abcdefgh123$''',
  # The kiosk device key example in the OpenAPI document (catalog/modules/crew.ts, A50, 2026-10-19)
  '''^xkio_9f2c4e1a7b3d5f6e8a0c2e4f6a8b0d2c4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b$''',
  # A TypeScript type name the Dropbox rule mistakes for a token
  '''^StorageProvider$''',
]

[[allowlists]]
description = "SHA-256 digests of the frozen v1 contract (gate 20), not secrets"
paths = ['''^packages/api/src/catalog/frozen-v1\.digest\.json$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']


[[allowlists]]
description = "Reviewed fake values and non-secret identifiers on batch-c (2026-10-24)"
regexTarget = "secret"
regexes = [
  # Fixtures: a fake anon key (read-replica test), a fake Drive token (import worker test), the session id an e2e
  # journey inserts, and an earlier spelling of the custom-domain verification token fixture
  '''^anon-key-for-tests-0123456789$''',
  '''^ya29-fixture$''',
  '''^6f1c3a52-0d1e-4b8e-9a4f-1d2c3b4a5e6f$''',
  '''^xos-verify-6f1c2d$''',
  # A message key the certified payroll panel passes as its success copy
  '''^compliance\.wh347\.saved$''',
  # Keyboard shortcut chords in the generated shortcut registry
  '''^(Mod|Ctrl)\+Shift\+Tab$''',
]
