# The XOS Python SDK. Runtime code is hand-written in src/xos_sdk/_runtime; src/xos_sdk/_generated
# is produced from packages/api/openapi/v1.json by `pnpm --filter @ghxstship/xos-sdk generate` and never edited.
# Standard library only: no runtime dependencies.

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xos-sdk"
version = "4.0.0"
description = "Python SDK for the XOS public API."
readme = "README.md"
authors = [{ name = "GHXSTSHIP Industries LLC" }]
keywords = ["xos", "atlas", "api", "sdk", "openapi"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ghxstship/atlas/tree/main/packages/sdk-python"
Issues = "https://github.com/ghxstship/atlas/issues"
Source = "https://github.com/ghxstship/atlas/tree/main/packages/sdk-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xos_sdk = ["py.typed"]
