# Notification kind registry (Section 3.15): the single source of notification kinds, the preference
# matrix and the templates index. Copy never lives here: every kind's subject and body come from the
# packages/i18n `email` namespace under `email.kinds.<subject>.<event>`, in every locale and on every
# channel (email subject and body, push title and body, SMS body).
#
# After editing this file run `pnpm --filter @xos/schemas generate:notifications`. It rewrites:
#   * the seed migration (NOTIFICATION_KIND_SEED_MIGRATION in src/notifications/sql.ts), an idempotent
#     upsert of the database reference rows (private.notification_categories, private.channel_defaults,
#     private.email_templates, private.notification_templates);
#   * its pgTAP drift test, which fails when the database holds a kind, category, channel default or email
#     template this file does not name, or misses one it does;
#   * src/notifications/registry.generated.ts: the preference matrix and the templates index the apps and
#     the senders read.
# The @xos/schemas tests fail while any generated file differs from this file. Applied migrations are
# never edited (ADR 0004): when this file changes after the seed has shipped, move
# NOTIFICATION_KIND_SEED_MIGRATION to the next number in your own range and regenerate.
#
# Fields
#   channels:        every channel, with whether it is on when nobody chose (private.channel_defaults)
#   email_templates: React Email templates in packages/email (transactional email carries no unsubscribe link)
#   categories:      preference matrix rows; urgent categories bypass quiet hours and digests
#   kinds:           kind (subject.event), its category, its email template (default notification), an
#                    optional push category: the actionable category Compass registers (ADR 0030), and
#                    bypasses_quiet_hours for the few kinds that reach a person even during quiet hours
#
# Quiet hours (ADR 0033 decision 35): texts and pushes wait out the person's quiet hours, and texts also wait
# out 21:00 to 08:00 in their time zone when they set none; held texts go out as one summary. Only the kinds
# flagged bypasses_quiet_hours below go at once, and the list stays short: safety alerts, and a change to a
# shift starting within 12 hours (`starts_within_hours`, read from the startsAt argument). A mandatory or
# urgent category alone never bypasses. Sign-in and verification codes are sent by Supabase Auth itself, never
# through this queue, so they are never held.

version: 1

channels:
  - code: In App
    default: true
  - code: Email
    default: true
  - code: SMS
    default: false
  - code: Push
    default: true

email_templates:
  - code: notification
    transactional: false
    description: "One notification: what happened, on which record, with a link to open it."
  - code: digest
    transactional: false
    description: Several notifications gathered into one daily or weekly email.
  - code: invite
    transactional: true
    description: An invitation to join an organization.
  - code: report_delivery
    transactional: false
    description: A scheduled report attached as PDF, CSV or .xlsx.
  - code: export_ready
    transactional: true
    description: A requested export is ready to download.
  - code: import_finished
    transactional: true
    description: An import finished validating or committing.
  - code: dsar_received
    transactional: true
    description: Acknowledges a data subject request and states its due date.

categories:
  - code: mentions
    urgent: false
    order: 1
  - code: assignments
    urgent: false
    order: 2
  - code: approvals
    urgent: false
    order: 3
  - code: comments
    urgent: false
    order: 4
  - code: schedule
    urgent: false
    order: 5
  - code: finance
    urgent: false
    order: 6
  - code: safety
    urgent: true
    order: 7
  - code: account
    urgent: true
    order: 8
  - code: reports
    urgent: false
    order: 9
  - code: imports
    urgent: false
    order: 10
  - code: messages
    urgent: false
    order: 40
  - code: feed
    urgent: false
    order: 41
  - code: opportunities
    urgent: false
    order: 50
  - code: expiry_reminders
    urgent: false
    order: 51

kinds:
  # Mentions, assignments, approvals and comments (0520, 1140)
  - kind: mention.created
    category: mentions
  - kind: assignment.created
    category: assignments
  - kind: approval.requested
    category: approvals
    push_category: approval_request
  - kind: approval.decided
    category: approvals
  - kind: comment.created
    category: comments
  # Schedule (0520, 0800)
  - kind: shift.assigned
    category: schedule
  - kind: shift.changed
    category: schedule
    bypasses_quiet_hours:
      starts_within_hours: 12
  - kind: event.invited
    category: schedule
  # Finance (0520, 1131)
  - kind: invoice.approved
    category: finance
  - kind: invoice.submitted
    category: finance
  - kind: invoice.scheduled
    category: finance
  - kind: invoice.paid
    category: finance
  # Safety (0520, 0800)
  - kind: incident.reported
    category: safety
    bypasses_quiet_hours: true
  - kind: occupancy.threshold
    category: safety
    bypasses_quiet_hours: true
  - kind: weather.alert
    category: safety
    bypasses_quiet_hours: true
  # Account (0520, 0560, 1203)
  - kind: account.security_changed
    category: account
  - kind: billing.payment_failed
    category: account
  - kind: billing.read_only
    category: account
  - kind: access.break_glass_started
    category: account
  # Org lifecycle: trial, deletion and recovery, ownership, white label, partners (A79, 1350 to 1355)
  - kind: billing.trial_ending
    category: account
  - kind: billing.trial_ended
    category: account
  - kind: organization.deletion_requested
    category: account
  - kind: organization.deletion_recovered
    category: account
  - kind: organization.ownership_offered
    category: account
  - kind: organization.ownership_accepted
    category: account
  - kind: organization.ownership_declined
    category: account
  - kind: organization.white_label_reverting
    category: account
  - kind: organization.white_label_reverted
    category: account
  - kind: partner.client_left
    category: account
  # Reports and imports (0520)
  - kind: report.delivered
    category: reports
    email_template: report_delivery
  - kind: import.finished
    category: imports
    email_template: import_finished
  - kind: export.ready
    category: imports
    email_template: export_ready
  # Workforce suite (0800)
  - kind: message.received
    category: messages
  - kind: announcement.posted
    category: feed
  - kind: survey.opened
    category: feed
  - kind: recognition.received
    category: feed
  - kind: training.assigned
    category: assignments
  - kind: help_request.assigned
    category: assignments
  # Marketplace alerts and expiry reminders (A89: 1462 matcher, 1463 reminder job)
  - kind: opportunity.matched
    category: opportunities
    channels: [In App, Email, Push]
  - kind: onboarding.item_expiring
    category: expiry_reminders
  - kind: certification.expiring
    category: expiry_reminders
  - kind: document.expiring
    category: expiry_reminders
