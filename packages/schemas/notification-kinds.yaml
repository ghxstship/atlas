# Notification kind registry (Section 3.15): the single source of notification kinds, the preference
# matrix and the templates index. Copy never lives here: every kind's subject and body come from the
# packages/i18n `email` namespace under `email.kinds.<subject>.<event>`, in every locale and on every
# channel (email subject and body, push title and body, SMS body).
#
# After editing this file run `pnpm --filter @xos/schemas generate:notifications`. It rewrites:
#   * the seed migration (NOTIFICATION_KIND_SEED_MIGRATION in src/notifications/sql.ts), an idempotent
#     upsert of the database reference rows (private.notification_categories, private.channel_defaults,
#     private.email_templates, private.notification_templates);
#   * its pgTAP drift test, which fails when the database holds a kind, category, channel default or email
#     template this file does not name, or misses one it does;
#   * src/notifications/registry.generated.ts: the preference matrix and the templates index the apps and
#     the senders read.
# The @xos/schemas tests fail while any generated file differs from this file. Applied migrations are
# never edited (ADR 0004): when this file changes after the seed has shipped, move
# NOTIFICATION_KIND_SEED_MIGRATION to the next number in your own range and regenerate.
#
# Fields
#   channels:        every channel, with whether it is on when nobody chose (private.channel_defaults)
#   email_templates: React Email templates in packages/email (transactional email carries no unsubscribe link)
#   categories:      preference matrix rows; urgent categories bypass quiet hours and digests
#   kinds:           kind (subject.event), its category, its email template (default notification), an
#                    optional push category: the actionable category Compass registers (ADR 0030),
#                    bypasses_quiet_hours for the few kinds that reach a person even during quiet hours, and
#                    either emitted_by or deferred:
#     emitted_by:    every place that sends the kind: the migration function (or module) that calls private.notify
#                    with it, as path#symbol of a migration that defines it, and the test that observes the
#                    notification. test/notifications/emitters.test.ts checks each one at the function's latest
#                    definition across every migration, so a later redefinition (yours or a merged branch's) passes
#                    while it still sends the kind, and a kind nothing sends cannot be added.
#     deferred:      { reason, decision } for a kind nothing sends yet, naming the owner decision or work package
#                    it waits on (RRR-125).
#
# Quiet hours (ADR 0033 decision 35): texts and pushes wait out the person's quiet hours, and texts also wait
# out 21:00 to 08:00 in their time zone when they set none; held texts go out as one summary. Only the kinds
# flagged bypasses_quiet_hours below go at once, and the list stays short: safety alerts, a change to the
# person's sign-in security or a recovery code used on their account, emergency access taken in their org, and
# a shift assigned or changed that starts within 12 hours (`starts_within_hours`, read from the startsAt
# argument; ADR 0033 decision 62). Billing notices wait until morning. A mandatory or urgent category alone
# never bypasses. Sign-in and verification codes are sent by Supabase Auth itself, never through this queue,
# so they are never held.

version: 1

channels:
  - code: In App
    default: true
  - code: Email
    default: true
  - code: SMS
    default: false
  - code: Push
    default: true

email_templates:
  - code: notification
    transactional: false
    description: "One notification: what happened, on which record, with a link to open it."
  - code: digest
    transactional: false
    description: Several notifications gathered into one daily or weekly email.
  - code: invite
    transactional: true
    description: An invitation to join an organization.
  - code: report_delivery
    transactional: false
    description: A scheduled report attached as PDF, CSV or .xlsx.
  - code: export_ready
    transactional: true
    description: A requested export is ready to download.
  - code: import_finished
    transactional: true
    description: An import finished validating or committing.
  - code: dsar_received
    transactional: true
    description: Acknowledges a data subject request and states its due date.
  - code: subprocessor_confirm
    transactional: true
    description: Asks a new subscriber to confirm Subprocessor List change notices (double opt-in).
  - code: subprocessor_notice
    transactional: false
    description: Announces a Subprocessor List change at least 30 days before it applies.
  - code: party_invitation
    transactional: true
    description: Invites an email address to an external account or onto a crew roster, with a link to sign in to Gateway.
  - code: guest_message
    transactional: false
    description: "An org's email to a guest on its guest list: an invitation, the guest's pass (the guest-pass PDF attached) or a message, with the unsubscribe link and the postal address (B8, ADR 0147 decision 7)."

categories:
  - code: mentions
    urgent: false
    order: 1
  - code: assignments
    urgent: false
    order: 2
  - code: approvals
    urgent: false
    order: 3
  - code: comments
    urgent: false
    order: 4
  - code: schedule
    urgent: false
    order: 5
  - code: finance
    urgent: false
    order: 6
  - code: safety
    urgent: true
    order: 7
  - code: account
    urgent: true
    order: 8
  - code: reports
    urgent: false
    order: 9
  - code: imports
    urgent: false
    order: 10
  - code: automations
    urgent: false
    order: 11
  - code: messages
    urgent: false
    order: 40
  - code: feed
    urgent: false
    order: 41
  - code: opportunities
    urgent: false
    order: 50
  - code: expiry_reminders
    urgent: false
    order: 51

kinds:
  # Mentions, assignments, approvals and comments (0520, 1140)
  - kind: mention.created
    category: mentions
    emitted_by:
      # 1600 redefines 0580's emitter so a mention on a record carries the record's key.
      - emitter: supabase/migrations/1600_record_keys_in_notifications.sql#private.after_comment_mention
        test: supabase/tests/1600_record_keys_in_notifications.test.sql
  - kind: assignment.created
    category: assignments
    emitted_by:
      # 1600 redefines 1394's emitter so the assignment carries the record's key.
      - emitter: supabase/migrations/1600_record_keys_in_notifications.sql#private.notify_record_assignment
        test: supabase/tests/1600_record_keys_in_notifications.test.sql
  - kind: approval.requested
    category: approvals
    push_category: approval_request
    emitted_by:
      # 1395 redefines 1030's emitter: an away approver hands over only what their delegation covers.
      - emitter: supabase/migrations/1395_approval_delegation_scope.sql#private.notify_step_approvers
        test: supabase/tests/1395_approval_delegation_scope.test.sql
  - kind: approval.decided
    category: approvals
    emitted_by:
      # 1395 redefines 1030's emitter; 1030's test observes the decision on every path.
      - emitter: supabase/migrations/1395_approval_delegation_scope.sql#app.decide_approval
        test: supabase/tests/1030_approvals.test.sql
  - kind: comment.created
    category: comments
    emitted_by:
      # 1600 redefines 0580's emitter so a comment on a record carries the record's key.
      - emitter: supabase/migrations/1600_record_keys_in_notifications.sql#private.notify_comment_subscribers
        test: supabase/tests/1600_record_keys_in_notifications.test.sql
  # Schedule (0520, 0800)
  - kind: shift.assigned
    category: schedule
    bypasses_quiet_hours:
      starts_within_hours: 12
    emitted_by:
      - emitter: supabase/migrations/1394_notification_kind_emitters.sql#private.notify_shift_change
        test: supabase/tests/1394_notification_kind_emitters.test.sql
  - kind: shift.changed
    category: schedule
    bypasses_quiet_hours:
      starts_within_hours: 12
    emitted_by:
      - emitter: supabase/migrations/1394_notification_kind_emitters.sql#private.notify_shift_change
        test: supabase/tests/1394_notification_kind_emitters.test.sql
  - kind: event.invited
    category: schedule
    emitted_by:
      - emitter: supabase/migrations/0802_workforce_events.sql#private.announce_workforce_event
        test: supabase/tests/0802_workforce_events.test.sql
  # Finance (0520, 1131)
  - kind: invoice.approved
    category: finance
    emitted_by:
      - emitter: supabase/migrations/1131_external_party_notifications.sql#private.notify_invoice_step
        test: supabase/tests/1131_external_party_notifications.test.sql
  - kind: invoice.submitted
    category: finance
    emitted_by:
      - emitter: supabase/migrations/1131_external_party_notifications.sql#private.notify_invoice_step
        test: supabase/tests/1131_external_party_notifications.test.sql
  - kind: invoice.scheduled
    category: finance
    emitted_by:
      - emitter: supabase/migrations/1131_external_party_notifications.sql#private.notify_invoice_step
        test: supabase/tests/1131_external_party_notifications.test.sql
  - kind: invoice.paid
    category: finance
    emitted_by:
      - emitter: supabase/migrations/1131_external_party_notifications.sql#private.notify_invoice_step
        test: supabase/tests/1131_external_party_notifications.test.sql
  # Safety (0520, 0800)
  - kind: incident.reported
    category: safety
    bypasses_quiet_hours: true
    emitted_by:
      - emitter: supabase/migrations/1394_notification_kind_emitters.sql#private.notify_incident_reported
        test: supabase/tests/1394_notification_kind_emitters.test.sql
  - kind: occupancy.threshold
    category: safety
    bypasses_quiet_hours: true
    emitted_by:
      - emitter: supabase/migrations/0806_workforce_site_operations.sql#app.record_occupancy_count
        test: supabase/tests/0806_workforce_site_operations.test.sql
  - kind: weather.alert
    category: safety
    bypasses_quiet_hours: true
    emitted_by:
      # 2976 (B8): the threshold logic moved into private.apply_weather_level, which manual readings and the NWS feed
      # both call.
      - emitter: supabase/migrations/2976_weather_feed.sql#private.apply_weather_level
        test: supabase/tests/2976_weather_feed.test.sql
  # Weather feed, holds and all-clear (B8, 2976 and 2977)
  - kind: weather.warning
    category: safety
    bypasses_quiet_hours: true
    emitted_by:
      - emitter: supabase/migrations/2976_weather_feed.sql#app.record_weather_feed
        test: supabase/tests/2976_weather_feed.test.sql
  - kind: weather.hold
    category: safety
    bypasses_quiet_hours: true
    emitted_by:
      - emitter: supabase/migrations/2977_weather_holds.sql#app.call_weather_hold
        test: supabase/tests/2977_weather_holds.test.sql
  - kind: weather.all_clear
    category: safety
    bypasses_quiet_hours: true
    emitted_by:
      - emitter: supabase/migrations/2977_weather_holds.sql#app.give_weather_all_clear
        test: supabase/tests/2977_weather_holds.test.sql
  # Account (0520, 0560, 1203, 1560, 1561)
  - kind: account.security_changed
    category: account
    # A change to the person's sign-in security reaches them during quiet hours (ADR 0033 decision 62).
    bypasses_quiet_hours: true
    emitted_by:
      # 2050 (A104): Supabase Auth's password, email and phone changes, second factors verified or removed, passkeys
      # added or removed, and each new set of recovery codes; the change argument names which.
      - emitter: supabase/migrations/2050_account_security_notices.sql#private.after_auth_user_security_change
        test: supabase/tests/2050_account_security_notices.test.sql
      - emitter: supabase/migrations/2050_account_security_notices.sql#private.after_mfa_factor_change
        test: supabase/tests/2050_account_security_notices.test.sql
      - emitter: supabase/migrations/2050_account_security_notices.sql#private.after_passkey_change
        test: supabase/tests/2050_account_security_notices.test.sql
      - emitter: supabase/migrations/2050_account_security_notices.sql#app.generate_recovery_codes
        test: supabase/tests/2050_account_security_notices.test.sql
  - kind: account.recovery_code_used
    category: account
    # Someone got past the second factor with a code: the security notice that is sent today (ADR 0033 decision 62).
    bypasses_quiet_hours: true
    emitted_by:
      - emitter: supabase/migrations/1560_recovery_codes.sql#app.redeem_recovery_code
        test: supabase/tests/1560_recovery_codes.test.sql
  - kind: account.session_signed_out
    category: account
    emitted_by:
      - emitter: supabase/migrations/1561_signed_in_sessions.sql#app.sign_out_my_session
        test: supabase/tests/1561_signed_in_sessions.test.sql
      - emitter: supabase/migrations/1561_signed_in_sessions.sql#app.sign_out_my_other_sessions
        test: supabase/tests/1561_signed_in_sessions.test.sql
  # Uniform sizes and travel preferences leave the profile (R6a, ADR 0102 decision 2): sent once to each person whose
  # values the move deleted; moved names which (uniform, travel or both).
  - kind: account.work_details_moved
    category: account
    emitted_by:
      - emitter: supabase/migrations/2664_work_details_profile_move.sql#private.move_profile_work_details
        test: supabase/tests/2664_work_details_profile_move.test.sql
  - kind: billing.payment_failed
    category: account
    emitted_by:
      - emitter: supabase/migrations/0560_billing.sql#private.run_dunning
        test: supabase/tests/0560_billing.test.sql
  - kind: billing.read_only
    category: account
    emitted_by:
      - emitter: supabase/migrations/0560_billing.sql#private.run_dunning
        test: supabase/tests/0560_billing.test.sql
  - kind: access.break_glass_started
    category: account
    bypasses_quiet_hours: true
    emitted_by:
      - emitter: supabase/migrations/1203_break_glass_sessions.sql#app.start_break_glass
        test: supabase/tests/1203_break_glass_sessions.test.sql
  # Org lifecycle: trial, deletion and recovery, ownership, white label, partners (A79, 1350 to 1355)
  - kind: billing.trial_ending
    category: account
    emitted_by:
      - emitter: supabase/migrations/1350_org_trials.sql#private.run_trials
        test: supabase/tests/1350_org_trials.test.sql
  - kind: billing.trial_ended
    category: account
    emitted_by:
      - emitter: supabase/migrations/1350_org_trials.sql#private.expire_trial
        test: supabase/tests/1350_org_trials.test.sql
  - kind: organization.deletion_requested
    category: account
    emitted_by:
      - emitter: supabase/migrations/1351_org_deletion.sql#app.request_org_deletion
        test: supabase/tests/1351_org_deletion.test.sql
  - kind: organization.deletion_recovered
    category: account
    emitted_by:
      - emitter: supabase/migrations/1351_org_deletion.sql#app.recover_org_deletion
        test: supabase/tests/1351_org_deletion.test.sql
  - kind: organization.ownership_offered
    category: account
    emitted_by:
      - emitter: supabase/migrations/1352_ownership_transfers.sql#app.offer_ownership_transfer
        test: supabase/tests/1352_ownership_transfers.test.sql
  - kind: organization.ownership_accepted
    category: account
    emitted_by:
      - emitter: supabase/migrations/1352_ownership_transfers.sql#app.accept_ownership_transfer
        test: supabase/tests/1352_ownership_transfers.test.sql
  - kind: organization.ownership_declined
    category: account
    emitted_by:
      - emitter: supabase/migrations/1352_ownership_transfers.sql#app.decline_ownership_transfer
        test: supabase/tests/1352_ownership_transfers.test.sql
  - kind: organization.white_label_reverting
    category: account
    emitted_by:
      - emitter: supabase/migrations/1355_white_label_provisioning.sql#private.track_white_label_grace
        test: supabase/tests/1355_white_label_provisioning.test.sql
  - kind: organization.white_label_reverted
    category: account
    emitted_by:
      - emitter: supabase/migrations/1355_white_label_provisioning.sql#private.track_white_label_grace
        test: supabase/tests/1355_white_label_provisioning.test.sql
      - emitter: supabase/migrations/1355_white_label_provisioning.sql#private.revert_white_label
        test: supabase/tests/1355_white_label_provisioning.test.sql
  - kind: partner.client_left
    category: account
    emitted_by:
      - emitter: supabase/migrations/1562_step_up_roles_keys_billing.sql#app.leave_partner
        test: supabase/tests/1354_partner_exit_standing_grants.test.sql
  # Marketplace moderation (A90, 1473): the statement of reasons to the affected party, the outcome to the
  # reporter, and the decision on an appeal (EU Digital Services Act articles 16, 17 and 20)
  - kind: listing.moderated
    category: account
    emitted_by:
      # 1590 redefines 1473's emitter so the notice names the platform, not the operator who decided.
      - emitter: supabase/migrations/1590_notification_and_settings_integration.sql#private.notify_moderation_decision
        test: supabase/tests/1473_moderation_console.test.sql
  - kind: listing_report.decided
    category: account
    emitted_by:
      # 1590 redefines 1473's emitter so the notice names the platform, not the operator who decided.
      - emitter: supabase/migrations/1590_notification_and_settings_integration.sql#private.notify_moderation_decision
        test: supabase/tests/1473_moderation_console.test.sql
  - kind: moderation_appeal.decided
    category: account
    emitted_by:
      # 1590 redefines 1473's emitter so the notice names the platform, not the operator who decided.
      - emitter: supabase/migrations/1590_notification_and_settings_integration.sql#app.console_decide_appeal
        test: supabase/tests/1473_moderation_console.test.sql
  # Reported posts, comments and messages (ADR 0033 decision 57, 1630): a new report and a report still undecided after
  # 24 hours reach the org's moderators as safety notices; the outcome reaches each reporter, and the statement of
  # reasons reaches the author when the content is removed.
  - kind: content_report.filed
    category: safety
    emitted_by:
      - emitter: supabase/migrations/1630_content_reports.sql#app.report_content
        test: supabase/tests/1630_content_reports.test.sql
  - kind: content_report.overdue
    category: safety
    emitted_by:
      - emitter: supabase/migrations/1630_content_reports.sql#private.escalate_overdue_content_reports
        test: supabase/tests/1630_content_reports.test.sql
  - kind: content_report.decided
    category: account
    emitted_by:
      - emitter: supabase/migrations/1630_content_reports.sql#app.decide_content_report
        test: supabase/tests/1630_content_reports.test.sql
  - kind: content.removed
    category: account
    emitted_by:
      - emitter: supabase/migrations/1630_content_reports.sql#app.decide_content_report
        test: supabase/tests/1630_content_reports.test.sql
  # Reports and imports (0520). A delivered report reaches the Inbox and a push only (ADR 0033 decision 77): the
  # report.deliver worker's own email (1127, packages/data report-deliveries.ts) stays the only email.
  - kind: report.delivered
    category: reports
    channels: [In App, Push]
    emitted_by:
      - emitter: supabase/migrations/1621_report_delivered_notice.sql#app.finish_report_delivery
        test: supabase/tests/1621_report_delivered_notice.test.sql
  - kind: import.finished
    category: imports
    email_template: import_finished
    emitted_by:
      # A104: the import worker (packages/data import-worker.ts) calls 2051 with the absolute review link when it finishes
      # validating or committing; 2051 counts the rows and notifies the person who started or committed the import.
      - emitter: supabase/migrations/2051_import_finished_notice.sql#app.notify_import_finished
        test: supabase/tests/2051_import_finished_notice.test.sql
  - kind: export.ready
    category: imports
    email_template: export_ready
    deferred:
      reason: "The export_ready template needs an absolute download link and its expiry (packages/platform dispatch.ts), which only the app can build once an export file is stored; export jobs (0530) notify nobody yet."
      decision: "The export runner emits it with the signed link; no owner decision pending"
  # Automations (1481, ADR 0047): the notify action's message, a run that failed, an automation paused fail closed
  - kind: automation.notice
    category: automations
    emitted_by:
      # 1600 redefines 1481's emitter so a notice about a record carries the record's key.
      - emitter: supabase/migrations/1600_record_keys_in_notifications.sql#app.send_automation_notice
        test: supabase/tests/1600_record_keys_in_notifications.test.sql
  - kind: automation.failed
    category: automations
    emitted_by:
      - emitter: supabase/migrations/1481_automation_runs.sql#private.settle_automation_run
        test: supabase/tests/1481_automation_runs.test.sql
  - kind: automation.paused
    category: automations
    emitted_by:
      - emitter: supabase/migrations/1481_automation_runs.sql#private.pause_automation
        test: supabase/tests/1481_automation_runs.test.sql
  # Workforce suite (0800)
  - kind: message.received
    category: messages
    emitted_by:
      - emitter: supabase/migrations/1393_notification_sender_fixes.sql#app.send_chat_message
        test: supabase/tests/0800_workforce_groups_chat.test.sql
  - kind: announcement.posted
    category: feed
    emitted_by:
      - emitter: supabase/migrations/1393_notification_sender_fixes.sql#private.notify_feed_post
        test: supabase/tests/0801_workforce_feed_polls_surveys.test.sql
  - kind: survey.opened
    category: feed
    emitted_by:
      - emitter: supabase/migrations/0801_workforce_feed_polls_surveys.sql#app.transition_survey
        test: supabase/tests/0801_workforce_feed_polls_surveys.test.sql
  - kind: recognition.received
    category: feed
    emitted_by:
      - emitter: supabase/migrations/0805_workforce_recognition_help_desk.sql#app.recognize
        test: supabase/tests/0805_workforce_recognition_help_desk.test.sql
  - kind: training.assigned
    category: assignments
    emitted_by:
      - emitter: supabase/migrations/1306_org_calendar_dates.sql#app.assign_training
        test: supabase/tests/0804_workforce_training_handbook.test.sql
  - kind: help_request.assigned
    category: assignments
    emitted_by:
      - emitter: supabase/migrations/0805_workforce_recognition_help_desk.sql#app.open_help_desk_request
        test: supabase/tests/0805_workforce_recognition_help_desk.test.sql
      - emitter: supabase/migrations/0805_workforce_recognition_help_desk.sql#app.assign_help_desk_request
        test: supabase/tests/0805_workforce_recognition_help_desk.test.sql
  # P5 (G-144): an issuer asks a credential holder for a badge photo; the Inbox item, email and push open
  # /profile/badge-photos in Gateway (gatewayPath).
  - kind: credential_photo.requested
    category: assignments
    emitted_by:
      - emitter: supabase/migrations/2822_credential_photo_functions.sql#app.request_credential_photos
        test: supabase/tests/2822_credential_photo_functions.test.sql
  # Guest arrivals (B8, 2974): the host of a guest hears when the door checks them in.
  - kind: guest.arrived
    category: assignments
    emitted_by:
      - emitter: supabase/migrations/2974_guest_passes.sql#app.check_in_guest
        test: supabase/tests/2974_guest_passes.test.sql
  # Marketplace alerts and expiry reminders (A89: 1462 matcher, 1463 reminder job)
  - kind: opportunity.matched
    category: opportunities
    channels: [In App, Email, Push]
    emitted_by:
      - emitter: supabase/migrations/1462_saved_search_alerts.sql#private.notify_saved_search_matches
        test: supabase/tests/1462_saved_search_alerts.test.sql
  - kind: onboarding.item_expiring
    category: expiry_reminders
    emitted_by:
      - emitter: supabase/migrations/1463_expiry_reminders.sql#private.send_expiry_reminders
        test: supabase/tests/1463_expiry_reminders.test.sql
  - kind: certification.expiring
    category: expiry_reminders
    emitted_by:
      - emitter: supabase/migrations/1463_expiry_reminders.sql#private.send_expiry_reminders
        test: supabase/tests/1463_expiry_reminders.test.sql
  - kind: document.expiring
    category: expiry_reminders
    emitted_by:
      - emitter: supabase/migrations/1463_expiry_reminders.sql#private.send_expiry_reminders
        test: supabase/tests/1463_expiry_reminders.test.sql
  # Crew roster (R4: 2642)
  - kind: roster_entry.invited
    category: assignments
    emitted_by:
      - emitter: supabase/migrations/2642_roster_notifications.sql#private.notify_roster_entry_person
        test: supabase/tests/2642_roster_notifications.test.sql
  - kind: roster_entry.returned
    category: approvals
    emitted_by:
      - emitter: supabase/migrations/2642_roster_notifications.sql#private.notify_roster_entry_returned
        test: supabase/tests/2642_roster_notifications.test.sql
