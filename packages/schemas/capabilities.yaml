# XOS capability registry (Section 8, Section 3.15, ADR 0005).
#
# This file is the single source of every capability, every platform role and every
# default grant. The generator in src/capabilities emits the capability seed migration
# from it; RLS helpers, UI permission checks, API scopes and docs read the same data.
#
# Grant derivation. Each module states, per platform role, one visibility level taken
# from the Section 4.5.9 table. A role's grants in that module follow from the level and
# from each capability's class:
#   full      every capability at organization reach. A Member reaches write, approve and
#             export capabilities of project-scoped modules only on assigned projects, and
#             holds no manage capability (Section 8: Member creates and edits within
#             projects they belong to).
#   read      read capabilities at organization reach.
#   assigned  read and write capabilities at assigned reach (projects, workspaces and
#             teams the person is a member of or assigned to).
#   own       read and write capabilities marked own, at own reach (the person's own rows).
#   hidden    nothing.
# A capability that lists roles overrides the derivation entirely for that capability.

version: 1

roles:
  - code: owner
    band: 1
    description: Everything, including billing, deletion and data rights.
  - code: admin
    band: 2
    description: Org configuration, members, integrations and canon extensions.
  - code: manager
    band: 3
    description: Full project and finance operations.
  - code: member
    band: 4
    description: Creates and edits within projects they belong to, with no finance approval.
  - code: collaborator
    band: 5
    description: Edits assigned records only, with no finance or procurement writes.
  - code: field
    band: 6
    description: Compass field functions, own shifts, own time and assigned tasks.
  - code: viewer
    band: 7
    description: Reads within granted scopes.

