# Settings registry: P9 (approval reminders, RRR-223, gap G-261, ADR 0138). Section 4.5.6. Field reference: see
# a30.yaml. Labels live in the workflow message namespace.
#
# Pending approvals remind the approvers of the step they wait on, automatically every interval until the limit, and
# a requester may nudge them by hand at most every 4 hours (a manual nudge counts toward the limit). The hourly sweep
# (private.send_approval_reminders) and the manual nudge (app.remind_approvers) read these through
# private.approval_reminder_settings.
contributor: p9
settings:
  - key: approvals.reminders_enabled
    type: boolean
    default: true
    scopes: [organization]
    capability: org.approval_policies.write
    label: workflow.settings.remindersEnabled.label
    help: workflow.settings.remindersEnabled.help
    pages: { org: settings.approval-policies }
    enforced_by:
      - consumer: supabase/migrations/2862_approval_reminders.sql#private.approval_reminder_settings
        test: supabase/tests/2862_approval_reminders.test.sql
  - key: approvals.reminder_interval_hours
    type: integer
    min: 4
    max: 168
    default: 24
    scopes: [organization]
    capability: org.approval_policies.write
    label: workflow.settings.reminderIntervalHours.label
    help: workflow.settings.reminderIntervalHours.help
    pages: { org: settings.approval-policies }
    enforced_by:
      - consumer: supabase/migrations/2862_approval_reminders.sql#private.approval_reminder_settings
        test: supabase/tests/2862_approval_reminders.test.sql
  - key: approvals.reminder_limit
    type: integer
    min: 1
    max: 10
    default: 3
    scopes: [organization]
    capability: org.approval_policies.write
    label: workflow.settings.reminderLimit.label
    help: workflow.settings.reminderLimit.help
    pages: { org: settings.approval-policies }
    enforced_by:
      - consumer: supabase/migrations/2862_approval_reminders.sql#private.approval_reminder_settings
        test: supabase/tests/2862_approval_reminders.test.sql
