# Settings registry: A87 (global search, RRR-132, finding A65-005). Section 4.5.6.
# Field reference: see a30.yaml.
#
# Semantic search embeds the text of the org's published documents, SOPs and handbook articles, and the words
# people search with, with Supabase's built-in gte-small model in the search-embed Edge Function, so no text
# goes to another provider. An org takes part only when an Admin turns this on; XOS_SEARCH_EMBEDDINGS=off turns
# the model off for every org.
contributor: a87
settings:
  # AI features ---------------------------------------------------------------------------------------------
  - key: search.semantic_enabled
    type: boolean
    default: false
    scopes: [organization]
    capability: org.ai.write
    label: settings.fields.semanticSearch.label
    help: settings.fields.semanticSearch.help
    pages: { org: settings.ai-features }
    enforced_by:
      - consumer: supabase/migrations/1440_global_search.sql#app.search_embedding_backlog
        test: supabase/tests/1440_global_search.test.sql
      - consumer: apps/atlas/lib/shell/search-index.ts#queryVector
        test: apps/atlas/test/search-index.test.ts
