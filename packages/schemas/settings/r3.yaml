# Settings registry: R3 (org and project offerings, RRR-181). Section 4.5.6, owner decision 7.
# Field reference: see a30.yaml.
#
# Whether the org's Gateway offers each service to the people it engages. Every offering defaults to Not Offered
# (decision 7; an absent claim resolves as a refusal), the org sets its default and may lock it, and a project
# overrides an unlocked value. Audience rules (app.offering_rules, per role type and vendor class, with caps) and
# vendor class entitlements sit between the locked org value and these values; private.effective_offerings
# resolves all of them for an engagement, and Gateway shows the Travel and lodging, Per diem, Hospitality and
# Guest list tabs from its answer.
contributor: r3
settings:
  # Gateway and marketplace -----------------------------------------------------------------------------------------
  - key: offerings.travel
    type: choice
    choices: [not-offered, provided, reimbursed, buyout]
    default: not-offered
    scopes: [organization, project]
    lockable: true
    capability: projects.settings.write
    label: settings.fields.offeringsTravel.label
    help: settings.fields.offeringsTravel.help
    pages: { org: settings.gateway-and-marketplace }
    enforced_by:
      - consumer: supabase/migrations/2622_offering_resolver.sql#private.effective_offerings
        test: supabase/tests/2620_offerings.test.sql
