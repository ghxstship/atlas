# Settings registry: A30 (identity, profiles and settings). Section 4.5.6.
#
# One file per contributor in packages/schemas/settings/, never a shared list (ADR 0021). Each file
# declares settings once with their type, the scopes they can be set at, the capability that edits
# them at a shared scope, whether the org can lock them, their platform default, and the settings
# page that shows them at each scope (an Atlas sitemap node: settings.* for the org, workspace,
# team and project scopes, me.* for the personal scope).
#
# After editing a file:
#   1. pnpm --filter @xos/schemas generate:settings   rewrites src/settings/registry.generated.ts
#   2. pnpm --filter @xos/schemas settings:sql <contributor>
#      prints the private.define_setting calls; paste them into a new migration in your own range.
#   The settings test fails while the generated file or the migrations disagree with the YAML.
#
# Fields of a setting
#   key:        dotted lowercase key, unique across every file
#   type:       text, boolean, integer or choice
#   scopes:     any of organization, workspace, team, project, personal
#   capability: capability code that edits the value at a shared scope (personal values are the owner's)
#   lockable:   true when the org can lock its value (needs the organization scope)
#   default:    platform default, of the setting's type
#   choices:    for choice settings, the stored values in display order
#   min, max:   integer bounds;  max_length: text length limit
#   input:      how a text setting is edited: text (default), multiline, email, url, time_zone, currency, date, workspace
#   label, help: message catalog keys (help optional)
#   pages:      settings page per scope group: org (organization, workspace, team, project) and personal
contributor: a30
settings:
  # General -------------------------------------------------------------------------------------
  - key: org.legal_name
    type: text
    max_length: 200
    scopes: [organization]
    capability: org.general.write
    label: settings.fields.legalName.label
    help: settings.fields.legalName.help
    pages: { org: settings.general }
  - key: org.default_workspace
    type: text
    input: workspace
    max_length: 36
    scopes: [organization]
    capability: org.general.write
    label: settings.fields.defaultWorkspace.label
    help: settings.fields.defaultWorkspace.help
    pages: { org: settings.general }
  - key: shell.start_page
    type: choice
    choices: [home, my-work, inbox, projects]
    default: home
    scopes: [organization, workspace, personal]
    lockable: true
    capability: org.general.write
    label: settings.fields.startPage.label
    help: settings.fields.startPage.help
    pages: { org: settings.general, personal: me.preferences }

  # Legal entities and fiscal ---------------------------------------------------------------------
  - key: org.fiscal_year_start_month
    type: integer
    min: 1
    max: 12
    default: 1
    scopes: [organization]
    capability: org.legal_entities.write
    label: settings.fields.fiscalYearStart.label
    help: settings.fields.fiscalYearStart.help
    pages: { org: settings.legal-entities-and-fiscal }
  - key: org.base_currency
    type: text
    input: currency
    max_length: 3
    default: USD
    scopes: [organization]
    capability: org.legal_entities.write
    label: settings.fields.baseCurrency.label
    help: settings.fields.baseCurrency.help
    pages: { org: settings.legal-entities-and-fiscal }
  - key: org.invoice_number_prefix
    type: text
    max_length: 12
    default: INV-
    scopes: [organization]
    capability: org.legal_entities.write
    label: settings.fields.invoicePrefix.label
    help: settings.fields.invoicePrefix.help
    pages: { org: settings.legal-entities-and-fiscal }

