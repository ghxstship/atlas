      EUR: { monthly_minor: 82900, annual_minor: 829000 }
      GBP: { monthly_minor: 71900, annual_minor: 719000 }
      CAD: { monthly_minor: 122900, annual_minor: 1229000 }
      AUD: { monthly_minor: 136900, annual_minor: 1369000 }
    extra_seat:
      prices:
        USD: { monthly_minor: 1500, annual_minor: 15000 }
        EUR: { monthly_minor: 1400, annual_minor: 14000 }
        GBP: { monthly_minor: 1200, annual_minor: 12000 }
        CAD: { monthly_minor: 2100, annual_minor: 21000 }
        AUD: { monthly_minor: 2300, annual_minor: 23000 }
      stripe:
        monthly: xos_seat_team_monthly_v4
        annual: xos_seat_team_annual_v4
    stripe:
      product_lookup_key: xos_plan_team_v4
      prices:
        monthly: xos_plan_team_monthly_v4
        annual: xos_plan_team_annual_v4

  - code: enterprise
    extends: team
    limits:
      seats: null
      active_projects: null
      field_members: null
      active_external_engagements_per_month: null
      aurora_requests_per_month: null
    features:
      [
        saml_sso,
        scim,
        eu_data_residency,
        branded_compass_build,
        sla_credits,
        support_session_controls,
        legend_early_access,
      ]
    prices:
      USD: { monthly_minor: null, annual_minor: null }
      EUR: { monthly_minor: null, annual_minor: null }
      GBP: { monthly_minor: null, annual_minor: null }
      CAD: { monthly_minor: null, annual_minor: null }
      AUD: { monthly_minor: null, annual_minor: null }
    quote:
      contract: annual
      from_monthly_minor: { USD: 250000, EUR: null, GBP: null, CAD: null, AUD: null }

addons:
  - code: aurora_requests_1000
    adds: { limit: aurora_requests_per_month, amount: 1000 }
    plans: [core, pro, team]
    prices: { USD: 4900, EUR: 4500, GBP: 3900, CAD: 6700, AUD: 7500 }
    stripe:
      product_lookup_key: xos_addon_aurora_requests_1000_v4
      price: xos_addon_aurora_requests_1000_once_v4

offers:
  - code: founding_customer
    percent_off: 30
    duration_months: 12
    max_redemptions: 50
    plans: [core, pro, team]
    stripe:
      coupon_id: xos_founding_customer_v4
      promotion_code: FOUNDING30
