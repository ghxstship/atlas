# XOS plans, limits, features and price books (Section 16, Section 3.15, ADR 0008).
#
# This file is the single source of every plan. The generator in src/plans emits the plan
# current plan seed migration (see PLAN_SEED_MIGRATION in src/plans/sql.ts) from it; the pricing
# page, Stripe products and private.org_plan_limits read the same data.
#
# Rules the validator enforces:
#   - limits and features list exactly the values of the Postgres enums
#     app.plan_limit_code and app.plan_feature_code, in enum order.
#   - plans are listed from the free plan upward; that order is the sort order.
#   - every plan states every limit. A null limit means unlimited.
#   - a plan lists only the features it adds; it includes every feature of the plan it extends,
#     so features only accumulate upward, and no plan allows less of a limit than the plan below.
#   - every plan prices every currency. A null amount is unpriced (Section 3.7), never zero;
#     only a free plan carries a price of 0.
#   - every paid plan names its Stripe product and its monthly and annual price by lookup key;
#     the free plan has none. Lookup keys, not ids, so test and live mode share this file.
#     A price lookup key is the Stripe price's lookup_key; a product key is the product's
#     metadata.lookup_key, because Stripe products have no native lookup key.
#
# Prices come from the existing ATLVS catalogue v3 in Stripe (read 2026-10-14): USD only,
# annual at ten times monthly. Other currencies stay unpriced until Stripe carries prices for
# them. Per-project pricing is dropped by owner decision (ADR 0018): the first project is free
# on the Access plan, and paid plans have unlimited projects.
#
# Packaging (ADR 0020): every plan includes Atlas and Compass, and Gateway for the parties an org
# engages. Access is Atlas Lite (1 seat, 1 project). Tiers differ by Gateway reach (public
# marketplace and white label from Pro), by the monthly Aurora AI allowance, and by Legend, which
# Enterprise receives as early access. Workers and other external users are free on every plan.

version: 1

limits:
  - seats
  - active_projects
  - field_members
  - active_external_engagements_per_month
  - aurora_requests_per_month

features:
  - approvals
  - advancing
  - procurement
  - upl_export
  - white_label
  - custom_domain
  - automations
  - api_keys
  - webhooks
  - public_marketplace_listings
  - custom_roles
  - ip_allowlist
  - audit_export
  - payroll_export
  - priority_support
  - saml_sso
  - scim
  - eu_data_residency
  - branded_compass_build
  - sla_credits
  - support_session_controls
  - aurora_ai
  - legend_early_access

currencies: [USD, EUR, GBP, CAD, AUD]

plans:
  - code: access
    free: true
    limits:
      seats: 1
      active_projects: 1
      field_members: 10
      active_external_engagements_per_month: 25
      aurora_requests_per_month: 0
    features: []
    prices:
      USD: { monthly_minor: 0, annual_minor: 0 }
      EUR: { monthly_minor: 0, annual_minor: 0 }
      GBP: { monthly_minor: 0, annual_minor: 0 }
      CAD: { monthly_minor: 0, annual_minor: 0 }
      AUD: { monthly_minor: 0, annual_minor: 0 }

  - code: core
    extends: access
    limits:
      seats: null
      active_projects: null
      field_members: null
      active_external_engagements_per_month: 250
      aurora_requests_per_month: 500
    features: [approvals, advancing, procurement, upl_export, aurora_ai]
    prices:
      USD: { monthly_minor: 4900, annual_minor: 49000 }
      EUR: { monthly_minor: null, annual_minor: null }
      GBP: { monthly_minor: null, annual_minor: null }
      CAD: { monthly_minor: null, annual_minor: null }
      AUD: { monthly_minor: null, annual_minor: null }
    stripe:
      product_lookup_key: atlvs_plan_core_v3
      prices:
        monthly: atlvs_plan_core_unlimited_monthly_v3
        annual: atlvs_plan_core_unlimited_annual_v3

  - code: pro
    extends: core
    limits:
      seats: null
      active_projects: null
      field_members: null
      active_external_engagements_per_month: 2500
      aurora_requests_per_month: 2000
    features:
      [white_label, custom_domain, automations, api_keys, webhooks, public_marketplace_listings]
    prices:
      USD: { monthly_minor: 7900, annual_minor: 79000 }
      EUR: { monthly_minor: null, annual_minor: null }
      GBP: { monthly_minor: null, annual_minor: null }
      CAD: { monthly_minor: null, annual_minor: null }
      AUD: { monthly_minor: null, annual_minor: null }
    stripe:
      product_lookup_key: atlvs_plan_pro_v3
      prices:
        monthly: atlvs_plan_pro_unlimited_monthly_v3
        annual: atlvs_plan_pro_unlimited_annual_v3

  - code: team
    extends: pro
    limits:
      seats: null
      active_projects: null
      field_members: null
      active_external_engagements_per_month: null
      aurora_requests_per_month: 10000
    features: [custom_roles, ip_allowlist, audit_export, payroll_export, priority_support]
    prices:
      USD: { monthly_minor: 34900, annual_minor: 349000 }
      EUR: { monthly_minor: null, annual_minor: null }
      GBP: { monthly_minor: null, annual_minor: null }
      CAD: { monthly_minor: null, annual_minor: null }
      AUD: { monthly_minor: null, annual_minor: null }
    stripe:
      product_lookup_key: atlvs_plan_team_v3
      prices:
        monthly: atlvs_plan_team_unlimited_monthly_v3
        annual: atlvs_plan_team_unlimited_annual_v3

  - code: enterprise
    extends: team
    limits:
      seats: null
      active_projects: null
      field_members: null
      active_external_engagements_per_month: null
      aurora_requests_per_month: null
    features:
      [
        saml_sso,
        scim,
        eu_data_residency,
        branded_compass_build,
        sla_credits,
        support_session_controls,
        legend_early_access,
      ]
    prices:
      USD: { monthly_minor: 89900, annual_minor: 899000 }
      EUR: { monthly_minor: null, annual_minor: null }
      GBP: { monthly_minor: null, annual_minor: null }
      CAD: { monthly_minor: null, annual_minor: null }
      AUD: { monthly_minor: null, annual_minor: null }
    stripe:
      product_lookup_key: atlvs_plan_enterprise_v3
      prices:
        monthly: atlvs_plan_enterprise_unlimited_monthly_v3
        annual: atlvs_plan_enterprise_unlimited_annual_v3
