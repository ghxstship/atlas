# XOS plans, limits, features and price books (Section 16, Section 3.15, ADR 0008).
#
# This file is the single source of every plan. The generator in src/plans emits the plan
# current plan seed migration (see PLAN_SEED_MIGRATION in src/plans/sql.ts) from it; the pricing
# page, Stripe products and private.org_plan_limits read the same data.
#
# Rules the validator enforces:
#   - limits and features list exactly the values of the Postgres enums
#     app.plan_limit_code and app.plan_feature_code, in enum order.
#   - plans are listed from the free plan upward; that order is the sort order.
#   - every plan states every limit. A null limit means unlimited.
#   - a plan lists only the features it adds; it includes every feature of the plan it extends,
#     so features only accumulate upward, and no plan allows less of a limit than the plan below.
#   - every plan prices every currency. A null amount is unpriced (Section 3.7), never zero;
#     only a free plan carries a price of 0.
#   - every paid plan names its Stripe product and its monthly and annual price by lookup key;
#     the free plan has none. Lookup keys, not ids, so test and live mode share this file.
#     A price lookup key is the Stripe price's lookup_key; a product key is the product's
#     metadata.lookup_key, because Stripe products have no native lookup key.
#
#   - a plan with a quote is sold by contract only (Enterprise): its list prices are null, it has no
#     Stripe prices and no extra seats, and quote.from_monthly_minor is a display price only.
#   - annual prices are annual_multiplier times monthly, for plans, extra seats and nothing else.
#   - a plan with a seat limit above the free plan sells extra seats (extra_seat), priced per seat in
#     every currency with its own Stripe price lookup keys on the shared extra-seat product.
#   - an add-on is a one-time purchase that raises one limit for the calendar month it is bought in,
#     on the plans it lists, which must have a finite limit for it.
#   - every Stripe lookup key, coupon id and promotion code is unique.
#
# Pricing v4 (owner, 2026-10-19; ADR 0034): seat-based plans with a seat allowance, extra seats per
# month, unlimited projects and field crew on paid plans, local-currency price books, Aurora request
# packs, a founding-customer coupon and a 30 percent partner wholesale discount. Stripe lookup keys
# are the v4 catalogue that `pnpm --filter @xos/platform stripe:setup` creates in test mode. The v3
# catalogue (atlvs_*) stays in Stripe as history. Per-project pricing stays dropped (ADR 0018).
#
# Packaging (ADR 0020): every plan includes Atlas and Compass, and Gateway for the parties an org
# engages. Access is Atlas Lite (1 seat, 1 project). Tiers differ by Gateway reach (public
# marketplace and white label from Pro), by the monthly Aurora AI allowance, and by Legend, which
# Enterprise receives as early access. Workers and other external users are free on every plan.

version: 1

limits:
  - seats
  - active_projects
  - field_members
  - active_external_engagements_per_month
  - aurora_requests_per_month

features:
  - approvals
  - advancing
  - procurement
  - upl_export
  - white_label
  - custom_domain
  - automations
  - api_keys
  - webhooks
  - public_marketplace_listings
  - custom_roles
  - ip_allowlist
  - audit_export
  - payroll_export
  - priority_support
  - saml_sso
  - scim
  - eu_data_residency
  - branded_compass_build
  - sla_credits
  - support_session_controls
  - aurora_ai
  - legend_early_access

currencies: [USD, EUR, GBP, CAD, AUD]

# Annual billing gives two months free.
annual_multiplier: 10

# The Stripe product every extra-seat price belongs to.
extra_seat_product_lookup_key: xos_extra_seat_v4

# Partner wholesale (Section 4.6.1): client orgs billed to a partner cost the partner list price less
# this discount. It is the default of app.partner_agreements.wholesale_discount_bps.
partner_wholesale_discount_bps: 3000

plans:
  - code: access
    free: true
    limits:
      seats: 1
      active_projects: 1
      field_members: 10
      active_external_engagements_per_month: 25
      aurora_requests_per_month: 0
    features: []
    prices:
      USD: { monthly_minor: 0, annual_minor: 0 }
      EUR: { monthly_minor: 0, annual_minor: 0 }
      GBP: { monthly_minor: 0, annual_minor: 0 }
      CAD: { monthly_minor: 0, annual_minor: 0 }
      AUD: { monthly_minor: 0, annual_minor: 0 }

  - code: core
    extends: access
    limits:
      seats: 5
      active_projects: null
      field_members: null
      active_external_engagements_per_month: 250
      aurora_requests_per_month: 500
    features: [approvals, advancing, procurement, upl_export, aurora_ai]
    prices:
      USD: { monthly_minor: 14900, annual_minor: 149000 }
      EUR: { monthly_minor: 13900, annual_minor: 139000 }
      GBP: { monthly_minor: 11900, annual_minor: 119000 }
      CAD: { monthly_minor: 19900, annual_minor: 199000 }
      AUD: { monthly_minor: 22900, annual_minor: 229000 }
    extra_seat:
      prices:
        USD: { monthly_minor: 1900, annual_minor: 19000 }
        EUR: { monthly_minor: 1800, annual_minor: 18000 }
        GBP: { monthly_minor: 1500, annual_minor: 15000 }
        CAD: { monthly_minor: 2600, annual_minor: 26000 }
        AUD: { monthly_minor: 2900, annual_minor: 29000 }
      stripe:
        monthly: xos_seat_core_monthly_v4
        annual: xos_seat_core_annual_v4
    stripe:
      product_lookup_key: xos_plan_core_v4
      prices:
        monthly: xos_plan_core_monthly_v4
        annual: xos_plan_core_annual_v4

  - code: pro
    extends: core
    limits:
      seats: 15
      active_projects: null
      field_members: null
      active_external_engagements_per_month: 2500
      aurora_requests_per_month: 2000
    features:
      [white_label, custom_domain, automations, api_keys, webhooks, public_marketplace_listings]
    prices:
      USD: { monthly_minor: 39900, annual_minor: 399000 }
      EUR: { monthly_minor: 36900, annual_minor: 369000 }
      GBP: { monthly_minor: 31900, annual_minor: 319000 }
      CAD: { monthly_minor: 54900, annual_minor: 549000 }
      AUD: { monthly_minor: 60900, annual_minor: 609000 }
    extra_seat:
      prices:
        USD: { monthly_minor: 1900, annual_minor: 19000 }
        EUR: { monthly_minor: 1800, annual_minor: 18000 }
        GBP: { monthly_minor: 1500, annual_minor: 15000 }
        CAD: { monthly_minor: 2600, annual_minor: 26000 }
        AUD: { monthly_minor: 2900, annual_minor: 29000 }
      stripe:
        monthly: xos_seat_pro_monthly_v4
        annual: xos_seat_pro_annual_v4
    stripe:
      product_lookup_key: xos_plan_pro_v4
      prices:
        monthly: xos_plan_pro_monthly_v4
        annual: xos_plan_pro_annual_v4

  - code: team
