<!doctype html>
<html lang="en-US">
<head><meta charset="utf-8"><title>PriceDisplay</title></head>
<body>
<div id="root"></div>
<script>
  var X = window.XOS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'xos-row',style:{gap:'var(--space-48)',alignItems:'flex-start'}},
    h(X.PriceDisplay,{amount:149,period:'month',taxMode:'exclusive'}),
    h(X.PriceDisplay,{amount:1490,period:'year',taxMode:'exclusive'}),
    h(X.PriceDisplay,{amount:2500,from:true,period:'month',taxMode:'exclusive'}),
    h(X.PriceDisplay,{amount:null})));
</script>
</body>
</html>
