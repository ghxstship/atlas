<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en-US">
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-canvas); }
  .cv { position: relative; inline-size: 100%; max-inline-size: 960px; block-size: 288px; overflow: hidden; background: var(--bg-canvas); }
  .cv svg { position: absolute; inset-inline-start: 0; inset-block-start: 0; }
  .blk { rx: var(--radius-card); ry: var(--radius-card); }
  .acc { fill: var(--accent-default); }
  .vio { fill: var(--state-in-review); }
  .blu { fill: var(--state-scheduled); }
  .ink { fill: var(--text-primary); }
  .foc { fill: var(--viz-seq-3); }
  .dot { fill: var(--accent-default); }
  .txt { position: absolute; inset-inline-start: var(--space-40); inset-block-end: var(--space-40); max-inline-size: min(440px, calc(100% - 2 * var(--space-40))); }
  .name { margin: 0; font: var(--weight-semibold) clamp(40px, 7.5vw, 72px)/0.95 var(--font-sans); letter-spacing: -0.02em; color: var(--text-primary); }
  .tag { margin: var(--space-16) 0 0; font: var(--weight-regular) 13px/1.45 var(--font-sans); color: var(--text-secondary); }
</style></head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: accent-default 192x216, state-in-review 112x128, state-scheduled 112x136, text-primary 112x96, viz-seq-3 192x72 (accent tint for relief)
      arrangement: flush modular board of unequal columns, like the Board view, bleeding off the top, bottom and right edge
      pattern: dot grid at space-24 pitch, chosen because the system is precise and technical on a 4 px grid with mono codes
      scales: gaps space-16, pitch space-24, corners radius-card
    -->
    <rect class="blk acc" x="512" y="-8" width="192" height="216"/>
    <rect class="blk foc" x="512" y="224" width="192" height="72"/>
    <rect class="blk vio" x="720" y="-8" width="112" height="136"/>
    <rect class="blk blu" x="720" y="144" width="112" height="152"/>
    <rect class="blk ink" x="848" y="48" width="120" height="96"/>
    <g>
      <circle class="dot" cx="860" cy="172" r="2"/><circle class="dot" cx="884" cy="172" r="2"/><circle class="dot" cx="908" cy="172" r="2"/><circle class="dot" cx="932" cy="172" r="2"/>
      <circle class="dot" cx="860" cy="196" r="2"/><circle class="dot" cx="884" cy="196" r="2"/><circle class="dot" cx="908" cy="196" r="2"/><circle class="dot" cx="932" cy="196" r="2"/>
      <circle class="dot" cx="860" cy="220" r="2"/><circle class="dot" cx="884" cy="220" r="2"/><circle class="dot" cx="908" cy="220" r="2"/><circle class="dot" cx="932" cy="220" r="2"/>
      <circle class="dot" cx="860" cy="244" r="2"/><circle class="dot" cx="884" cy="244" r="2"/><circle class="dot" cx="908" cy="244" r="2"/><circle class="dot" cx="932" cy="244" r="2"/>
      <circle class="dot" cx="860" cy="268" r="2"/><circle class="dot" cx="884" cy="268" r="2"/><circle class="dot" cx="908" cy="268" r="2"/><circle class="dot" cx="932" cy="268" r="2"/>
    </g>
  </svg>
  <div class="txt">
    <h1 class="name">XOS Design<br>System</h1>
    <p class="tag">Calm, dense and keyboard-first, for Atlas, Gateway and Compass.</p>
  </div>
</div>
</body>
</html>
