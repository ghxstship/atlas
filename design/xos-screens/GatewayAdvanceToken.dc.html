<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway · Advance by Token</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px;">
  <header style="flex: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border-subtle);">
    <x-import component-from-global-scope="XOS.BrandMark" name="Northwind Live" size="sm"></x-import>
    <span class="xos-muted" style="font-size: 12px;">Secure link · no account needed</span>
  </header>
  <main style="flex: 1; min-height: 0; overflow: auto;">
    <div style="max-width: 720px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="xos-muted">Main Stage Advance Packet · for Harbor Audio</span>
        <h1 style="margin: 0; font-size: 24px; font-weight: 600;">Power</h1>
        <span class="xos-muted">Section 4 of 7 · due Fri, Nov 6 · your answers save as you type</span>
      </div>
      <div style="overflow-x: auto;"><x-import component-from-global-scope="XOS.Stepper" steps="{{steps}}" current="{{three}}"></x-import></div>
      <form aria-labelledby="t-form" style="display: flex; flex-direction: column; gap: 16px;">
        <h2 id="t-form" class="xos-sr">Power requirements</h2>
        <x-import component-from-global-scope="XOS.Select" label="Service size" value="200" options="{{sizes}}"></x-import>
        <x-import component-from-global-scope="XOS.Radio" label="Phase" name="phase" value="three" options="{{phases}}"></x-import>
        <x-import component-from-global-scope="XOS.NumberInput" label="Distance from stage left" value="{{dist}}" unit="ft"></x-import>
        <x-import component-from-global-scope="XOS.FileDrop" label="Power plot" hint="PDF or image, up to 25 MB" files="{{files}}"></x-import>
        <x-import component-from-global-scope="XOS.InlineAlert" tone="warning" title="The venue lists no 200 A three-phase service">Northwind Live will confirm a generator or a tie-in. You do not need to change your answer.</x-import>
        <div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
          <x-import component-from-global-scope="XOS.Button" variant="ghost" icon="ArrowLeft">Previous Section</x-import>
          <x-import component-from-global-scope="XOS.Button" variant="primary">Save and Continue</x-import>
        </div>
      </form>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"light"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'light',
      hpx: h ? h + 'px' : '100vh',
      three: 3, dist: 40,
      steps: ['Contacts', 'Schedule', 'Technical', 'Power', 'Hospitality', 'Insurance', 'Credentials'],
      sizes: [{ value: '100', label: '100 A' }, { value: '200', label: '200 A' }, { value: '400', label: '400 A' }],
      phases: [{ value: 'single', label: 'Single-phase' }, { value: 'three', label: 'Three-phase' }],
      files: [{ name: 'Harbor_Audio_Power_Plot.pdf', size: 482000 }]
    };
  }
}
</script>
</body>
</html>
