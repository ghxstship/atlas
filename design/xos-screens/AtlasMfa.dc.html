<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas · Multi-Factor Check</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-surface); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px;">
  <main class="xos-layout-auth" style="flex: 1; align-content: center;">
    <div class="xos-card">
      <div class="xos-card-body" style="display: flex; flex-direction: column; gap: 16px; padding: 32px;">
        <x-import component-from-global-scope="XOS.BrandMark" name="Northwind Live" size="lg"></x-import>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2;">Two-step check</h1>
          <p style="margin: 0; color: var(--text-secondary);">Your organization requires a second step for jordan.lee@northwindlive.com.</p>
        </div>
        <x-import component-from-global-scope="XOS.InlineAlert" tone="info" title="Security key or passkey">Touch your key, or use Face ID or Windows Hello when your browser asks.</x-import>
        <x-import component-from-global-scope="XOS.Input" label="Code from your authenticator app" width="100%" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digits" maxlength="6" value="418207" help="Enter the 6-digit code. It changes every 30 seconds."></x-import>
        <x-import component-from-global-scope="XOS.Button" variant="primary" size="lg" class-name="xos-block">Verify</x-import>
        <x-import component-from-global-scope="XOS.Button" variant="ghost" size="lg" icon="KeyRound" class-name="xos-block">Use Security Key</x-import>
        <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
          <x-import component-from-global-scope="XOS.Link" href="#recovery">Use a recovery code</x-import>
          <x-import component-from-global-scope="XOS.Link" href="#back">Sign in as someone else</x-import>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"dark"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return { theme: this.props.theme ?? 'dark', hpx: h ? h + 'px' : '100vh' };
  }
}
</script>
</body>
</html>
