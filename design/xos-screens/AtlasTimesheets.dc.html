<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas · Timesheet Approval</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" class="xos-shell" style="height: {{hpx}}; box-sizing: border-box; border: 0; border-radius: 0; grid-template-rows: minmax(0, 1fr); background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px;">
  <div class="xos-shell-side" id="atlas-side">
    <div class="xos-shell-brand"><x-import component-from-global-scope="XOS.BrandMark" name="Northwind Live" size="sm"></x-import></div>
    <button type="button" class="xos-nav-item" aria-haspopup="listbox" aria-label="Workspace, Miami Office"><x-import component-from-global-scope="XOS.Icon" name="Building2"></x-import>Miami Office<span style="margin-inline-start: auto; display: inline-flex;"><x-import component-from-global-scope="XOS.Icon" name="ChevronsUpDown" size="{{i12}}"></x-import></span></button>
    <button type="button" class="xos-nav-item"><x-import component-from-global-scope="XOS.Icon" name="Search"></x-import>Search<span style="margin-inline-start: auto;"><x-import component-from-global-scope="XOS.Kbd">⌘ K</x-import></span></button>
    <x-import component-from-global-scope="XOS.Sidebar" label="Atlas" active="Crew" groups="{{nav}}"></x-import>
  </div>
  <main class="xos-shell-main" style="min-height: 0;">
    <div class="xos-shell-head">
      <span class="xos-shell-menu"><x-import component-from-global-scope="XOS.IconButton" icon="Menu" label="Menu"></x-import></span>
      <div class="xos-shell-headbody">
        <x-import component-from-global-scope="XOS.Breadcrumbs" items="{{crumbs}}"></x-import>
        <div style="display: flex; align-items: center; gap: 8px;">
          <x-import component-from-global-scope="XOS.IconButton" icon="CircleHelp" label="Help" shortcut="?"></x-import>
          <button type="button" aria-label="Account, Malik Osei" aria-haspopup="menu" class="xos-avatar-btn"><x-import component-from-global-scope="XOS.Avatar" name="Malik Osei"></x-import></button>
        </div>
      </div>
    </div>
    <div class="xos-shell-body" style="flex: 1; min-height: 0; overflow: auto;">
      <x-import component-from-global-scope="XOS.PageHeader" title="Timesheets" glyph="Clock" count="{{count}}" actions="{{actions}}"></x-import>
      <x-import component-from-global-scope="XOS.Tabs" label="Crew pages" value="ts" tabs="{{pages}}"></x-import>
      <x-import component-from-global-scope="XOS.BulkActionBar" count="{{eight}}" actions="{{bulk}}"></x-import>
      <x-import component-from-global-scope="XOS.SplitView" label="Timesheets awaiting approval, week of Nov 16" selected="{{zero}}" items="{{items}}" detail="{{detail}}"></x-import>
      <x-import component-from-global-scope="XOS.UndoToast" message="Approved 4 timesheets." seconds="{{eight}}"></x-import>
    </div>
    <div class="xos-shell-bottom"><x-import component-from-global-scope="XOS.TabBar" label="Atlas" active="Inbox" items="{{tabs}}"></x-import></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"dark"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const X = window.XOS || {}, R = window.React;
    const el = (n, p, ...c) => (X[n] && R) ? R.createElement(X[n], p, ...c) : null;
    const tag = (t, p, ...c) => R ? R.createElement(t, p, ...c) : null;
    const h = Number(this.props.h) || 0;
    const open = ['Operations', 'People'];
    const g = (label, items) => ({ label, collapsed: open.indexOf(label) < 0, items });
    const detail = tag('div', { className: 'xos-col' },
      tag('div', { className: 'xos-row', style: { justifyContent: 'space-between' } },
        tag('strong', { style: { fontSize: 16 } }, 'Dana Ruiz · Lead Stagehand / Deck Crew Chief'),
        el('StateChip', { state: 'in-review', label: 'In Review' })),
      tag('span', { className: 'xos-muted' }, 'LRC-022 · Day Rate · OTR-001 Standard Overtime · Employee, Nonexempt'),
      el('DataTable', { caption: 'Time entries with geofenced punches', density: 'compact', columns: [{ key: 'day', label: 'Day' }, { key: 'in', label: 'In' }, { key: 'out', label: 'Out' }, { key: 'brk', label: 'Break' }, { key: 'hrs', label: 'Hours', type: 'number' }, { key: 'geo', label: 'Geofence', type: 'state' }], rows: [
        { day: 'Mon, Nov 16', in: '5:52 AM', out: '4:10 PM', brk: '30 min', hrs: 9.8, geo: { state: 'complete', label: 'On site' } },
        { day: 'Wed, Nov 18', in: '5:57 AM', out: '6:41 PM', brk: '30 min', hrs: 12.2, geo: { state: 'complete', label: 'On site' } },
        { day: 'Fri, Nov 20', in: '1:55 PM', out: '11:48 PM', brk: '45 min', hrs: 9.1, geo: { state: 'deferred', label: 'Edited by supervisor' } }
      ], totals: { hrs: 31.1 }, totalsLabel: 'Week' }),
      tag('div', { className: 'xos-row' }, el('Button', { variant: 'ghost', shortcut: 'R' }, 'Reject'), el('Button', { variant: 'primary', shortcut: 'A' }, 'Approve')));
    return {
      theme: this.props.theme ?? 'dark',
      hpx: h ? h + 'px' : '100vh',
      i12: 12, count: 12, eight: 8, zero: 0,
      detail,
      actions: el('Button', { icon: 'CheckCheck', shortcut: '⇧ A' }, 'Approve All Clean'),
      bulk: [{ label: 'Approve', icon: 'Check', shortcut: 'A' }, { label: 'Reject', icon: 'X', shortcut: 'R' }, { label: 'Export', icon: 'Download' }],
      items: [
        { state: 'in-review', title: 'Dana Ruiz · 31.1 h', meta: '3 shifts · 1 edited punch' },
        { state: 'in-review', title: 'Lena Fischer · 20.0 h', meta: '2 shifts · clean' },
        { state: 'blocked', title: 'Owen Price · 18.5 h', meta: 'Double booked Nov 16 · resolve first' },
        { state: 'in-review', title: 'Priya Nair · 24.0 h', meta: '2 shifts · clean' },
        { state: 'in-review', title: 'Rafael Costa · 20.5 h', meta: '2 shifts · clean' },
        { state: 'deferred', title: 'Tariq Haddad · 16.0 h', meta: 'Auto clock-out at 16 h · review' }
      ],
      pages: [{ value: 'schedule', label: 'Schedule' }, { value: 'shifts', label: 'Shifts' }, { value: 'swaps', label: 'Swaps', count: 2 }, { value: 'time', label: 'Time Entries' }, { value: 'ts', label: 'Timesheets', count: 12 }, { value: 'rates', label: 'Rate Cards' }, { value: 'periods', label: 'Pay Periods' }, { value: 'payroll', label: 'Payroll Exports' }, { value: 'off', label: 'Time Off' }],
      nav: [
        { items: [{ label: 'Home', icon: 'House' }, { label: 'Inbox', icon: 'Inbox', badge: 12 }, { label: 'My Work', icon: 'CircleCheck' }] },
        { label: 'Favorites', items: [{ label: 'Opening Week Crew', icon: 'Star' }, { label: 'Open Swaps', icon: 'Star' }] },
        { label: 'Recent Projects', items: [{ label: 'Northwind Fall Series', icon: 'Folder' }, { label: 'Harbor Winter Gala', icon: 'Folder' }, { label: 'Bayfront Food Festival', icon: 'Folder' }, { label: 'Coastline Brand Launch', icon: 'Folder' }, { label: 'Riverside Summer Stage', icon: 'Folder' }, { label: 'All Projects', icon: 'FolderOpen' }] },
        g('Production', [{ label: 'Projects', icon: 'Folder' }, { label: 'Schedule', icon: 'Calendar' }, { label: 'Work', icon: 'SquareCheck' }, { label: 'Show', icon: 'Clapperboard' }, { label: 'Advancing', icon: 'ClipboardCheck' }]),
        g('Operations', [{ label: 'Places', icon: 'MapPin' }, { label: 'Logistics', icon: 'Truck' }, { label: 'Hospitality', icon: 'ConciergeBell' }, { label: 'Assets', icon: 'Boxes' }, { label: 'Credentials', icon: 'IdCard' }, { label: 'Safety', icon: 'ShieldAlert' }]),
        g('People', [{ label: 'People', icon: 'Users' }, { label: 'Opportunities', icon: 'UserSearch' }, { label: 'Crew', icon: 'HardHat' }]),
        g('Commercial', [{ label: 'Finance', icon: 'Wallet' }, { label: 'Procurement', icon: 'ShoppingCart' }, { label: 'Vendors', icon: 'Store' }]),
        g('Knowledge', [{ label: 'Knowledge', icon: 'BookOpen' }, { label: 'Reports', icon: 'ChartColumn' }, { label: 'Canon', icon: 'Library' }]),
        { items: [{ label: 'Activity', icon: 'Activity' }, { label: 'Settings', icon: 'Settings' }] }
      ],
      crumbs: [{ label: 'Northwind Live' }, { label: 'Miami Office' }, { label: 'Northwind Fall Series' }, { label: 'Crew' }, { label: 'Timesheets' }],
      tabs: [{ label: 'Home', icon: 'House' }, { label: 'Inbox', icon: 'Inbox', badge: 12 }, { label: 'Search', icon: 'Search' }, { label: 'My Work', icon: 'CircleCheck' }, { label: 'Menu', icon: 'Menu' }]
    };
  }
}
</script>
</body>
</html>
