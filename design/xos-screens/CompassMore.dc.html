<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass · More Menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" class="xos-compass" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px;">
  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--border-subtle); min-height: 48px;">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600;">More</h1>
    <x-import component-from-global-scope="XOS.IconButton" icon="Search" label="Search"></x-import>
  </header>
  <main style="flex: 1; min-height: 0; overflow: auto; padding: 8px 16px 16px;">
    <nav aria-label="More" style="display: flex; flex-direction: column;">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="12">
        <sc-if value="{{it.heading}}" hint-placeholder-val="{{false}}">
          <span class="xos-label" style="padding: 16px 4px 4px;">{{it.label}}</span>
        </sc-if>
        <sc-if value="{{it.link}}" hint-placeholder-val="{{true}}">
          <a href="#" style="min-height: var(--touch-min); display: flex; align-items: center; gap: 12px; padding: 0 4px; border-bottom: 1px solid var(--border-subtle); color: inherit; text-decoration: none; padding-inline-start: {{it.indent}};">
            <x-import component-from-global-scope="XOS.Icon" name="{{it.icon}}" size="{{i24}}" color="var(--text-secondary)"></x-import>
            <span style="flex: 1;">{{it.label}}</span>
            <span class="xos-muted" style="font-size: 14px;">{{it.meta}}</span>
            <x-import component-from-global-scope="XOS.Icon" name="ChevronRight" color="var(--text-tertiary)"></x-import>
          </a>
        </sc-if>
      </sc-for>
    </nav>
  </main>
  <div style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" compass="{{yes}}" label="Compass" active="More" center-label="Scan" items="{{tabs}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"dark"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    const L = (label, icon, meta, indent) => ({ link: true, heading: false, label, icon, meta: meta || '', indent: indent ? '32px' : '4px' });
    return {
      theme: this.props.theme ?? 'dark',
      hpx: h ? h + 'px' : '100vh',
      yes: true, i24: 24,
      items: [
        L('Incidents', 'Siren', '1 open'), L('Inspections', 'ScanSearch', '1 due'), L('Logistics', 'Truck'), L('Show', 'Clapperboard', 'Live'), L('Expenses', 'Receipt'),
        { heading: true, link: false, label: 'Reference' },
        L('Emergency Codes', 'ShieldAlert', '', true), L('Radio Channels', 'Radio', '', true), L('Venue Maps', 'Map', '', true), L('SOPs', 'BookOpen', '', true),
        { heading: true, link: false, label: 'You' },
        L('Offline Queue', 'CloudOff', '4 waiting'), L('Profile and Certifications', 'UserRound', '1 expiring'), L('Settings', 'Settings')
      ],
      tabs: [{ label: 'Today', icon: 'House' }, { label: 'Schedule', icon: 'CalendarDays' }, { label: 'Scan', icon: 'ScanLine' }, { label: 'Inbox', icon: 'Inbox', badge: 3 }, { label: 'Crew', icon: 'HardHat' }, { label: 'More', icon: 'Menu' }]
    };
  }
}
</script>
</body>
</html>
