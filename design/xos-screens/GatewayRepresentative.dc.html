<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway · Artist Representative</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px;">
  <x-import component-from-global-scope="XOS.TopNav" brand="XOS Gateway" label="Gateway" person="Theo Grant" active="Work" items="{{nav}}"></x-import>
  <main style="flex: 1; min-height: 0; overflow: auto;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;"><x-import component-from-global-scope="XOS.Tag" tone="accent">Artist Representative</x-import><span class="xos-muted">Tidal Management</span></div>
          <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Roster · 2 artists, 3 engagements</h1>
        </div>
        <x-import component-from-global-scope="XOS.Button" variant="primary" icon="Handshake">Review Offer</x-import>
      </div>
      <x-import component-from-global-scope="XOS.DataTable" caption="Artists you represent and the scopes each one granted you" columns="{{cols}}" rows="{{rows}}"></x-import>
      <section aria-labelledby="rp-eng" style="display: flex; flex-direction: column; gap: 8px;">
        <h2 id="rp-eng" class="xos-label" style="margin: 0;">Engagements across orgs</h2>
        <x-import component-from-global-scope="XOS.RecordList" label="Represented engagements">
          <x-import component-from-global-scope="XOS.RecordRow" state="active" state-label="Active" record-key="NWL-ART-04" title="Lumen Tide · Opening Night · Advance 2 of 7" next="Nov 20" action-label="Open Advance"></x-import>
          <x-import component-from-global-scope="XOS.RecordRow" state="scheduled" state-label="Offered" record-key="HLE-ART-11" title="Marisol Vega · Winter Gala · $3,500 offered" next="Answer by Nov 21" action-label="Review Offer"></x-import>
          <x-import component-from-global-scope="XOS.RecordRow" state="complete" state-label="Settled" record-key="NWL-ART-01" title="Lumen Tide · Summer Stage · Settled $5,500" next="Sep 3" action-label="Statement"></x-import>
        </x-import>
      </section>
      <span class="xos-muted">You act within the scopes each artist granted. Anything outside them, the artist approves.</span>
    </div>
  </main>
  <div class="xos-mobile-only" style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" label="Gateway" active="Work" items="{{nav}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"light"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'light',
      hpx: h ? h + 'px' : '100vh',
      cols: [{ key: 'artist', label: 'Artist' }, { key: 'scopes', label: 'Delegated Scopes' }, { key: 'expires', label: 'Expires' }, { key: 's', label: 'Representation', type: 'state' }],
      rows: [
        { artist: 'Lumen Tide', scopes: 'Offers, Advance, Settlement, Documents', expires: 'Jun 30, 2027', s: { state: 'complete', label: 'Accepted' } },
        { artist: 'Marisol Vega', scopes: 'Offers, Advance', expires: 'Dec 31, 2026', s: { state: 'complete', label: 'Accepted' } }
      ],
      nav: [{ label: 'Home', icon: 'House' }, { label: 'Explore', icon: 'Compass' }, { label: 'Work', icon: 'Briefcase' }, { label: 'Money', icon: 'Wallet' }, { label: 'Messages', icon: 'MessageSquare', badge: 1 }]
    };
  }
}
</script>
</body>
</html>
