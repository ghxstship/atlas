<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway · Application</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px;">
  <x-import component-from-global-scope="XOS.TopNav" brand="XOS Gateway" label="Gateway" person="Dana Ruiz" active="Explore" items="{{nav}}"></x-import>
  <main style="flex: 1; min-height: 0; overflow: auto;">
    <div style="max-width: 640px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <x-import component-from-global-scope="XOS.Breadcrumbs" items="{{crumbs}}"></x-import>
      <div class="xos-card" style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column;"><strong>Rigger, Fall Series</strong><span class="xos-muted">Northwind Live · $800 to $1,150 per day · Nov 18 to 22</span></div>
        <x-import component-from-global-scope="XOS.Tag" tone="success">You qualify</x-import>
      </div>
      <x-import component-from-global-scope="XOS.ApplicationForm" role="Rigger" org="Northwind Live" shared="{{shared}}" questions="{{questions}}"></x-import>
      <span class="xos-muted" style="font-size: 12px;">Northwind Live receives a snapshot of the shared fields, plus updates while you are engaged. You can revoke sharing in Settings at any time.</span>
    </div>
  </main>
  <div class="xos-mobile-only" style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" label="Gateway" active="Explore" items="{{nav}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"light"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'light',
      hpx: h ? h + 'px' : '100vh',
      shared: [{ label: 'Name and headline', on: true }, { label: 'Certifications', on: true }, { label: 'Rates', on: true }, { label: 'Availability', on: true }, { label: 'References', on: false }],
      questions: ['Largest arena flown as lead?'],
      crumbs: [{ label: 'Explore' }, { label: 'Rigger, Fall Series' }, { label: 'Apply' }],
      nav: [{ label: 'Home', icon: 'House' }, { label: 'Explore', icon: 'Compass' }, { label: 'Work', icon: 'Briefcase' }, { label: 'Money', icon: 'Wallet' }, { label: 'Messages', icon: 'MessageSquare', badge: 2 }]
    };
  }
}
</script>
</body>
</html>
