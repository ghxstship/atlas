<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass · Run of Show Live</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="dark" class="xos-compass" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px;">
  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--border-subtle);">
    <div style="display: flex; flex-direction: column;"><strong>Show Mode · Opening Night</strong><span style="font-size: 12px; color: var(--text-secondary);">Screen stays awake · synced with Atlas</span></div>
    <x-import component-from-global-scope="XOS.Tag" tone="success">Live</x-import>
  </header>
  <main class="xos-scroll-col" style="flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <x-import component-from-global-scope="XOS.RunOfShowLive" current="{{two}}" next-in-seconds="{{next}}" show-mode="{{yes}}" cues="{{cues}}"></x-import>
    <span class="xos-muted" style="font-size: 14px; text-align: center;">A haptic fires 10 seconds before each cue. Only the stage manager can advance cues.</span>
  </main>
  <div style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" compass="{{yes}}" label="Compass" active="More" center-label="Scan" items="{{tabs}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      hpx: h ? h + 'px' : '100vh',
      yes: true, two: 2, next: 94,
      cues: [
        { number: 'Q12', time: '7:30:00 PM', title: 'House to half', dept: '5000' },
        { number: 'Q13', time: '7:31:00 PM', title: 'Walk-in music out', dept: '5000' },
        { number: 'Q14', time: '7:32:00 PM', title: 'Host welcome', dept: '2000', durationSeconds: 94 },
        { number: 'Q15', time: '7:35:30 PM', title: 'Opening video', dept: '9000', durationSeconds: 180 },
        { number: 'Q16', time: '7:38:30 PM', title: 'Headliner walk-on', dept: '2000', durationSeconds: 60 }
      ],
      tabs: [{ label: 'Today', icon: 'House' }, { label: 'Schedule', icon: 'CalendarDays' }, { label: 'Scan', icon: 'ScanLine' }, { label: 'Inbox', icon: 'Inbox', badge: 3 }, { label: 'Crew', icon: 'HardHat' }, { label: 'More', icon: 'Menu' }]
    };
  }
}
</script>
</body>
</html>
