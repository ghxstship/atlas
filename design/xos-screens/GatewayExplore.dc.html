<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway · Explore</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px;">
  <x-import component-from-global-scope="XOS.TopNav" brand="XOS Gateway" label="Gateway" person="Dana Ruiz" active="Explore" items="{{nav}}"></x-import>
  <main style="flex: 1; min-height: 0; overflow: auto;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Explore</h1>
      </div>
      <x-import component-from-global-scope="XOS.Tabs" label="Explore" value="foryou" tabs="{{tabs}}"></x-import>
      <x-import component-from-global-scope="XOS.OpportunityFilters" placeholder="Role, skill or company" chips="{{chips}}" active="{{active}}"></x-import>
      <span class="xos-muted">24 opportunities within 25 mi of Miami, FL · pay shown before you apply</span>
      <x-import component-from-global-scope="XOS.Gallery" label="Opportunities" min="{{gmin}}">
        <x-import component-from-global-scope="XOS.OpportunityCard" org="Northwind Live" verified="{{yes}}" role="Rigger, Fall Series" pay="$800 to $1,150 per day" date="Nov 18 to 22" place="Miami, FL" requirements="{{met}}" deadline="Apply by Nov 17" saved="{{yes}}"></x-import>
        <x-import component-from-global-scope="XOS.OpportunityCard" org="Harbor Light Events" verified="{{yes}}" role="Stage Manager, Winter Gala" pay="$650 per day" date="Dec 12 to 13" place="Miami Beach, FL" requirements="{{met}}" deadline="Apply by Dec 1"></x-import>
        <x-import component-from-global-scope="XOS.OpportunityCard" org="Northwind Live" verified="{{yes}}" role="Bartender, Closing Night" pay="{{nullPay}}" date="Nov 22" place="Miami, FL" requirements="{{tips}}" missing-action="Add TIPS" deadline="Apply by Nov 19"></x-import>
        <x-import component-from-global-scope="XOS.OpportunityCard" org="Coastline Productions" verified="{{yes}}" role="Deck Crew, Boat Show Build" pay="$34 per hour" date="Feb 9 to 14" place="Miami, FL" requirements="{{met}}" deadline="Apply by Jan 20"></x-import>
        <x-import component-from-global-scope="XOS.OpportunityCard" org="Harbor Light Events" verified="{{yes}}" role="Lighting Programmer" pay="$4,800 flat" date="Dec 10 to 13" place="Miami Beach, FL" requirements="{{osha}}" missing-action="Add OSHA 10" deadline="Apply by Nov 30"></x-import>
        <x-import component-from-global-scope="XOS.OpportunityCard" org="Northwind Live" verified="{{yes}}" role="Credential Desk Staff" pay="$22 per hour" date="Nov 20 to 22" place="Miami, FL" requirements="{{met}}" deadline="Apply by Nov 18"></x-import>
      </x-import>
    </div>
  </main>
  <div class="xos-mobile-only" style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" label="Gateway" active="Explore" items="{{nav}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"light"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'light',
      hpx: h ? h + 'px' : '100vh',
      yes: true, gmin: 300, nullPay: null,
      met: { missing: [] }, tips: { missing: ['TIPS certification'] }, osha: { missing: ['OSHA 10'] },
      tabs: [{ value: 'foryou', label: 'For You' }, { value: 'all', label: 'All' }, { value: 'saved', label: 'Saved', count: 3 }, { value: 'alerts', label: 'Alerts', count: 2 }],
      chips: ['Crew', 'Staff', 'Contractor', 'This week', 'Within 25 mi', 'Day rate', 'I qualify'],
      active: ['Crew', 'Within 25 mi'],
      nav: [{ label: 'Home', icon: 'House' }, { label: 'Explore', icon: 'Compass' }, { label: 'Work', icon: 'Briefcase' }, { label: 'Money', icon: 'Wallet' }, { label: 'Messages', icon: 'MessageSquare', badge: 2 }]
    };
  }
}
</script>
</body>
</html>
