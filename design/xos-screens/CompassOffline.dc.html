<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass · Offline Queue</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" class="xos-compass" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px;">
  <header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 12px 8px 4px; border-bottom: 1px solid var(--border-subtle);">
    <x-import component-from-global-scope="XOS.IconButton" icon="ChevronLeft" label="Back to More"></x-import>
    <strong style="flex: 1;">Offline Queue</strong>
  </header>
  <x-import component-from-global-scope="XOS.OfflineBanner" message="Offline since 7:41 PM. Changes will sync." queued="{{four}}"></x-import>
  <main class="xos-scroll-col" style="flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <section aria-labelledby="o-q" style="display: flex; flex-direction: column; gap: 8px;">
      <h1 id="o-q" class="xos-label" style="margin: 0;">Waiting to send · 4</h1>
      <x-import component-from-global-scope="XOS.RecordList" label="Queued changes">
        <x-import component-from-global-scope="XOS.RecordRow" state="proposed" state-label="Queued" record-key="INC-0012" title="Medical, minor · Box Office" next="7:42 PM" action-label="Open"></x-import>
        <x-import component-from-global-scope="XOS.RecordRow" state="proposed" state-label="Queued" record-key="NWL-151" kind="Inspection" title="Stage left egress walk, 3 of 4" next="7:44 PM" action-label="Open"></x-import>
        <x-import component-from-global-scope="XOS.RecordRow" state="proposed" state-label="Queued" record-key="NWL-166" kind="Task" title="2 photos, barricade pins" next="7:45 PM" action-label="Open"></x-import>
        <x-import component-from-global-scope="XOS.RecordRow" state="blocked" state-label="Conflict" record-key="NWL-142" kind="Task" title="Delivery window changed by someone else" next="Now" action-label="Resolve"></x-import>
      </x-import>
    </section>
    <x-import component-from-global-scope="XOS.SyncConflictSheet" message="Someone changed this field while you were offline." field="Delivery Window" mine="6:00 AM to 8:00 AM" mine-meta="You, 7:46 PM offline" theirs="7:00 AM to 9:00 AM" theirs-meta="Morgan Chen, 7:50 PM"></x-import>
    <span class="xos-muted" style="font-size: 14px;">Nothing is lost. Each item sends in order when you reconnect, and conflicts wait for you.</span>
  </main>
  <div style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" compass="{{yes}}" label="Compass" active="More" center-label="Scan" items="{{tabs}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"dark"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'dark',
      hpx: h ? h + 'px' : '100vh',
      yes: true, four: 4,
      tabs: [{ label: 'Today', icon: 'House' }, { label: 'Schedule', icon: 'CalendarDays' }, { label: 'Scan', icon: 'ScanLine' }, { label: 'Inbox', icon: 'Inbox', badge: 3 }, { label: 'Crew', icon: 'HardHat' }, { label: 'More', icon: 'Menu' }]
    };
  }
}
</script>
</body>
</html>
