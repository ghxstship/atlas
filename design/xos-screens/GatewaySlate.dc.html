<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway · Agency Slate</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px;">
  <x-import component-from-global-scope="XOS.TopNav" brand="XOS Gateway" label="Gateway" person="Renee Park" active="Explore" items="{{nav}}"></x-import>
  <main style="flex: 1; min-height: 0; overflow: auto;">
    <div style="max-width: 760px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <x-import component-from-global-scope="XOS.Breadcrumbs" items="{{crumbs}}"></x-import>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="xos-muted">Bayline Staffing · applying as an agency</span>
        <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Bar Staff, Closing Night</h1>
        <span class="xos-muted">Northwind Live · 4 positions · Sun, Nov 22 · Rate on Request</span>
      </div>
      <x-import component-from-global-scope="XOS.AgencySlate" positions="{{four}}" roster="{{roster}}"></x-import>
      <span class="xos-muted" style="font-size: 12px;">Only staff with a verified TIPS certification can be included. Northwind Live sees names, roles and certification status, never your internal notes.</span>
    </div>
  </main>
  <div class="xos-mobile-only" style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" label="Gateway" active="Explore" items="{{nav}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"light"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'light',
      hpx: h ? h + 'px' : '100vh',
      four: 4,
      roster: [
        { name: 'Ana Silva', role: 'Head Beverage Director / Bar Manager · 8000.50.01', selected: true, certs: [{ label: 'TIPS', ok: true }] },
        { name: 'Tom Lee', role: 'Bartender', selected: true, certs: [{ label: 'TIPS', ok: true }] },
        { name: 'Grace Kim', role: 'Bartender', selected: true, certs: [{ label: 'TIPS', ok: true }] },
        { name: 'Luis Ortega', role: 'Barback', selected: false, certs: [{ label: 'TIPS', ok: false }] }
      ],
      crumbs: [{ label: 'Explore' }, { label: 'Bar Staff, Closing Night' }, { label: 'Agency Slate' }],
      nav: [{ label: 'Home', icon: 'House' }, { label: 'Explore', icon: 'Compass' }, { label: 'Work', icon: 'Briefcase' }, { label: 'Money', icon: 'Wallet' }, { label: 'Messages', icon: 'MessageSquare' }]
    };
  }
}
</script>
</body>
</html>
