<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway · Crew Engagement</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px;">
  <x-import component-from-global-scope="XOS.TopNav" brand="Northwind Live" label="Gateway" person="Dana Ruiz" active="Work" items="{{nav}}"></x-import>
  <main style="flex: 1; min-height: 0; overflow: auto;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <x-import component-from-global-scope="XOS.Breadcrumbs" items="{{crumbs}}"></x-import>
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;"><x-import component-from-global-scope="XOS.Tag" tone="accent">Crew</x-import><x-import component-from-global-scope="XOS.StateChip" state="blocked" label="Onboarding"></x-import><span class="xos-muted">Northwind Live</span></div>
          <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Northwind Fall Series · Lead Stagehand</h1>
        </div>
        <x-import component-from-global-scope="XOS.Button" variant="primary" icon="FileSignature">Finish Onboarding</x-import>
      </div>
      <x-import component-from-global-scope="XOS.Tabs" label="Engagement" value="overview" tabs="{{tabs}}"></x-import>
      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
        <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
          <x-import component-from-global-scope="XOS.ProgressBar" label="Onboarding, 2 of 5 blocking items verified, about 11 minutes left" value="{{pct}}"></x-import>
          <section aria-labelledby="w-shifts" style="display: flex; flex-direction: column; gap: 8px;">
            <h2 id="w-shifts" class="xos-label" style="margin: 0;">Your shifts · 4</h2>
            <x-import component-from-global-scope="XOS.ShiftCard" state="scheduled" state-label="Scheduled" countdown="in 2 d 13 h" role="Lead Stagehand · Build day" date="Wed, Nov 18" time="6:00 AM to 4:00 PM" place="Harbor Pavilion, Dock B"></x-import>
            <x-import component-from-global-scope="XOS.ShiftCard" state="scheduled" state-label="Scheduled" role="Lead Stagehand · Show call" date="Fri, Nov 20" time="2:00 PM to 11:30 PM" place="Harbor Pavilion, Dock B"></x-import>
          </section>
          <dl class="xos-card" style="margin: 0; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 12px 20px;">
            <dt class="xos-muted">Rate</dt><dd style="margin: 0;">$550 per day · LRC-022 · overtime at 1.5x after 40 hours</dd>
            <dt class="xos-muted">Classification</dt><dd style="margin: 0;">Employee · paid through payroll on a W-2</dd>
            <dt class="xos-muted">Per diem</dt><dd style="margin: 0;">None · local crew</dd>
            <dt class="xos-muted">Credential</dt><dd style="margin: 0;"><span class="xos-code">CRD-0142</span> · Production · Nov 16 to 23</dd>
          </dl>
        </div>
        <aside aria-label="Engagement stages" style="flex: 1 1 300px; min-width: 0;"><x-import component-from-global-scope="XOS.EngagementTimeline" current="{{five}}" stages="{{stages}}"></x-import></aside>
      </div>
    </div>
  </main>
  <div class="xos-mobile-only" style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" label="Gateway" active="Work" items="{{nav}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"light"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'light',
      hpx: h ? h + 'px' : '100vh',
      five: 5, pct: 40,
      tabs: ['Overview', 'Offer', 'Onboarding', 'Shifts', 'Timesheets', 'Travel and Lodging', 'Per Diem', 'Credentials', 'Documents', 'Messages'].map((t) => ({ value: t.toLowerCase(), label: t })),
      stages: [{ label: 'Requisition' }, { label: 'Opportunity', date: 'Oct 12' }, { label: 'Application', date: 'Oct 14' }, { label: 'Selection', date: 'Oct 22' }, { label: 'Offer', date: 'Oct 26' }, { label: 'Onboarding', date: 'Now' }, { label: 'Engaged', date: 'Nov 16' }, { label: 'Close-out' }, { label: 'Re-engagement' }],
      crumbs: [{ label: 'Work' }, { label: 'Engagements' }, { label: 'Northwind Fall Series' }],
      nav: [{ label: 'Home', icon: 'House' }, { label: 'Explore', icon: 'Compass' }, { label: 'Work', icon: 'Briefcase' }, { label: 'Money', icon: 'Wallet' }, { label: 'Messages', icon: 'MessageSquare', badge: 2 }]
    };
  }
}
</script>
</body>
</html>
