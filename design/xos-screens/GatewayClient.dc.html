<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gateway · Client Engagement</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px;">
  <x-import component-from-global-scope="XOS.TopNav" brand="Northwind Live" label="Gateway" person="Priya Shah" active="Work" items="{{nav}}"></x-import>
  <main style="flex: 1; min-height: 0; overflow: auto;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <x-import component-from-global-scope="XOS.Breadcrumbs" items="{{crumbs}}"></x-import>
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;"><x-import component-from-global-scope="XOS.Tag" tone="accent">Client</x-import><x-import component-from-global-scope="XOS.StateChip" state="active" label="Active"></x-import><span class="xos-muted">Brightwater Beverage</span></div>
          <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Coastline Brand Launch</h1>
        </div>
        <x-import component-from-global-scope="XOS.Button" variant="primary" icon="Check">Review Approvals</x-import>
      </div>
      <x-import component-from-global-scope="XOS.Tabs" label="Engagement" value="overview" tabs="{{tabs}}"></x-import>
      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
        <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
          <div class="xos-layout-dashboard">
            <x-import component-from-global-scope="XOS.StatTile" label="Approvals waiting" value="{{two}}"></x-import>
            <x-import component-from-global-scope="XOS.StatTile" label="Contract value" value="{{value}}" format="money" caption="Signed proposal v3"></x-import>
            <x-import component-from-global-scope="XOS.StatTile" label="Invoiced to date" value="{{invoiced}}" format="money" caption="2 of 4 milestones"></x-import>
          </div>
          <section aria-labelledby="c-needs" style="display: flex; flex-direction: column; gap: 8px;">
            <h2 id="c-needs" class="xos-label" style="margin: 0;">Waiting on you</h2>
            <x-import component-from-global-scope="XOS.RecordList" label="Waiting on you">
              <x-import component-from-global-scope="XOS.RecordRow" state="ready" state-label="Ready" record-key="CBL-044" kind="Approval" title="Approve stage renderings v2" next="Nov 18" action-label="Approve" action-key="A"></x-import>
              <x-import component-from-global-scope="XOS.RecordRow" state="ready" state-label="Ready" record-key="CBL-CO-004" kind="Approval" title="Change order: second LED wall, $6,200" next="Nov 19" action-label="Review"></x-import>
            </x-import>
          </section>
          <section aria-labelledby="c-sched" style="display: flex; flex-direction: column; gap: 8px;">
            <h2 id="c-sched" class="xos-label" style="margin: 0;">Coming up</h2>
            <x-import component-from-global-scope="XOS.RecordList" label="Coming up">
              <x-import component-from-global-scope="XOS.RecordRow" state="scheduled" state-label="Scheduled" record-key="CBL-050" kind="Meeting" title="Walkthrough at Bayfront Park" next="Dec 2" action-label="Add to Calendar"></x-import>
              <x-import component-from-global-scope="XOS.RecordRow" state="scheduled" state-label="Scheduled" record-key="CBL-061" kind="Event" title="Launch night" next="Dec 5" action-label="Run of Show"></x-import>
            </x-import>
          </section>
        </div>
        <aside aria-label="Engagement stages" style="flex: 1 1 300px; min-width: 0;"><x-import component-from-global-scope="XOS.EngagementTimeline" current="{{six}}" stages="{{stages}}"></x-import></aside>
      </div>
    </div>
  </main>
  <div class="xos-mobile-only" style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" label="Gateway" active="Work" items="{{nav}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"light"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'light',
      hpx: h ? h + 'px' : '100vh',
      two: 2, six: 6, value: 148000, invoiced: 74000,
      tabs: ['Overview', 'Approvals', 'Schedule', 'Run of Show', 'Change Orders', 'Reports', 'Invoices', 'Documents', 'Messages'].map((t) => ({ value: t.toLowerCase(), label: t })),
      stages: [{ label: 'Requisition' }, { label: 'Opportunity' }, { label: 'Application' }, { label: 'Selection' }, { label: 'Offer', date: 'Sep 30' }, { label: 'Onboarding', date: 'Oct 6' }, { label: 'Engaged', date: 'Now' }, { label: 'Close-out' }, { label: 'Re-engagement' }],
      crumbs: [{ label: 'Work' }, { label: 'Engagements' }, { label: 'Coastline Brand Launch' }],
      nav: [{ label: 'Home', icon: 'House' }, { label: 'Explore', icon: 'Compass' }, { label: 'Work', icon: 'Briefcase' }, { label: 'Money', icon: 'Wallet' }, { label: 'Messages', icon: 'MessageSquare', badge: 1 }]
    };
  }
}
</script>
</body>
</html>
