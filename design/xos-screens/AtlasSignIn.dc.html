<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas · Sign In</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-surface); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px;">
  <main class="xos-layout-auth" style="flex: 1; align-content: center;">
    <div class="xos-card">
      <div class="xos-card-body" style="display: flex; flex-direction: column; gap: 16px; padding: 32px;">
        <x-import component-from-global-scope="XOS.BrandMark" name="Northwind Live" size="lg"></x-import>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2;">Sign in to Atlas</h1>
          <p style="margin: 0; color: var(--text-secondary);">northwindlive.xos.app</p>
        </div>
        <x-import component-from-global-scope="XOS.Button" variant="primary" size="lg" icon="KeyRound" class-name="xos-block">Use Passkey</x-import>
        <x-import component-from-global-scope="XOS.Button" size="lg" class-name="xos-block">Continue with Apple</x-import>
        <x-import component-from-global-scope="XOS.Button" size="lg" class-name="xos-block">Continue with Google</x-import>
        <x-import component-from-global-scope="XOS.Divider" label="or"></x-import>
        <x-import component-from-global-scope="XOS.Input" label="Work email" width="100%" type="email" placeholder="you@northwindlive.com" autocomplete="username webauthn"></x-import>
        <x-import component-from-global-scope="XOS.Button" size="lg" icon="Mail" class-name="xos-block">Email Me a Link</x-import>
        <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
          <x-import component-from-global-scope="XOS.Link" href="#password">Use a password</x-import>
          <x-import component-from-global-scope="XOS.Link" href="#sso">Sign in with SSO</x-import>
        </div>
      </div>
    </div>
  </main>
  <footer style="display: flex; justify-content: center; gap: 16px; padding: 16px; color: var(--text-tertiary); font-size: 12px;">
    <x-import component-from-global-scope="XOS.Link" href="#terms">Terms</x-import>
    <x-import component-from-global-scope="XOS.Link" href="#privacy">Privacy</x-import>
    <x-import component-from-global-scope="XOS.Link" href="#status">System Status</x-import>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"dark"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return { theme: this.props.theme ?? 'dark', hpx: h ? h + 'px' : '100vh' };
  }
}
</script>
</body>
</html>
