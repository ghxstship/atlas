<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compass · Profile and Certifications</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;padding:0}</style>
</helmet>
<div data-theme="{{theme}}" class="xos-compass" style="height: {{hpx}}; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 16px;">
  <header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 12px 8px 4px; border-bottom: 1px solid var(--border-subtle);">
    <x-import component-from-global-scope="XOS.IconButton" icon="ChevronLeft" label="Back to More"></x-import>
    <strong style="flex: 1;">Profile and Certifications</strong>
  </header>
  <main class="xos-scroll-col" style="flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <x-import component-from-global-scope="XOS.Avatar" name="Malik Osei" size="lg"></x-import>
      <div style="display: flex; flex-direction: column;"><strong style="font-size: 20px;">Malik Osei</strong><span class="xos-muted">Field Supervisor · Northwind Live</span></div>
    </div>
    <x-import component-from-global-scope="XOS.Button" variant="primary" size="lg" icon="QrCode" class-name="xos-block">Show My Badge</x-import>
    <x-import component-from-global-scope="XOS.InlineAlert" tone="warning" title="First Aid and CPR expires Dec 4">Upload the renewal to keep working shifts that require it.</x-import>
    <section aria-labelledby="p-cert" style="display: flex; flex-direction: column; gap: 8px;">
      <h1 id="p-cert" class="xos-label" style="margin: 0;">Certifications</h1>
      <x-import component-from-global-scope="XOS.DataTable" caption="Your certifications and expiry" density="comfortable" columns="{{cols}}" rows="{{rows}}"></x-import>
    </section>
    <div class="xos-card" style="padding: 12px 16px; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px;">
      <span class="xos-muted">Emergency contact</span><span>Ama Osei · last 4: 2210</span>
      <span class="xos-muted">Uniform</span><span>Shirt L · Jacket L</span>
      <span class="xos-muted">Documents</span><span>3 on file</span>
    </div>
  </main>
  <div style="flex: none;"><x-import component-from-global-scope="XOS.TabBar" compass="{{yes}}" label="Compass" active="More" center-label="Scan" items="{{tabs}}"></x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","sunlight"],"default":"dark"},"h":{"editor":"int","default":0,"min":0,"max":2000,"unit":"px"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const h = Number(this.props.h) || 0;
    return {
      theme: this.props.theme ?? 'dark',
      hpx: h ? h + 'px' : '100vh',
      yes: true,
      cols: [{ key: 'c', label: 'Certification' }, { key: 's', label: 'Status', type: 'state' }],
      rows: [
        { c: 'OSHA 30-Hour Construction', s: { state: 'complete', label: 'Verified' } },
        { c: 'Arena rigging certification', s: { state: 'complete', label: 'Until Mar 2028' } },
        { c: 'First Aid, CPR and AED', s: { state: 'deferred', label: 'Expires Dec 4' } },
        { c: 'Aerial lift operator', s: { state: 'in-review', label: 'In Review' } }
      ],
      tabs: [{ label: 'Today', icon: 'House' }, { label: 'Schedule', icon: 'CalendarDays' }, { label: 'Scan', icon: 'ScanLine' }, { label: 'Inbox', icon: 'Inbox', badge: 3 }, { label: 'Crew', icon: 'HardHat' }, { label: 'More', icon: 'Menu' }]
    };
  }
}
</script>
</body>
</html>
