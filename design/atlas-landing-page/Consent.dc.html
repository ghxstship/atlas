<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>Consent Banner States</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/xos/tokens.css">
<link rel="stylesheet" href="ds/xos/components/bundle.css">
<script src="ds/xos/components/lib/react-alias.js"></script>
<script src="ds/xos/components/lib/lucide-react.min.js"></script>
<script src="ds/xos/components/lib/qrcode-generator.js"></script>
<script src="ds/xos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html body{margin:0;padding:0}
a{color:var(--accent-text)}a:hover{color:var(--accent-text)}
</style>
</helmet>
<div data-theme="dark" style="width: 880px; height: 520px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; line-height: 1.45">
<div style="display: flex; flex-direction: column; gap: 8px">
<p class="xos-label" style="margin: 0">First visit, no choice made</p>
<x-import component-from-global-scope="XOS.ConsentBanner" title="Cookies" body="We use cookies to keep you signed in and to remember this choice. With your permission we also remember your language, theme and last workspace for 12 months instead of this visit. We use no advertising or tracking cookies." policy="{{policy}}" accept-label="Accept all" reject-label="Reject all" choose-label="Choose cookies" necessary="Strictly necessary: sign-in, security and this choice. Always on." categories="{{categories}}" save-label="Save choices"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<p class="xos-label" style="margin: 0">Browser sends Global Privacy Control</p>
<x-import component-from-global-scope="XOS.ConsentBanner" title="Cookies" gpc="{{yes}}"></x-import>
</div>
<p class="xos-mkt-note">The page reuses the cookie banner, the consent log and the Global Privacy Control handling that Atlas already ships. Accept and Reject carry equal weight, and no category is pre-checked.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":520}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
policy: { label: 'Cookie Policy', href: '#cookie-policy' },
categories: [
{ name: 'preferences', label: 'Preferences: remember your language, theme, workspace and last organization for 12 months.' },
{ name: 'performance', label: 'Performance: page timing and error reports.' }
]
};
}
}
</script>
</body>
</html>
