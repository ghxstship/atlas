  - sheet: Emergency Codes
    key: emergency_codes
    destination: standard-library
    entity: xpms.emergency_protocol
    columns:
      - letter: A
        header: RECORD ID
        key: record_id
        disposition: field
        target: xpms.emergency_protocol.record_key
        type: text
      - letter: B
        header: ORGANIZATION
        key: organization
        disposition: field
        target: xpms.production_template_metadata.value_text
        type: text
        formula: ='Cover Page'!$I$8
        transform: Formula reference to Cover Page I8; ruling D15 drops organization from protocols, so it is read from the template metadata.
      - letter: C
        header: PROJECT
        key: project
        disposition: field
        target: xpms.production_template_metadata.value_text
        type: text
        formula: ='Cover Page'!$C$7
        transform: Formula reference to Cover Page C7; ruling D15 drops project from protocols.
      - letter: D
        header: DEPARTMENT
        key: department
        disposition: field
        target: xpms.emergency_protocol.department
        type: text
      - letter: E
        header: CATEGORY
        key: category
        disposition: field
        target: xpms.emergency_protocol.category
        type: text
      - letter: F
        header: SUB CATEGORY
        key: sub_category
        disposition: field
        target: xpms.emergency_protocol.sub_category
        type: text
      - letter: G
        header: EMERGENCY
        key: emergency
        disposition: field
        target: xpms.emergency_code.emergency
        type: text
      - letter: H
        header: RADIO CALL
        key: radio_call
        disposition: field
        target: xpms.emergency_code.code
        type: text
        transform: CODE RED becomes the code token CODE_RED and the label Code Red.
      - letter: I
        header: OPERATIONAL DOMAIN
        key: operational_domain
        disposition: field
        target: xpms.emergency_protocol.domain
        type: text
      - letter: J
        header: ACTION PROTOCOL
        key: action_protocol
        disposition: field
        target: xpms.emergency_protocol_step.body
        type: text
        transform: Split into numbered steps; ruling D15 replaces agency names with service tokens.
      - letter: K
        header: STATUS
        key: status
        disposition: field
        target: xpms.emergency_protocol.source_status
        type: text
      - letter: L
        header: FLAG
        key: flag
        disposition: field
        target: xpms.emergency_protocol.flag
        type: bool
      - letter: M
        header: NOTES
        key: notes
        disposition: field
        target: xpms.emergency_protocol.notes
        type: text
      - letter: N
        header: CREATED BY
        key: created_by
        disposition: field
        target: xpms.emergency_protocol.source_created_by
        type: text
      - letter: O
        header: CREATED AT
        key: created_at
        disposition: field
        target: xpms.emergency_protocol.source_created_at
        type: timestamp
      - letter: P
        header: UPDATED AT
        key: updated_at
        disposition: field
        target: xpms.emergency_protocol.source_updated_at
        type: timestamp
    query: "select p.source_row, xpms.pb_text(p.record_key) as record_id, xpms.pb_text(xpms.pb_cover(8, 9)) as organization, xpms.pb_text(xpms.pb_cover(7, 3)) as project, xpms.pb_text(p.department) as department, xpms.pb_text(p.category) as category, xpms.pb_text(p.sub_category) as sub_category, xpms.pb_text(c.emergency) as emergency, replace(c.code, '_', ' ') as radio_call, xpms.pb_text(p.domain) as operational_domain, xpms.pb_text('Actions: ' || (select string_agg(s.step_no || '. ' || s.body, ' ' order by s.step_no) from xpms.emergency_protocol_step s where s.record_key = p.record_key)) as action_protocol, xpms.pb_text(p.source_status) as status, xpms.pb_bool(p.flag) as flag, xpms.pb_text(p.notes) as notes, xpms.pb_text(p.source_created_by) as created_by, xpms.pb_ts(p.source_created_at) as created_at, xpms.pb_ts(p.source_updated_at) as updated_at from xpms.emergency_protocol p join xpms.emergency_code c on c.code = p.code"
