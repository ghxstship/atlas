        key: tier
        disposition: field
        target: app.projects.tier
        type: text
      - letter: K
        header: BUDGET ENVELOPE
        key: budget_envelope
        disposition: field
        target: app.projects.budget_envelope
        type: numeric
        real_world: price
      - letter: L
        header: COMMITTED AMOUNT
        key: committed_amount
        disposition: computed
        target: app.projects.committed_amount
        type: numeric
        formula: =SUMIFS('Budget Expenses'!$X:$X, 'Budget Expenses'!$B:$B, A2)
        sql: coalesce((select sum(x.committed) from xpms.v_sheet_budget_expenses x where x.project_id = r.project_id), 0)
      - letter: M
        header: ACTUAL SPEND
        key: actual_spend
        disposition: computed
        target: app.projects.actual_spend
        type: numeric
        formula: =SUMIFS('Budget Expenses'!$Z:$Z, 'Budget Expenses'!$B:$B, A2)
        sql: coalesce((select sum(xpms.pb_n(x.actual)) from xpms.v_sheet_budget_expenses x where x.project_id = r.project_id), 0)
      - letter: N
        header: APPROVED CHANGE ORDERS
        key: approved_change_orders
        disposition: computed
        target: app.projects.approved_change_orders
        type: numeric
        formula: =SUMIFS('Change Orders'!$M:$M, 'Change Orders'!$B:$B, A2, 'Change Orders'!$W:$W, "Approved")
        sql: coalesce((select sum(x.total_amount) from xpms.v_sheet_change_orders x where x.project_id = r.project_id and x.status = 'Approved'), 0)
      - letter: O
        header: PRODUCTION TASKS
        key: production_tasks
        disposition: computed
        target: app.projects.production_tasks
        type: numeric
        formula: =COUNTIFS('Production Tasks'!$B:$B, A2, 'Production Tasks'!$V:$V, "Active")
        sql: (select count(*) from xpms.v_sheet_production_tasks x where x.project_id = r.project_id and x.status = 'Active')
      - letter: P
        header: OPERATIONAL STATE
