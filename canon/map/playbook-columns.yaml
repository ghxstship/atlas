        transform: "Template only: duration is derived from starts_at and ends_at (Section 3.15)."
      - letter: P
        header: PREDECESSORS
        key: predecessors
        disposition: field
        target: app.record_dependencies.predecessor_record_id
        type: text
        transform: Each predecessor task becomes a Finish to Start dependency.
      - letter: Q
        header: PRIORITY
        key: priority
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: records have no priority, and owner decision 25 adds no structure the Bible lacks (the Bible wins on structure), so the label stays in the template. Incident Priority is a different list."
      - letter: R
        header: DELIVERABLE
        key: deliverable
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the deliverable is named in free text; XOS models deliverables as Document records (Section 3.10), which the template does not mint by name."
      - letter: S
        header: LINKED WORK ORDER ID
        key: linked_work_order_id
        disposition: field
        target: app.work_orders.record_id
        type: text
        transform: Work order linked to the task.
      - letter: T
        header: SOP ID
        key: sop_id
        disposition: field
        target: app.records.sop_id
        type: text
        transform: Standard operating procedure that governs the task, matched by SOP code.
      - letter: U
        header: PROGRESS (%)
        key: progress_pct
        disposition: field
        target: app.record_task.progress_pct
        type: numeric
        transform: Progress of the task record (0 to 1 in the Playbook, a percentage in XOS).
      - letter: V
        header: STATUS
        key: status
        disposition: field
        target: app.records.record_state
        type: text
        transform: Record state (Section 3.10).
      - letter: W
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: X
        header: NOTES
        key: notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.records').
  - sheet: Work Orders
    key: work_orders
    destination: production-template
    entity: app.records
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: RECORD ID
        key: record_id
        disposition: field
        target: app.work_orders.work_order_number
        type: text
        transform: WO-nnn gives the work order number within the project.
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: computed
        target: app.records.project_id
        type: text
        formula: ='Cover Page'!$C$7
        sql: xpms.pb_cover(7, 3)
      - letter: C
        header: DEPARTMENT
        key: department
        disposition: field
        target: app.work_orders.urid
        type: text
        transform: Department segment of the work order's URID.
      - letter: D
        header: CATEGORY
        key: category
        disposition: field
        target: app.work_orders.urid
        type: text
        transform: Discipline of the work order's URID; the category label names it.
      - letter: E
        header: SUB CATEGORY
        key: sub_category
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the URID has no fourth segment (Section 3.3), so a sub category below the category has no column; the label stays in the template."
      - letter: F
        header: WORK ORDER TYPE
        key: work_order_type
        disposition: field
        target: app.records.record_subtype
        type: text
        transform: "Subtype of the work order's record (work_orders.record_id), a Build record. Owner decision 25: AVL Installation, Network Deployment and Rigging & Focus map to Systems, Facility Setup to Structural and Security Commissioning to Commissioning (xpms.label_mapping)."
      - letter: G
        header: PRIORITY
        key: priority
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: records have no priority, and owner decision 25 adds no structure the Bible lacks (the Bible wins on structure), so the label stays in the template. Incident Priority is a different list."
      - letter: H
        header: LOCATION ID
        key: location_id
        disposition: field
        target: app.work_orders.location_text
        type: text
        transform: Name of the location the work happens at.
      - letter: I
        header: LOCATION NAME
        key: location_name
        disposition: computed
        target: app.records.location_name
        type: text
        formula: =IF(ISBLANK(H2), "", _xlfn.XLOOKUP(H2, Locations!$A$2:$A100, Locations!$F$2:$F100, ""))
        sql: case when r.location_id is null then null else (select x.location from xpms.v_sheet_locations x where x.record_id = r.location_id order by x.source_row limit 1) end
      - letter: J
        header: ITEM ID
        key: item_id
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the item a work order installs is reached through its record's supply lines; work orders hold no element."
      - letter: K
        header: TEAM CODE
        key: team_code
        disposition: field
        target: app.records.team_code
        type: text
        transform: Canon team of the work order's record (work_orders.record_id).
      - letter: L
        header: PERSONNEL ID
        key: personnel_id
        disposition: field
        target: app.record_assignments.membership_id
        type: text
        transform: Person assigned to the work order's record.
      - letter: M
        header: LEAD ASSIGNEE NAME
        key: lead_assignee_name
        disposition: computed
        target: app.records.lead_assignee_name
        type: text
        formula: =IF(ISBLANK(L2), "", TRIM(_xlfn.XLOOKUP(L2, 'Personnel Roster'!$A$2:$A100, 'Personnel Roster'!$D$2:$D100, "") & " " & _xlfn.XLOOKUP(L2, 'Personnel Roster'!$A$2:$A100, 'Personnel Roster'!$E$2:$E100, "")))
        sql: case when r.personnel_id is null then null else nullif(btrim(coalesce((select p.first_name from xpms.v_sheet_personnel_roster p where p.personnel_id = r.personnel_id order by p.source_row limit 1), '') || ' ' || coalesce((select p.last_name from xpms.v_sheet_personnel_roster p where p.personnel_id = r.personnel_id order by p.source_row limit 1), '')), '') end
      - letter: N
        header: TASK TITLE
        key: task_title
        disposition: field
        target: app.work_orders.title
        type: text
        transform: Work order title.
      - letter: O
        header: DESCRIPTION
        key: description
        disposition: field
        target: app.records.description
        type: text
        transform: Description of the work order's record.
      - letter: P
        header: SCOPE OF WORK
        key: scope_of_work
        disposition: field
        target: app.work_orders.scope_of_work
        type: text
        transform: Scope of work.
      - letter: Q
        header: SCHEDULED START DATE
        key: scheduled_start_date
        disposition: field
        target: app.work_orders.scheduled_starts_at
        type: date
        transform: Scheduled start.
      - letter: R
        header: SCHEDULED END DATE
        key: scheduled_end_date
        disposition: field
        target: app.work_orders.scheduled_ends_at
        type: date
        transform: Scheduled end.
      - letter: S
        header: ACTUAL START DATE
        key: actual_start_date
        disposition: field
        target: app.schedule_actuals.actual_starts_at
        type: date
        transform: Actual start of the work order's record.
      - letter: T
        header: ACTUAL END DATE
        key: actual_end_date
        disposition: field
        target: app.schedule_actuals.actual_ends_at
        type: date
        transform: Actual end of the work order's record.
      - letter: U
        header: ESTIMATED HOURS
        key: estimated_hours
        disposition: field
        target: app.work_orders.estimated_hours
        type: numeric
        transform: Estimated hours.
      - letter: V
        header: ACTUAL HOURS
        key: actual_hours
        disposition: field
        target: xpms.production_template_values.value_text
        type: numeric
        transform: "Template only: actual hours are derived from time entries (Section 3.15)."
      - letter: W
        header: LABOR RATE
        key: labor_rate
        disposition: field
        target: xpms.production_template_values.value_text
        type: numeric
        transform: "Template only: the labor rate resolves from the rate card of the assigned role; the work order does not restate it."
        real_world: price
      - letter: X
        header: TOTAL LABOR COST
        key: total_labor_cost
        disposition: computed
        target: app.records.total_labor_cost
        type: numeric
        formula: =V2*W2
        sql: coalesce(xpms.pb_n(r.actual_hours), 0) * coalesce(xpms.pb_n(r.labor_rate), 0)
      - letter: Y
        header: SAFETY HAZARD LEVEL
        key: safety_hazard_level
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: a hazard rating has no list in the Enumerations library; the work order's safety notes go on its comment thread."
      - letter: Z
        header: COMPLETION PERCENTAGE
        key: completion_percentage
        disposition: field
        target: app.record_task.progress_pct
        type: numeric
        transform: Progress of the work order's record.
      - letter: AA
        header: STATUS
        key: status
        disposition: field
        target: app.work_orders.work_order_state
        type: text
        transform: "Work order state (owner decision 25): Completed maps to Complete, In Progress is a state, and Scheduled maps to the closest existing state, Awarded (xpms.label_mapping). No state is added."
      - letter: AB
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: AC
        header: RESOLUTION NOTES
