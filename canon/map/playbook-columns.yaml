  - sheet: Asset Inventory
    key: asset_inventory
    destination: production-template
    entity: app.asset_units
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: RECORD ID
        key: record_id
        disposition: field
        target: app.asset_units.asset_tag
        type: text
        transform: The AST-nnnn record id is the asset tag, a code XOS issues (Section 3.6).
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: computed
        target: app.asset_units.project_id
        type: text
        formula: ='Cover Page'!$C$7
        sql: case when r.record_id is null then null else xpms.pb_cover(7, 3) end
      - letter: C
        header: ITEM ID
        key: item_id
        disposition: field
        target: app.asset_classes.element_id
        type: text
        transform: Item id resolved to the element of the unit's asset class (asset_units.asset_class_id).
      - letter: D
        header: ITEM
        key: item
        disposition: computed
        target: app.asset_units.item
        type: text
        formula: =IF(ISBLANK(C2), "", _xlfn.XLOOKUP(C2, 'Procurement Catalog'!$A$2:$A1038, 'Procurement Catalog'!$C$2:$C1038, ""))
        sql: case when r.item_id is null then null else (select x.item_name from xpms.v_sheet_procurement_catalog x where x.item_id = r.item_id order by x.source_row limit 1) end
      - letter: E
        header: DESCRIPTION
        key: description
        disposition: computed
        target: app.asset_units.description
        type: text
        formula: =IF(ISBLANK(C2), "", _xlfn.XLOOKUP(C2, 'Procurement Catalog'!$A$2:$A1038, 'Procurement Catalog'!$M$2:$M1038, ""))
        sql: case when r.item_id is null then null else (select x.description from xpms.v_sheet_procurement_catalog x where x.item_id = r.item_id order by x.source_row limit 1) end
      - letter: F
        header: SPECIFICATIONS
        key: specifications
        disposition: computed
        target: app.asset_units.specifications
        type: text
        formula: =IF(ISBLANK(C2), "", _xlfn.XLOOKUP(C2, 'Procurement Catalog'!$A$2:$A1038, 'Procurement Catalog'!$N$2:$N1038, ""))
        sql: case when r.item_id is null then null else (select x.specifications from xpms.v_sheet_procurement_catalog x where x.item_id = r.item_id order by x.source_row limit 1) end
      - letter: G
        header: COLOR
        key: color
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: a free attribute of the physical unit; the unit records identifiers and condition, not appearance."
      - letter: H
        header: MAKE & MODEL
        key: make_and_model
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: make and model belong to the asset class and its element, not to each unit; the column is empty in the Playbook."
      - letter: I
        header: SERIAL NUMBER
        key: serial_number
        disposition: field
        target: app.asset_identifiers.value
        type: text
        transform: Recorded as an identifier of the unit with identifier class serial (issued by the manufacturer, Section 3.9).
        real_world: identifier
      - letter: J
        header: LABEL
        key: label
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: a working nickname (Radio 01); the unit is identified by its asset tag."
      - letter: K
        header: QUANTITY
        key: quantity
        disposition: field
        target: xpms.production_template_values.value_text
        type: numeric
