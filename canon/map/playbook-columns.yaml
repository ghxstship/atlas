    query: select e.source_row, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'ITEM ID', (e.element_id)::text)) as item_id, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'URID', (e.urid)::text)) as urid, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'ITEM NAME', (e.item)::text)) as item_name, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'RESOURCE KIND', (e.kind)::text)) as resource_kind, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'SCHEMA FAMILY (XYZ)', (e.xyz)::text)) as schema_family_xyz, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'DEFAULT GL ACCOUNT', (coalesce(e.purchase_account, e.sales_account))::text)) as default_gl_account, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'DEFAULT GL NAME', (g.account_name)::text)) as default_gl_name, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'DEFAULT COST CENTER', (e.default_cost_center)::text)) as default_cost_center, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'UNIT OF MEASURE', (e.unit_basis)::text)) as unit_of_measure, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'GRADE 1 BASIC ($ LOW)', (nullif(xpms.pb_num((select b.amount_minor / 100.0 from xpms.element_price_bands b where b.element_id = e.element_id and b.grade_code = 'base')), ''))::text)) as grade_1_basic_low, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'GRADE 2 STANDARD ($ COST)', (nullif(xpms.pb_num((select b.amount_minor / 100.0 from xpms.element_price_bands b where b.element_id = e.element_id and b.grade_code = 'elevated')), ''))::text)) as grade_2_standard_cost, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'GRADE 3 PREMIUM ($ HIGH)', (nullif(xpms.pb_num((select b.amount_minor / 100.0 from xpms.element_price_bands b where b.element_id = e.element_id and b.grade_code = 'premium')), ''))::text)) as grade_3_premium_high, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'DESCRIPTION', (e.description)::text)) as description, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'SPECIFICATIONS', (e.specification)::text)) as specifications, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'LEAD TIME (HRS)', (nullif(xpms.pb_num(e.lead_time_hours), ''))::text)) as lead_time_hrs, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'TIER', (t.tier_code || ' ' || t.tier)::text)) as tier, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'DEFAULT PHASE', (coalesce(p.phase, (select i.proposed_value from xpms.intake i where i.source_column = 'default_phase' and i.target_key = e.element_id)))::text)) as default_phase, xpms.pb_text(xpms.pb_overlay('Procurement Catalog', e.source_row::integer, 'EXTERNAL REF', (e.external_ref)::text)) as external_ref from xpms.elements e join xpms.dim_tier t on t.tier_code = e.tier_code left join xpms.dim_gl_account g on g.account_code = coalesce(e.purchase_account, e.sales_account) left join xpms.bridge_element_phase bp on bp.element_id = e.element_id and bp.is_default left join xpms.dim_phase p on p.phase_code = bp.phase_code where e.source_row is not null
