        type: text
      - letter: M
        header: TARGET ENTITY
        key: target_entity
        disposition: field
        target: xpms.std_enumeration.target_entity
        type: text
      - letter: N
        header: IS DEFAULT
        key: is_default
        disposition: field
        target: xpms.std_enumeration.is_default
        type: bool
      - letter: O
        header: STATUS
        key: status
        disposition: field
        target: xpms.std_enumeration.status
        type: text
      - letter: P
        header: Workflow Status
        key: workflow_status
        disposition: computed
        target: xpms.std_enumeration.workflow_status
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("UNIQUE({FILTER(I$2:I$110, G$2:G$110=""Workflow Status""); ""Planned""; ""Behind""; ""Milestone Met""})"),"Active")
        sql: (select u.v from (select distinct on (v) v, ord from (select e.enum_label::text as v, e.source_row as ord from xpms.std_enumeration e where e.enum_domain = 'Workflow Status' union all select x.v, 100000 + x.k from (values ('Planned', 1), ('Behind', 2), ('Milestone Met', 3)) as x(v, k)) a order by v, ord) u order by u.ord offset (r.source_row - 2) limit 1)
      - letter: Q
        header: Incident Priority
        key: incident_priority
        disposition: computed
        target: xpms.std_enumeration.incident_priority
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("UNIQUE({FILTER(I$2:I$110, G$2:G$110=""Incident Priority""); ""Critical""; ""High""; ""Medium""; ""Low""})"),"Critical (P1)")
        sql: (select u.v from (select distinct on (v) v, ord from (select e.enum_label::text as v, e.source_row as ord from xpms.std_enumeration e where e.enum_domain = 'Incident Priority' union all select x.v, 100000 + x.k from (values ('Critical', 1), ('High', 2), ('Medium', 3), ('Low', 4)) as x(v, k)) a order by v, ord) u order by u.ord offset (r.source_row - 2) limit 1)
      - letter: R
        header: Shift & Timesheet Status
        key: shift_and_timesheet_status
        disposition: computed
        target: xpms.std_enumeration.shift_and_timesheet_status
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("UNIQUE({FILTER(I$2:I$110, (G$2:G$110=""Workflow Status"")+(G$2:G$110=""Payment Status"")); ""Draft""; ""Published""; ""Confirmed""; ""Checked-In""; ""Rejected""; ""Exported""})"),"Active")
        sql: (select u.v from (select distinct on (v) v, ord from (select e.enum_label::text as v, e.source_row as ord from xpms.std_enumeration e where e.enum_domain in ('Workflow Status', 'Payment Status') union all select x.v, 100000 + x.k from (values ('Draft', 1), ('Published', 2), ('Confirmed', 3), ('Checked-In', 4), ('Rejected', 5), ('Exported', 6)) as x(v, k)) a order by v, ord) u order by u.ord offset (r.source_row - 2) limit 1)
      - letter: S
        header: Clearance Tier
        key: clearance_tier
        disposition: computed
        target: xpms.std_enumeration.clearance_tier
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("UNIQUE({FILTER(I$2:I$110, G$2:G$110=""Clearance Tier""); ""Tier 1 All-Access""; ""Tier 2 Production""; ""Tier 3 Crew""; ""Tier 4 Guest""})"),"Tier 1 - Executive Master")
        sql: (select u.v from (select distinct on (v) v, ord from (select e.enum_label::text as v, e.source_row as ord from xpms.std_enumeration e where e.enum_domain = 'Clearance Tier' union all select x.v, 100000 + x.k from (values ('Tier 1 All-Access', 1), ('Tier 2 Production', 2), ('Tier 3 Crew', 3), ('Tier 4 Guest', 4)) as x(v, k)) a order by v, ord) u order by u.ord offset (r.source_row - 2) limit 1)
      - letter: T
        header: Commercial State
        key: commercial_state
        disposition: computed
        target: xpms.std_enumeration.commercial_state
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("UNIQUE({FILTER(I$2:I$110, (G$2:G$110=""Order Type"")+(G$2:G$110=""Payment Status"")+(G$2:G$110=""Workflow Status"")); ""Quoted""; ""Committed""; ""Invoiced""; ""Draft""; ""Issued""; ""Acknowledged""; ""Received""; ""Closed""; ""Submitted""; ""Under Review"&"""})"),"Active")
        sql: (select u.v from (select distinct on (v) v, ord from (select e.enum_label::text as v, e.source_row as ord from xpms.std_enumeration e where e.enum_domain in ('Order Type', 'Payment Status', 'Workflow Status') union all select x.v, 100000 + x.k from (values ('Quoted', 1), ('Committed', 2), ('Invoiced', 3), ('Draft', 4), ('Issued', 5), ('Acknowledged', 6), ('Received', 7), ('Closed', 8), ('Submitted', 9), ('Under Review', 10)) as x(v, k)) a order by v, ord) u order by u.ord offset (r.source_row - 2) limit 1)
      - letter: U
        header: Asset Condition
        key: asset_condition
        disposition: computed
        target: xpms.std_enumeration.asset_condition
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("UNIQUE({FILTER(I$2:I$110, G$2:G$110=""Asset Condition""); ""Poor""; ""Damaged""})"),"New")
        sql: (select u.v from (select distinct on (v) v, ord from (select e.enum_label::text as v, e.source_row as ord from xpms.std_enumeration e where e.enum_domain = 'Asset Condition' union all select x.v, 100000 + x.k from (values ('Poor', 1), ('Damaged', 2)) as x(v, k)) a order by v, ord) u order by u.ord offset (r.source_row - 2) limit 1)
      - letter: V
        header: Deployment State
        key: deployment_state
        disposition: computed
        target: xpms.std_enumeration.deployment_state
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("UNIQUE({FILTER(I$2:I$110, (G$2:G$110=""Workflow Status"")*((M$2:M$110=""Asset Inventory"")+(M$2:M$110=""Shipping Manifest"")+(M$2:M$110=""Universal""))); ""In Warehouse""; ""Under Repair""; ""Decommissioned""})"),"Active")
        sql: (select u.v from (select distinct on (v) v, ord from (select e.enum_label::text as v, e.source_row as ord from xpms.std_enumeration e where e.enum_domain = 'Workflow Status' and e.target_entity in ('Asset Inventory', 'Shipping Manifest', 'Universal') union all select x.v, 100000 + x.k from (values ('In Warehouse', 1), ('Under Repair', 2), ('Decommissioned', 3)) as x(v, k)) a order by v, ord) u order by u.ord offset (r.source_row - 2) limit 1)
      - letter: W
        header: FLAG
        key: flag
        disposition: field
        target: xpms.std_enumeration.flag
        type: bool
      - letter: X
        header: NOTES
