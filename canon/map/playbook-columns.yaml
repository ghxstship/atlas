  - sheet: Purchase Orders
    key: purchase_orders
    destination: production-template
    entity: app.purchase_orders
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: PO NUMBER
        key: po_number
        disposition: field
        target: app.purchase_orders.po_number
        type: text
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: field
        target: app.purchase_orders.project_id
        type: text
      - letter: C
        header: VENDOR ID
        key: vendor_id
        disposition: field
        target: app.purchase_orders.vendor_id
        type: text
      - letter: D
        header: VENDOR NAME
        key: vendor_name
        disposition: computed
        target: app.purchase_orders.vendor_name
        type: text
        formula: =_xlfn.XLOOKUP(C2, 'Vendor Directory'!$A$2:$A100, 'Vendor Directory'!$G$2:$G100, "")
        sql: (select x.company from xpms.v_sheet_vendor_directory x where x.vendor_id = r.vendor_id order by x.source_row limit 1)
      - letter: E
        header: ISSUE DATE
        key: issue_date
        disposition: field
        target: app.purchase_order_state_transitions.created_at
        type: date
        transform: Issue date is when the order moved to Sent, from its transition ledger.
      - letter: F
        header: DELIVERY DATE
        key: delivery_date
        disposition: field
        target: app.purchase_orders.delivery_due_on
        type: date
        transform: Date the order is due to be delivered.
      - letter: G
        header: PAYMENT TERMS
        key: payment_terms
        disposition: field
        target: app.purchase_orders.payment_terms_days
        type: text
        transform: Net N gives N days.
      - letter: H
        header: SUBTOTAL AMOUNT
        key: subtotal_amount
        disposition: computed
        target: app.purchase_orders.subtotal_amount
        type: numeric
        formula: =SUMIF('PO Line Items'!$B:$B, A2, 'PO Line Items'!$H:$H)
        sql: coalesce((select sum(x.total_amount) from xpms.v_sheet_po_line_items x where x.po_number = r.po_number), 0)
      - letter: I
        header: TAX AMOUNT
        key: tax_amount
        disposition: field
        target: app.purchase_orders.tax_minor
        type: numeric
        transform: Tax on the order in minor units of its currency.
        real_world: price
      - letter: J
        header: SHIPPING AMOUNT
        key: shipping_amount
        disposition: field
        target: app.purchase_orders.shipping_minor
        type: numeric
        transform: Shipping on the order in minor units of its currency.
        real_world: price
      - letter: K
        header: TOTAL AMOUNT
        key: total_amount
        disposition: computed
        target: app.purchase_orders.total_amount
        type: numeric
        formula: =H2+I2+J2
        sql: r.subtotal_amount + coalesce(xpms.pb_n(r.tax_amount), 0) + coalesce(xpms.pb_n(r.shipping_amount), 0)
      - letter: L
        header: COMMITTED AMOUNT
        key: committed_amount
        disposition: computed
        target: app.purchase_orders.committed_amount
        type: numeric
        formula: =K2
        sql: r.total_amount
      - letter: M
        header: INVOICED AMOUNT
        key: invoiced_amount
        disposition: field
        target: app.invoice_totals.subtotal_minor
        type: numeric
        transform: Invoiced amount is derived from the invoices matched to the order (invoice_matches).
        real_world: price
      - letter: N
        header: PAID AMOUNT
        key: paid_amount
        disposition: field
        target: app.invoice_totals.applied_minor
        type: numeric
        transform: Paid amount is derived from payments applied to the matched invoices.
        real_world: price
      - letter: O
        header: CURRENCY
        key: currency
        disposition: field
        target: app.purchase_orders.currency_code
        type: text
        transform: ISO 4217 currency of the order.
      - letter: P
        header: STATUS
        key: status
