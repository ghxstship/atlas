      - letter: L
        header: ASSIGNEE NAME
        key: assignee_name
        disposition: field
        target: app.people.full_name
        type: text
        transform: Name of the assigned person; the task does not restate it.
        real_world: person
      - letter: M
        header: START DATE
        key: start_date
        disposition: field
        target: app.records.starts_at
        type: date
        transform: Start of the task.
      - letter: N
        header: END DATE
        key: end_date
        disposition: field
        target: app.records.ends_at
        type: date
        transform: End of the task.
      - letter: O
        header: DURATION (DAYS)
        key: duration_days
        disposition: field
        target: xpms.production_template_values.value_text
