  - sheet: Budget Expenses
    key: budget_expenses
    destination: production-template
    entity: app.budget_lines
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: RECORD ID
        key: record_id
        disposition: field
        target: app.budget_lines.line_number
        type: text
        transform: BUD-nnnn gives the line number within the budget.
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: field
        target: app.budgets.project_id
        type: text
        transform: Project of the line's budget (budget_lines.budget_id).
      - letter: C
        header: EVENT
        key: event
        disposition: field
        target: app.scope_nodes.name
        type: text
        transform: Event scope node of the line's cost center (cost_centers.scope_node_id).
      - letter: D
        header: LOCATION
        key: location
        disposition: field
        target: app.venues.name
        type: text
        transform: Venue of the line's event scope node (scope_nodes.venue_id).
        real_world: venue
      - letter: E
        header: ZONE
        key: zone
        disposition: field
        target: app.scope_nodes.name
        type: text
        transform: Zone scope node under the line's event scope node; Whole Venue is the event node itself.
      - letter: F
        header: SPACE
        key: space
        disposition: field
        target: app.scope_nodes.name
        type: text
        transform: Space scope node under the line's event scope node; the column is empty in the Playbook.
      - letter: G
        header: ACTIVATION
        key: activation
        disposition: field
        target: app.scope_nodes.name
        type: text
        transform: Activation scope node under the line's event scope node.
      - letter: H
        header: DEPARTMENT
        key: department
        disposition: field
        target: app.budget_lines.urid
        type: text
        transform: Department segment of the line's URID.
      - letter: I
        header: DISCIPLINE
        key: discipline
        disposition: field
        target: app.budget_lines.urid
        type: text
        transform: Discipline segment of the line's URID.
      - letter: J
        header: CATEGORY
        key: category
        disposition: field
        target: app.budget_lines.urid
        type: text
        transform: Category of the line's URID; the label is the canon category name.
      - letter: K
        header: SUB CATEGORY
        key: sub_category
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the URID has no fourth segment (Section 3.3), so a sub category below the category has no column; the label stays in the template."
      - letter: L
        header: ITEM
        key: item
        disposition: field
        target: app.budget_lines.element_id
        type: text
        transform: Element the line prices; fee and contingency lines name their line type instead.
      - letter: M
        header: DESCRIPTION
        key: description
        disposition: field
        target: app.budget_lines.description
        type: text
      - letter: N
        header: URID
        key: urid
        disposition: field
        target: app.budget_lines.urid
        type: text
      - letter: O
        header: PHASE
        key: phase
        disposition: field
        target: app.budget_lines.phase_code
        type: text
        transform: Gated phase the line is spent in, matched by phase name (Section 3.4).
      - letter: P
        header: TIER
        key: tier
        disposition: field
        target: app.budget_lines.tier_code
        type: text
        transform: Tier of experience the line serves (Section 3.5).
      - letter: Q
        header: XYZ
        key: xyz
        disposition: field
        target: app.budget_lines.xyz
        type: text
      - letter: R
        header: LINE TYPE
        key: line_type
        disposition: field
        target: app.budget_lines.line_type
        type: text
      - letter: S
        header: QUANTITY
        key: quantity
        disposition: field
        target: app.budget_lines.quantity
        type: numeric
        real_world: price
      - letter: T
        header: RATE
        key: rate
        disposition: computed
        target: app.budget_lines.rate
        type: numeric
        formula: =SUMIFS('PO Line Items'!$H:$H, 'PO Line Items'!$C:$C, $A2) + SUMIFS('Change Orders'!$M:$M, 'Change Orders'!$E:$E, $A2, 'Change Orders'!$W:$W, "Approved")
        sql: coalesce((select sum(x.total_amount) from xpms.v_sheet_po_line_items x where x.expense_ref_id = r.record_id), 0) + coalesce((select sum(x.total_amount) from xpms.v_sheet_change_orders x where x.expense_ref_id = r.record_id and x.status = 'Approved'), 0)
      - letter: U
        header: UNIT BASIS
        key: unit_basis
        disposition: field
        target: app.budget_lines.unit_basis
        type: text
      - letter: V
        header: ESTIMATE
        key: estimate
        disposition: computed
        target: app.budget_lines.estimate
        type: numeric
        formula: =IF(OR(S2="",T2=""),"",ROUND(S2*T2,2))
        sql: case when r.quantity is null then null else round(xpms.pb_n(r.quantity) * r.rate, 2) end
      - letter: W
        header: BUDGET
        key: budget
        disposition: computed
        target: app.budget_lines.budget
        type: numeric
        formula: =IF(V2="","",V2)
        sql: r.estimate
      - letter: X
        header: COMMITTED
        key: committed
        disposition: computed
        target: app.budget_lines.committed
        type: numeric
        formula: =SUMIFS('PO Line Items'!$H:$H, 'PO Line Items'!$C:$C, $A2) + SUMIFS('Change Orders'!$M:$M, 'Change Orders'!$E:$E, $A2, 'Change Orders'!$W:$W, "Approved")
        sql: coalesce((select sum(x.total_amount) from xpms.v_sheet_po_line_items x where x.expense_ref_id = r.record_id), 0) + coalesce((select sum(x.total_amount) from xpms.v_sheet_change_orders x where x.expense_ref_id = r.record_id and x.status = 'Approved'), 0)
      - letter: Y
        header: FORECAST
        key: forecast
        disposition: computed
        target: app.budget_lines.forecast
        type: numeric
        formula: =IF(AND(W2="",X2=""),"",MAX(N(W2),N(X2)))
        sql: case when r.budget is null and r.committed is null then null else greatest(coalesce(r.budget, 0), coalesce(r.committed, 0)) end
      - letter: Z
        header: ACTUAL
        key: actual
        disposition: field
        target: app.budget_line_amounts.actual_minor
        type: text
        transform: Actual spend is derived from postings (Section 3.15); the column is empty in the Playbook.
        real_world: price
      - letter: AA
        header: VARIANCE
        key: variance
        disposition: computed
        target: app.budget_lines.variance
        type: numeric
        formula: =W2-Z2
        sql: coalesce(r.budget, 0) - coalesce(xpms.pb_n(r.actual), 0)
      - letter: AB
        header: VENDOR
        key: vendor
        disposition: field
        target: app.purchase_orders.vendor_id
        type: text
        transform: "Vendor of the purchase order whose line draws on this budget line (po_lines.budget_line_id). Owner decision 25: Landlord is not a canon counterparty type, so the Landlord resolves to a counterparty of the existing type Facilities Services (xpms.label_mapping); a cell holding the Landlord's proposal note resolves the same way."
        real_world: company
      - letter: AC
        header: STATUS
        key: status
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: budget lines have no lifecycle column, and owner decision 25 adds none. Open maps to the canon state Active and Estimated to Quoted (xpms.label_mapping); a line's commitment is derived from the purchase order lines that draw on it."
      - letter: AD
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: AE
        header: EXTERNAL NOTES
        key: external_notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.budget_lines').
      - letter: AF
        header: INTERNAL NOTES
        key: internal_notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.budget_lines').
      - letter: AG
        header: ACCOUNT CODE
        key: account_code
        disposition: field
        target: app.budget_line_facts.account_code
        type: text
        transform: GL account is derived from the line's category (Bible tab 31); the column restates it.
      - letter: AH
        header: ACCOUNT NAME
        key: account_name
        disposition: computed
        target: app.budget_lines.account_name
        type: text
        formula: =_xlfn.XLOOKUP(AG2, 'GL Accounts'!$A$2:$A271, 'GL Accounts'!$B$2:$B271, "")
        sql: (select g.account_name from xpms.dim_gl_account g where g.account_code = r.account_code)
      - letter: AI
        header: COST CENTER
        key: cost_center
        disposition: field
        target: app.budget_lines.cost_center_id
        type: text
        transform: Cost center matched by code (dimension 1).
      - letter: AJ
        header: URID DIMENSION
        key: urid_dimension
        disposition: field
        target: app.budget_lines.urid
        type: text
        transform: URID dimension (dimension 2) of the line.
      - letter: AK
        header: TAX TYPE
        key: tax_type
        disposition: field
        target: xpms.dim_gl_account.tax_type
        type: text
        transform: Tax type of the line's GL account.
      - letter: AL
        header: CURRENCY
        key: currency
        disposition: field
        target: app.budgets.currency_code
        type: text
        transform: Currency of the line's budget.
      - letter: AM
        header: CREATED BY
        key: created_by
        disposition: field
        target: app.budget_lines.created_by
        type: text
      - letter: AN
        header: CREATED AT
        key: created_at
        disposition: field
        target: app.budget_lines.created_at
        type: text
      - letter: AO
        header: UPDATED AT
        key: updated_at
        disposition: field
        target: app.budget_lines.updated_at
        type: text
