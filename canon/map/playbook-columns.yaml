  - sheet: Credential Issuance
    key: credential_issuance
    destination: production-template
    entity: app.credentials
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: RECORD ID
        key: record_id
        disposition: field
        target: app.credentials.id
        type: text
        transform: Playbook row token. Applying the template mints the row's id; the token only resolves references between template sheets and is never stored (identifier grammar, Section 3.6).
      - letter: B
        header: ORGANIZATION
        key: organization
        disposition: computed
        target: app.credentials.organization
        type: text
        formula: ='Cover Page'!$I$8
        sql: xpms.pb_cover(8, 9)
      - letter: C
        header: PROJECT ID
        key: project_id
        disposition: computed
        target: app.credentials.project_id
        type: text
        formula: ='Cover Page'!$C$7
        sql: xpms.pb_cover(7, 3)
      - letter: D
        header: DEPARTMENT
        key: department
        disposition: field
        target: xpms.role.class_code
        type: text
        transform: Department class of the holder's role (credentials.engagement_id to engagements.role_code).
      - letter: E
        header: CATEGORY
        key: category
        disposition: field
        target: xpms.role.discipline
        type: numeric
        transform: Discipline of the holder's role; the Playbook cells hold a numeric artifact (1000.5) of the class code.
      - letter: F
        header: SUB CATEGORY
        key: sub_category
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the URID has no fourth segment (Section 3.3), so a sub category below the category has no column; the label stays in the template."
      - letter: G
        header: CREDENTIAL SERIAL
        key: credential_serial
        disposition: field
        target: app.credentials.credential_number
        type: text
        transform: Credential serial printed on the badge.
        real_world: identifier
      - letter: H
        header: PERSONNEL ID
        key: personnel_id
        disposition: field
        target: app.credentials.holder_person_id
        type: text
        transform: Holder resolved from the personnel id.
      - letter: I
        header: VENDOR ID
        key: vendor_id
        disposition: field
        target: app.engagements.counterparty_id
        type: text
        transform: Vendor of the holder's engagement (credentials.engagement_id).
      - letter: J
        header: CLEARANCE TIER
        key: clearance_tier
        disposition: field
        target: xpms.role.default_clearance_tier
        type: text
        transform: Clearance tier is derived from the holder's role (Roles Library).
      - letter: K
        header: CREDENTIAL TYPE
        key: credential_type
        disposition: field
        target: app.credentials.credential_category_id
        type: text
        transform: Credential category matched by name within the project.
      - letter: L
        header: ZONE ACCESS
        key: zone_access
        disposition: field
        target: app.access_grid.zone_id
        type: text
        transform: Zones the credential's category opens, from the Access Grid; the credential does not restate them.
      - letter: M
        header: ISSUED DATE
        key: issued_date
        disposition: field
        target: app.credentials.valid_from
        type: date
        transform: Issue date is the start of validity.
      - letter: N
        header: RETURN STATUS
        key: return_status
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: badge return is not tracked; revocation (revoked_at) ends a credential."
      - letter: O
        header: STATUS
        key: status
        disposition: field
        target: app.credentials.revoked_at
        type: text
        transform: Active while revoked_at is null and valid_to has not passed.
      - letter: P
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: Q
        header: NOTES
        key: notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.credentials').
      - letter: R
