        header: TOTAL TASKS
        key: total_tasks
        disposition: computed
        target: app.records.total_tasks
        type: numeric
        formula: =COUNTIF('Production Tasks'!$C$2:$C$25, A2)
        sql: case when r.activity_type = 'Milestone Gate' then coalesce((select sum((select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = c.activity_id)) from s0 c where c.parent_activity_id = r.activity_id and c.activity_type = 'Summary Activity'), 0) else (select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = r.activity_id) end
      - letter: T
        header: COMPLETED TASKS
        key: completed_tasks
        disposition: computed
        target: app.records.completed_tasks
        type: numeric
        formula: =COUNTIFS('Production Tasks'!$C$2:$C$25, A2, 'Production Tasks'!$V$2:$V$25, "Complete")
        sql: case when r.activity_type = 'Milestone Gate' then coalesce((select sum((select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = c.activity_id and t.status = 'Complete')) from s0 c where c.parent_activity_id = r.activity_id and c.activity_type = 'Summary Activity'), 0) else (select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = r.activity_id and t.status = 'Complete') end
      - letter: U
        header: PROGRESS (%)
        key: progress_pct
        disposition: computed
        target: app.records.progress_pct
        type: numeric
        formula: =IF(S2>0, T2/S2, IF(V2="Complete", 1, 0))
        sql: case when r.total_tasks > 0 then r.completed_tasks::numeric / r.total_tasks when r.status = 'Complete' then 1 else 0 end
      - letter: V
        header: STATUS
        key: status
        disposition: field
        target: app.records.status
        type: text
