      - letter: M
        header: DESCRIPTION
        key: description
        disposition: field
        target: xpms.elements.description
        type: text
        transform: Cross-checked against the Bible value; a difference waits in xpms.intake.
      - letter: N
        header: SPECIFICATIONS
        key: specifications
