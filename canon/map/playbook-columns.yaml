      - letter: J
        header: GRADE 1 BASIC ($ LOW)
        key: grade_1_basic_low
        disposition: field
        target: xpms.element_price_bands.amount_minor
        type: numeric
        transform: Cross-checked against the Bible value; a difference waits in xpms.intake.
      - letter: K
        header: GRADE 2 STANDARD ($ COST)
        key: grade_2_standard_cost
