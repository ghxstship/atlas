      - letter: K
        header: PIECE COUNT
        key: piece_count
        disposition: field
        target: app.shipments.piece_count
        type: numeric
        transform: Number of pieces.
      - letter: L
        header: LENGTH (FT)
        key: length_ft
        disposition: field
        target: app.shipments.length_ft
        type: numeric
        transform: Length in feet.
      - letter: M
        header: WIDTH (FT)
        key: width_ft
        disposition: field
        target: app.shipments.width_ft
        type: numeric
        transform: Width in feet.
      - letter: N
        header: HEIGHT (FT)
        key: height_ft
        disposition: field
        target: app.shipments.height_ft
        type: numeric
        transform: Height in feet.
      - letter: O
        header: VOLUME (CU FT)
        key: volume_cu_ft
        disposition: computed
        target: app.shipments.volume_cu_ft
        type: numeric
        formula: =ROUND(L2*M2*N2, 2)
        sql: round(xpms.pb_n(r.length_ft) * xpms.pb_n(r.width_ft) * xpms.pb_n(r.height_ft), 2)
      - letter: P
        header: DIMENSIONS
        key: dimensions
        disposition: computed
        target: app.shipments.dimensions
        type: text
        formula: =L2 & " ft x " & M2 & " ft x " & N2 & " ft"
        sql: coalesce(r.length_ft, '') || ' ft x ' || coalesce(r.width_ft, '') || ' ft x ' || coalesce(r.height_ft, '') || ' ft'
      - letter: Q
        header: WEIGHT
        key: weight
        disposition: field
        target: app.shipments.weight_lb
        type: text
        transform: Weight in pounds (45,000 lbs gives 45000).
      - letter: R
        header: SHIPMENT DATE
        key: shipment_date
        disposition: field
        target: app.shipments.ships_at
        type: date
        transform: Shipment date is the date of ships_at.
