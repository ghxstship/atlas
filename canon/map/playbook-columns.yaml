      - letter: E
        header: TASK NAME
        key: task_name
        disposition: field
        target: app.records.title
        type: text
        transform: Task name is the record title.
      - letter: F
        header: DESCRIPTION
        key: description
        disposition: field
        target: app.records.description
        type: text
        transform: What the task involves.
      - letter: G
        header: RECORD KIND
        key: record_kind
        disposition: field
        target: app.records.record_kind
        type: text
      - letter: H
        header: RECORD SUBTYPE
        key: record_subtype
        disposition: field
        target: app.records.record_subtype
        type: text
      - letter: I
        header: TEAM CODE
        key: team_code
        disposition: field
        target: app.records.team_code
        type: text
        transform: Canon team (Bible teams) that does the task.
      - letter: J
        header: LOCATION ID
        key: location_id
        disposition: field
        target: app.records.scope_node_id
        type: text
