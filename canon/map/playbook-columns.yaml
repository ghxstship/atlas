  - sheet: Projects
    key: projects
    destination: production-template
    entity: app.projects
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: PROJECT ID
        key: project_id
        disposition: field
        target: app.projects.project_key
        type: text
        transform: Project key, the code XOS issues for the project.
      - letter: B
        header: PROJECT NAME
        key: project_name
        disposition: field
        target: app.projects.name
        type: text
        transform: Project name.
        real_world: company
      - letter: C
        header: CLIENT NAME
        key: client_name
        disposition: field
        target: app.organizations.name
        type: text
        transform: Name of the client, through the project's client counterparty (projects.client_counterparty_id to counterparties.organization_id).
        real_world: company
      - letter: D
        header: ORGANIZATION
        key: organization
        disposition: field
        target: app.projects.org_id
        type: text
        transform: The template is applied inside one org; the organization label resolves to org_id (app.organizations.name).
        real_world: company
      - letter: E
        header: VENUE
        key: venue
        disposition: field
        target: app.venues.name
        type: text
        transform: Venue of the project (projects.venue_id).
        real_world: venue
      - letter: F
        header: LOCATION
        key: location
        disposition: field
        target: app.venues.locality
        type: text
        transform: Locality of the project's venue.
        real_world: venue
      - letter: G
        header: START DATE
        key: start_date
        disposition: field
        target: app.projects.starts_on
        type: text
        transform: First day of the project.
      - letter: H
        header: END DATE
        key: end_date
        disposition: field
        target: app.projects.ends_on
        type: text
        transform: Last day of the project.
      - letter: I
        header: ANCHOR DATE
        key: anchor_date
        disposition: field
        target: app.projects.anchor_on
        type: text
        transform: Anchor date the template's day offsets count from.
      - letter: J
        header: TIER
        key: tier
        disposition: field
        target: app.projects.tier_code
        type: text
        transform: Tier of experience (Section 3.5); Tier 06 Theatrical gives code 06.
      - letter: K
        header: BUDGET ENVELOPE
        key: budget_envelope
        disposition: field
        target: app.projects.budget_envelope_minor
        type: numeric
        transform: Budget envelope in minor units of the project currency.
        real_world: price
      - letter: L
        header: COMMITTED AMOUNT
        key: committed_amount
        disposition: computed
        target: app.projects.committed_amount
        type: numeric
        formula: =SUMIFS('Budget Expenses'!$X:$X, 'Budget Expenses'!$B:$B, A2)
        sql: coalesce((select sum(x.committed) from xpms.v_sheet_budget_expenses x where x.project_id = r.project_id), 0)
      - letter: M
        header: ACTUAL SPEND
        key: actual_spend
        disposition: computed
        target: app.projects.actual_spend
        type: numeric
        formula: =SUMIFS('Budget Expenses'!$Z:$Z, 'Budget Expenses'!$B:$B, A2)
        sql: coalesce((select sum(xpms.pb_n(x.actual)) from xpms.v_sheet_budget_expenses x where x.project_id = r.project_id), 0)
      - letter: N
        header: APPROVED CHANGE ORDERS
        key: approved_change_orders
        disposition: computed
        target: app.projects.approved_change_orders
        type: numeric
        formula: =SUMIFS('Change Orders'!$M:$M, 'Change Orders'!$B:$B, A2, 'Change Orders'!$W:$W, "Approved")
        sql: coalesce((select sum(x.total_amount) from xpms.v_sheet_change_orders x where x.project_id = r.project_id and x.status = 'Approved'), 0)
      - letter: O
        header: PRODUCTION TASKS
        key: production_tasks
        disposition: computed
        target: app.projects.production_tasks
        type: numeric
        formula: =COUNTIFS('Production Tasks'!$B:$B, A2, 'Production Tasks'!$V:$V, "Active")
        sql: (select count(*) from xpms.v_sheet_production_tasks x where x.project_id = r.project_id and x.status = 'Active')
      - letter: P
        header: OPERATIONAL STATE
        key: operational_state
        disposition: field
        target: app.projects.production_state
        type: text
        transform: "Production lifecycle state (owner decision 25): Active and Complete are production states; Scheduled maps to the closest existing state, Active (xpms.label_mapping). No state is added."
      - letter: Q
        header: GOVERNING GATE
        key: governing_gate
        disposition: field
        target: app.projects.current_phase_code
        type: text
        transform: Governing gate resolved to its phase (Gate 05 Build gives BLD).
      - letter: R
        header: EXECUTIVE PRODUCER
        key: executive_producer
        disposition: field
        target: app.project_members.membership_id
        type: text
        transform: Executive producer as the project member with project_role Producer.
        real_world: person
      - letter: S
        header: NOTES
        key: notes
        disposition: field
        target: app.projects.description
        type: text
        transform: Project description.
  - sheet: Activity Log
    key: activity_log
    destination: production-template
    entity: app.activity_events
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: RECORD ID
        key: record_id
        disposition: field
        target: app.activity_events.id
        type: text
        transform: Playbook row token. Applying the template mints the row's id; the token only resolves references between template sheets and is never stored (identifier grammar, Section 3.6).
      - letter: B
        header: ORGANIZATION
        key: organization
        disposition: field
        target: app.activity_events.org_id
        type: text
        transform: The template is applied inside one org; the organization label resolves to org_id (app.organizations.name).
      - letter: C
        header: PROJECT
        key: project
        disposition: field
        target: app.domain_events.project_id
        type: text
        transform: Project of the domain event the activity row projects (activity_events.domain_event_id).
      - letter: D
        header: DEPARTMENT
        key: department
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: app.activity_events carries no URID; an activity row inherits its classification from the subject of its domain event."
      - letter: E
        header: CATEGORY
        key: category
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: app.activity_events carries no URID; an activity row inherits its classification from the subject of its domain event."
      - letter: F
        header: SUB CATEGORY
        key: sub_category
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the URID has no fourth segment (Section 3.3), so a sub category below the category has no column; the label stays in the template."
      - letter: G
        header: TIMESTAMP
        key: timestamp
        disposition: field
        target: app.domain_events.occurred_at
        type: text
        transform: When the domain event occurred.
      - letter: H
        header: LOCATION / ZONE
        key: location_zone
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: location is a property of the event's subject, not of the activity row."
      - letter: I
        header: SUBJECT / ITEM
        key: subject_item
        disposition: field
        target: app.domain_events.subject_id
        type: text
        transform: Subject row of the domain event (with subject_table).
      - letter: J
        header: DESCRIPTION
        key: description
        disposition: field
        target: app.domain_events.event_type
        type: text
        transform: Description resolves to the domain event type; its display label comes from the i18n catalog.
      - letter: K
        header: PARTY INVOLVED
        key: party_involved
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: parties are those of the event's subject; the activity row names only its actor."
      - letter: L
        header: QTY / VALUE
        key: qty_value
        disposition: field
        target: app.domain_events.data
        type: text
        transform: Quantity or value carried in the domain event payload.
      - letter: M
        header: PRIORITY
        key: priority
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: activity rows are immutable facts and carry no priority."
      - letter: N
        header: LOGGED BY
        key: logged_by
        disposition: field
        target: app.activity_events.actor_person_id
        type: text
        transform: Person who performed the action.
      - letter: O
        header: REFERENCE ID
        key: reference_id
        disposition: field
        target: app.activity_events.domain_event_id
        type: text
        transform: Domain event the activity row projects.
      - letter: P
        header: STATUS
        key: status
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: activity rows are immutable facts and have no lifecycle state."
      - letter: Q
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: R
        header: NOTES
        key: notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.activity_events').
      - letter: S
        header: CREATED BY
        key: created_by
        disposition: field
        target: app.activity_events.created_by
        type: text
      - letter: T
        header: CREATED AT
        key: created_at
        disposition: field
        target: app.activity_events.created_at
        type: text
      - letter: U
        header: UPDATED AT
        key: updated_at
        disposition: field
        target: app.activity_events.updated_at
        type: text
  - sheet: Production Schedule
    key: production_schedule
    destination: production-template
    entity: app.records
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: ACTIVITY ID
        key: activity_id
        disposition: field
        target: app.records.id
        type: text
        transform: Playbook row token. Applying the template mints the row's id; the token only resolves references between template sheets and is never stored (identifier grammar, Section 3.6).
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: field
        target: app.records.project_id
        type: text
      - letter: C
        header: PARENT ACTIVITY ID
        key: parent_activity_id
        disposition: field
        target: app.records.parent_record_id
        type: text
        transform: Summary activity or gate milestone the activity rolls up to.
      - letter: D
        header: WBS CODE
        key: wbs_code
        disposition: field
        target: app.records.wbs_code
        type: numeric
        transform: Work breakdown structure code of the activity.
      - letter: E
        header: PHASE CODE
        key: phase_code
        disposition: field
        target: app.records.phase_code
        type: text
      - letter: F
        header: PHASE
        key: phase
        disposition: field
        target: app.records.phase_code
        type: text
        transform: Gated phase matched by name (Section 3.4).
      - letter: G
        header: ACT
        key: act
        disposition: field
        target: xpms.dim_phase.act_code
        type: text
        transform: Act is derived from the phase (acts are presentation groupings, Section 3.4).
      - letter: H
        header: GATE
        key: gate
        disposition: field
        target: xpms.dim_phase.gate
        type: numeric
        transform: Gate number is derived from the phase.
      - letter: I
        header: ACTIVITY NAME
        key: activity_name
        disposition: field
        target: app.records.title
        type: text
        transform: Activity name is the record title.
      - letter: J
        header: ACTIVITY TYPE
        key: activity_type
        disposition: field
        target: app.records.record_kind
        type: text
        transform: "Record kind (owner decision 25): Summary Activity maps to Timeline and Milestone Gate to Milestone, the closest of the 26 record kinds (xpms.label_mapping)."
      - letter: K
        header: DELIVERABLE
        key: deliverable
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the deliverable is named in free text; XOS models deliverables as Document records (Section 3.10), which the template does not mint by name."
      - letter: L
        header: SOP ID
        key: sop_id
        disposition: field
        target: app.records.sop_id
        type: text
        transform: Standard operating procedure that governs the activity, matched by SOP code.
      - letter: M
        header: OWNER ROLE
        key: owner_role
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the owner role column holds people's initials (TIGRE/JC), not role codes; the owner is the personnel id."
      - letter: N
        header: PERSONNEL ID
        key: personnel_id
        disposition: field
        target: app.records.owner_party_id
        type: text
        transform: Person who owns the activity.
      - letter: O
        header: START DATE
        key: start_date
        disposition: field
        target: app.records.starts_at
        type: date
        transform: Start of the activity.
      - letter: P
        header: END DATE
        key: end_date
        disposition: field
        target: app.records.ends_at
        type: date
        transform: End of the activity.
      - letter: Q
        header: DURATION (DAYS)
        key: duration_days
        disposition: field
        target: xpms.production_template_values.value_text
        type: numeric
        transform: "Template only: duration is derived from starts_at and ends_at (Section 3.15)."
      - letter: R
        header: CRITICAL PATH
        key: critical_path
        disposition: field
        target: xpms.production_template_values.value_text
        type: text
        transform: "Template only: the critical path is computed from record dependencies at read time (Section 11, Schedule)."
      - letter: S
        header: TOTAL TASKS
        key: total_tasks
        disposition: computed
        target: app.records.total_tasks
        type: numeric
        formula: =COUNTIF('Production Tasks'!$C$2:$C$25, A2)
        sql: case when r.activity_type = 'Milestone Gate' then coalesce((select sum((select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = c.activity_id)) from s0 c where c.parent_activity_id = r.activity_id and c.activity_type = 'Summary Activity'), 0) else (select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = r.activity_id) end
      - letter: T
        header: COMPLETED TASKS
        key: completed_tasks
        disposition: computed
        target: app.records.completed_tasks
        type: numeric
        formula: =COUNTIFS('Production Tasks'!$C$2:$C$25, A2, 'Production Tasks'!$V$2:$V$25, "Complete")
        sql: case when r.activity_type = 'Milestone Gate' then coalesce((select sum((select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = c.activity_id and t.status = 'Complete')) from s0 c where c.parent_activity_id = r.activity_id and c.activity_type = 'Summary Activity'), 0) else (select count(*) from xpms.v_sheet_production_tasks t where t.activity_id = r.activity_id and t.status = 'Complete') end
      - letter: U
        header: PROGRESS (%)
        key: progress_pct
        disposition: computed
        target: app.records.progress_pct
        type: numeric
        formula: =IF(S2>0, T2/S2, IF(V2="Complete", 1, 0))
        sql: case when r.total_tasks > 0 then r.completed_tasks::numeric / r.total_tasks when r.status = 'Complete' then 1 else 0 end
      - letter: V
        header: STATUS
        key: status
        disposition: field
        target: app.records.record_state
        type: text
        transform: Record state (Section 3.10).
      - letter: W
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: X
        header: NOTES
        key: notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.records').
  - sheet: Production Tasks
    key: production_tasks
    destination: production-template
    entity: app.records
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: TASK ID
        key: task_id
        disposition: field
        target: app.records.id
        type: text
        transform: Playbook row token. Applying the template mints the row's id; the token only resolves references between template sheets and is never stored (identifier grammar, Section 3.6).
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: field
        target: app.records.project_id
        type: text
      - letter: C
        header: ACTIVITY ID
        key: activity_id
        disposition: field
        target: app.records.parent_record_id
        type: text
