  - sheet: Staffing Requisition
    key: staffing_requisition
    destination: production-template
    entity: app.requisitions
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: REQ ID
        key: req_id
        disposition: field
        target: app.requisitions.id
        type: text
        transform: Playbook row token. Applying the template mints the row's id; the token only resolves references between template sheets and is never stored (identifier grammar, Section 3.6).
      - letter: B
        header: EVENT PHASE
        key: event_phase
        disposition: field
        target: app.budget_lines.phase_code
        type: text
        transform: "Phase of the budget line the requisition draws on (requisitions.budget_line_id). Owner decision 25: each event phase maps to the closest of the nine canon phases (xpms.label_mapping)."
      - letter: C
        header: ROLE CODE
        key: role_code
        disposition: field
        target: app.requisitions.role_code
        type: text
      - letter: D
        header: RATE CARD ID
        key: rate_card_id
        disposition: computed
        target: app.requisitions.rate_card_id
        type: text
        formula: =_xlfn.XLOOKUP(C2, 'Labor Rate Cards'!$B$2:$B$36, 'Labor Rate Cards'!$A$2:$A$36)
        sql: (select x.rate_card_id from xpms.rate_card x where x.role_code = r.role_code order by x.source_row limit 1)
      - letter: E
        header: JOB TITLE
        key: job_title
        disposition: computed
        target: app.requisitions.job_title
        type: text
        formula: =_xlfn.XLOOKUP(C2, 'Roles Library'!$A$2:$A$36, 'Roles Library'!$B$2:$B$36)
        sql: (select x.job_title from xpms.role x where x.role_code = r.role_code)
      - letter: F
        header: HEADCOUNT
        key: headcount
        disposition: field
        target: app.requisitions.headcount
        type: numeric
      - letter: G
        header: DURATION (DAYS)
        key: duration_days
        disposition: field
        target: xpms.production_template_values.value_text
        type: numeric
        transform: "Template only: duration is derived from starts_on and ends_on (Section 3.15)."
      - letter: H
        header: STANDARD RATE
        key: standard_rate
        disposition: computed
        target: app.requisitions.standard_rate
        type: numeric
        formula: =_xlfn.XLOOKUP(D2, 'Labor Rate Cards'!$A$2:$A$36, 'Labor Rate Cards'!$F$2:$F$36)
        sql: (select x.standard_rate_minor / 100.0 from xpms.rate_card x where x.rate_card_id = r.rate_card_id)
      - letter: I
        header: TOTAL ESTIMATED COST
        key: total_estimated_cost
        disposition: computed
        target: app.requisitions.total_estimated_cost
        type: numeric
        formula: =F2*G2*H2
        sql: xpms.pb_n(r.headcount) * xpms.pb_n(r.duration_days) * r.standard_rate
      - letter: J
        header: STATUS
        key: status
        disposition: field
        target: app.requisitions.requisition_state
        type: text
        transform: Approved is a requisition state.
      - letter: K
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: L
        header: NOTES
        key: notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.requisitions').
      - letter: M
        header: CREATED BY
        key: created_by
        disposition: field
        target: app.requisitions.created_by
        type: text
      - letter: N
        header: CREATED AT
        key: created_at
        disposition: field
        target: app.requisitions.created_at
        type: date
      - letter: O
        header: UPDATED AT
        key: updated_at
        disposition: field
        target: app.requisitions.updated_at
        type: date
  - sheet: Crew Shifts
    key: crew_shifts
    destination: production-template
    entity: app.shifts
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: SHIFT ID
        key: shift_id
        disposition: field
        target: app.shifts.id
        type: text
        transform: Playbook row token. Applying the template mints the row's id; the token only resolves references between template sheets and is never stored (identifier grammar, Section 3.6).
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: field
        target: app.shifts.project_id
        type: text
      - letter: C
        header: SHIFT DATE
        key: shift_date
        disposition: field
        target: app.shifts.starts_at
        type: date
        transform: Shift date is the date of starts_at in the shift's time zone.
      - letter: D
        header: DEPARTMENT
        key: department
        disposition: field
        target: xpms.role.class_code
        type: text
        transform: Department class of the shift's role (shifts.role_code).
      - letter: E
        header: LOCATION NAME
        key: location_name
        disposition: field
        target: app.scope_nodes.name
        type: text
        transform: Scope node the shift works in (shifts.scope_node_id).
        real_world: venue
      - letter: F
        header: PERSONNEL ID
        key: personnel_id
        disposition: field
        target: app.shifts.membership_id
        type: text
        transform: Person working the shift.
      - letter: G
        header: CREW NAME
        key: crew_name
        disposition: computed
        target: app.shifts.crew_name
        type: text
        formula: =TRIM(_xlfn.XLOOKUP(F2, 'Personnel Roster'!$A$2:$A100, 'Personnel Roster'!$D$2:$D100, "") & " " & _xlfn.XLOOKUP(F2, 'Personnel Roster'!$A$2:$A100, 'Personnel Roster'!$E$2:$E100, ""))
        sql: nullif(btrim(coalesce((select p.first_name from xpms.v_sheet_personnel_roster p where p.personnel_id = r.personnel_id order by p.source_row limit 1), '') || ' ' || coalesce((select p.last_name from xpms.v_sheet_personnel_roster p where p.personnel_id = r.personnel_id order by p.source_row limit 1), '')), '')
      - letter: H
        header: ROLE CODE
        key: role_code
        disposition: field
        target: app.shifts.role_code
        type: text
      - letter: I
        header: RATE CARD ID
        key: rate_card_id
        disposition: field
        target: xpms.rate_card.rate_card_id
        type: text
        transform: Rate card resolved from the shift's role (Labor Rate Cards); the shift does not restate it.
      - letter: J
        header: JOB TITLE
        key: job_title
        disposition: computed
        target: app.shifts.job_title
        type: text
        formula: =IFERROR(_xlfn.XLOOKUP(I2, 'Labor Rate Cards'!$A$2:$A$36, 'Labor Rate Cards'!$C$2:$C$36), "")
        sql: (select ro.job_title from xpms.rate_card rc join xpms.role ro on ro.role_code = rc.role_code where rc.rate_card_id = r.rate_card_id)
      - letter: K
        header: SCHEDULED CALL TIME
        key: scheduled_call_time
        disposition: field
        target: app.shifts.starts_at
        type: time
        transform: Scheduled call time is the time of starts_at.
      - letter: L
        header: SCHEDULED WRAP TIME
        key: scheduled_wrap_time
        disposition: field
        target: app.shifts.ends_at
        type: time
        transform: Scheduled wrap time is the time of ends_at.
      - letter: M
        header: SCHEDULED MEAL BREAK (HRS)
        key: scheduled_meal_break_hrs
        disposition: field
        target: app.shifts.scheduled_break_minutes
        type: numeric
        transform: Scheduled meal break, hours converted to minutes.
      - letter: N
        header: NET SCHEDULED HOURS
        key: net_scheduled_hours
        disposition: computed
        target: app.shifts.net_scheduled_hours
        type: numeric
        formula: =ROUND((L2-K2)*24 - M2, 2)
        sql: round(xpms.pb_hours(r.scheduled_call_time, r.scheduled_wrap_time) - xpms.pb_n(r.scheduled_meal_break_hrs), 2)
      - letter: O
        header: PAY BASIS
        key: pay_basis
        disposition: computed
        target: app.shifts.pay_basis
        type: text
        formula: =IFERROR(_xlfn.XLOOKUP(I2, 'Labor Rate Cards'!$A$2:$A$36, 'Labor Rate Cards'!$E$2:$E$36), "Day Rate")
        sql: coalesce((select x.pay_basis from xpms.rate_card x where x.rate_card_id = r.rate_card_id), 'Day Rate')
      - letter: P
        header: STANDARD RATE
        key: standard_rate
        disposition: computed
        target: app.shifts.standard_rate
        type: numeric
        formula: =IFERROR(_xlfn.XLOOKUP(I2, 'Labor Rate Cards'!$A$2:$A$36, 'Labor Rate Cards'!$F$2:$F$36), 0)
        sql: coalesce((select x.standard_rate_minor / 100.0 from xpms.rate_card x where x.rate_card_id = r.rate_card_id), 0)
      - letter: Q
        header: HOURLY BASE RATE
        key: hourly_base_rate
        disposition: computed
        target: app.shifts.hourly_base_rate
        type: numeric
        formula: =ROUND(P2/10, 2)
        sql: round(r.standard_rate / 10, 2)
      - letter: R
        header: SCHEDULED PAY
        key: scheduled_pay
        disposition: computed
        target: app.shifts.scheduled_pay
        type: numeric
        formula: =IF(O2="Day Rate", P2, ROUND(Q2*N2, 2))
        sql: case when r.pay_basis = 'Day Rate' then r.standard_rate else round(r.hourly_base_rate * r.net_scheduled_hours, 2) end
      - letter: S
        header: STATUS
        key: status
        disposition: field
        target: app.shifts.shift_state
        type: text
        transform: "Shift state (owner decision 25): Confirmed maps to the closest existing state, Accepted (xpms.label_mapping). No state is added."
      - letter: T
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: U
        header: NOTES
        key: notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.shifts').
      - letter: V
        header: CREATED BY
        key: created_by
        disposition: field
        target: app.shifts.created_by
        type: text
      - letter: W
        header: CREATED AT
        key: created_at
        disposition: field
        target: app.shifts.created_at
        type: date
      - letter: X
        header: UPDATED AT
        key: updated_at
        disposition: field
        target: app.shifts.updated_at
        type: date
  - sheet: Crew Timesheets
    key: crew_timesheets
    destination: production-template
    entity: app.timesheets
    depends_on: A03 Domain Data (Wave 2)
    columns:
      - letter: A
        header: TIMESHEET ID
        key: timesheet_id
        disposition: field
        target: app.timesheets.id
        type: text
        transform: Playbook row token. Applying the template mints the row's id; the token only resolves references between template sheets and is never stored (identifier grammar, Section 3.6).
      - letter: B
        header: PROJECT ID
        key: project_id
        disposition: field
        target: app.timesheets.project_id
        type: text
      - letter: C
        header: SHIFT ID
        key: shift_id
        disposition: field
        target: app.time_entries.shift_id
        type: text
        transform: Shift the time entry of the timesheet was worked against.
      - letter: D
        header: WORK DATE
        key: work_date
        disposition: computed
        target: app.timesheets.work_date
        type: date
        formula: ='Crew Shifts'!C2
        sql: (select x.shift_date::date from xpms.v_sheet_crew_shifts x where x.source_row = r.source_row)
      - letter: E
        header: PERSONNEL ID
        key: personnel_id
        disposition: computed
        target: app.timesheets.personnel_id
        type: text
        formula: ='Crew Shifts'!F2
        sql: (select x.personnel_id from xpms.v_sheet_crew_shifts x where x.source_row = r.source_row)
      - letter: F
        header: CREW NAME
        key: crew_name
        disposition: computed
        target: app.timesheets.crew_name
        type: text
        formula: =TRIM(_xlfn.XLOOKUP(E2, 'Personnel Roster'!$A$2:$A100, 'Personnel Roster'!$D$2:$D100, "") & " " & _xlfn.XLOOKUP(E2, 'Personnel Roster'!$A$2:$A100, 'Personnel Roster'!$E$2:$E100, ""))
        sql: nullif(btrim(coalesce((select p.first_name from xpms.v_sheet_personnel_roster p where p.personnel_id = r.personnel_id order by p.source_row limit 1), '') || ' ' || coalesce((select p.last_name from xpms.v_sheet_personnel_roster p where p.personnel_id = r.personnel_id order by p.source_row limit 1), '')), '')
      - letter: G
        header: ROLE CODE
        key: role_code
        disposition: computed
        target: app.timesheets.role_code
        type: text
        formula: ='Crew Shifts'!H2
        sql: (select x.role_code from xpms.v_sheet_crew_shifts x where x.source_row = r.source_row)
      - letter: H
        header: RATE CARD ID
        key: rate_card_id
        disposition: computed
        target: app.timesheets.rate_card_id
        type: text
        formula: ='Crew Shifts'!I2
        sql: (select x.rate_card_id from xpms.v_sheet_crew_shifts x where x.source_row = r.source_row)
      - letter: I
        header: JOB TITLE
        key: job_title
        disposition: computed
        target: app.timesheets.job_title
        type: text
        formula: ='Crew Shifts'!J2
        sql: (select x.job_title from xpms.v_sheet_crew_shifts x where x.source_row = r.source_row)
      - letter: J
        header: ACTUAL IN TIME
        key: actual_in_time
        disposition: field
        target: app.time_entries.clock_in
        type: time
        transform: Actual in time.
      - letter: K
        header: MEAL OUT TIME
        key: meal_out_time
        disposition: field
        target: app.clock_punches.effective_at
        type: time
        transform: Meal out as a Break Start punch.
      - letter: L
        header: MEAL IN TIME
        key: meal_in_time
        disposition: field
        target: app.clock_punches.effective_at
        type: time
        transform: Meal in as a Break End punch.
      - letter: M
        header: ACTUAL OUT TIME
        key: actual_out_time
        disposition: field
        target: app.time_entries.clock_out
        type: time
        transform: Actual out time.
      - letter: N
        header: MEAL DURATION (HRS)
        key: meal_duration_hrs
        disposition: computed
        target: app.timesheets.meal_duration_hrs
        type: numeric
        formula: =ROUND((L2-K2)*24, 2)
        sql: round(xpms.pb_hours(r.meal_out_time, r.meal_in_time), 2)
      - letter: O
        header: TOTAL ELAPSED HOURS
        key: total_elapsed_hours
        disposition: computed
        target: app.timesheets.total_elapsed_hours
        type: numeric
        formula: =ROUND((M2-J2)*24, 2)
        sql: round(xpms.pb_hours(r.actual_in_time, r.actual_out_time), 2)
      - letter: P
        header: NET WORKED HOURS
        key: net_worked_hours
        disposition: computed
        target: app.timesheets.net_worked_hours
        type: numeric
        formula: =ROUND(O2-N2, 2)
        sql: round(r.total_elapsed_hours - r.meal_duration_hrs, 2)
      - letter: Q
        header: REGULAR HOURS (1.0x)
        key: regular_hours_1_0x
        disposition: computed
        target: app.timesheets.regular_hours_1_0x
        type: numeric
        formula: =ROUND(MIN(8, P2), 2)
        sql: round(least(8, r.net_worked_hours), 2)
      - letter: R
        header: OVERTIME HOURS (1.5x)
        key: overtime_hours_1_5x
        disposition: computed
        target: app.timesheets.overtime_hours_1_5x
        type: numeric
        formula: =ROUND(MAX(0, MIN(4, P2-8)), 2)
        sql: round(greatest(0, least(4, r.net_worked_hours - 8)), 2)
      - letter: S
        header: DOUBLE TIME HOURS (2.0x)
        key: double_time_hours_2_0x
        disposition: computed
        target: app.timesheets.double_time_hours_2_0x
        type: numeric
        formula: =ROUND(MAX(0, P2-12), 2)
        sql: round(greatest(0, r.net_worked_hours - 12), 2)
      - letter: T
        header: HOURLY BASE RATE
        key: hourly_base_rate
        disposition: computed
        target: app.timesheets.hourly_base_rate
        type: numeric
        formula: ='Crew Shifts'!Q2
        sql: (select x.hourly_base_rate from xpms.v_sheet_crew_shifts x where x.source_row = r.source_row)
      - letter: U
        header: REGULAR PAY
        key: regular_pay
        disposition: computed
        target: app.timesheets.regular_pay
        type: numeric
        formula: =ROUND(Q2*T2, 2)
        sql: round(r.regular_hours_1_0x * r.hourly_base_rate, 2)
      - letter: V
        header: OVERTIME PAY
        key: overtime_pay
        disposition: computed
        target: app.timesheets.overtime_pay
        type: numeric
        formula: =ROUND(R2*T2*1.5, 2)
        sql: round(r.overtime_hours_1_5x * r.hourly_base_rate * 1.5, 2)
      - letter: W
        header: DOUBLE TIME PAY
        key: double_time_pay
        disposition: computed
        target: app.timesheets.double_time_pay
        type: numeric
        formula: =ROUND(S2*T2*2, 2)
        sql: round(r.double_time_hours_2_0x * r.hourly_base_rate * 2, 2)
      - letter: X
        header: MEAL PENALTY PAY
        key: meal_penalty_pay
        disposition: computed
        target: app.timesheets.meal_penalty_pay
        type: numeric
        formula: =IF((K2-J2)*24 > 6, 50, 0)
        sql: case when xpms.pb_hours(r.actual_in_time, r.meal_out_time) > 6 then 50 else 0 end
      - letter: Y
        header: PER DIEM PAY
        key: per_diem_pay
        disposition: computed
        target: app.timesheets.per_diem_pay
        type: numeric
        formula: =IFERROR(VLOOKUP(H2, 'Labor Rate Cards'!$A$2:$K$36, 11, FALSE), 0)
        sql: coalesce((select x.per_diem_rate_minor / 100.0 from xpms.rate_card x where x.rate_card_id = r.rate_card_id), 0)
      - letter: Z
        header: GROSS EARNINGS
        key: gross_earnings
        disposition: computed
        target: app.timesheets.gross_earnings
        type: numeric
        formula: =ROUND(U2+V2+W2+X2+Y2, 2)
        sql: round(r.regular_pay + r.overtime_pay + r.double_time_pay + r.meal_penalty_pay + r.per_diem_pay, 2)
      - letter: AA
        header: EXPENSE GL ACCOUNT
        key: expense_gl_account
        disposition: computed
        target: app.timesheets.expense_gl_account
        type: numeric
        formula: =IFERROR(VLOOKUP(H2, 'Labor Rate Cards'!$A$2:$L$36, 12, FALSE), "")
        sql: (select x.gl_account::numeric from xpms.rate_card_resolved x where x.rate_card_id = r.rate_card_id)
      - letter: AB
        header: EXPENSE GL NAME
        key: expense_gl_name
        disposition: computed
        target: app.timesheets.expense_gl_name
        type: text
        formula: =IFERROR(VLOOKUP(H2, 'Labor Rate Cards'!$A$2:$M$36, 13, FALSE), "")
        sql: (select x.gl_account_name from xpms.rate_card_resolved x where x.rate_card_id = r.rate_card_id)
      - letter: AC
        header: STATUS
        key: status
        disposition: field
        target: app.timesheets.timesheet_state
        type: text
        transform: Approved is a timesheet state.
      - letter: AD
        header: FLAG
        key: flag
        disposition: field
        target: xpms.production_template_values.value_text
        type: bool
        transform: "Template only: the spreadsheet's attention checkbox. XOS keeps no per-row flag column; attention is a favorite, a watcher or an inbox item of a person, not a fact of the row."
      - letter: AE
        header: NOTES
        key: notes
        disposition: field
        target: app.comments.body
        type: text
        transform: Imported as the first comment on the row's comment thread (comment_threads.subject_table = 'app.timesheets').
      - letter: AF
        header: CREATED BY
        key: created_by
        disposition: field
        target: app.timesheets.created_by
        type: text
      - letter: AG
        header: CREATED AT
        key: created_at
        disposition: field
        target: app.timesheets.created_at
        type: date
      - letter: AH
        header: UPDATED AT
        key: updated_at
        disposition: field
        target: app.timesheets.updated_at
        type: date
  - sheet: Labor Rate Cards
    key: labor_rate_cards
    destination: standard-library
    entity: xpms.rate_card
    columns:
      - letter: A
        header: RATE CARD ID
        key: rate_card_id
        disposition: field
        target: xpms.rate_card.rate_card_id
        type: text
      - letter: B
        header: ROLE CODE
        key: role_code
        disposition: field
        target: xpms.rate_card.role_code
        type: text
      - letter: C
        header: JOB TITLE
        key: job_title
        disposition: field
        target: xpms.role.job_title
        type: text
        formula: =_xlfn.XLOOKUP(B2, 'Roles Library'!$A$2:$A$12, 'Roles Library'!$B$2:$B$12)
        transform: "Ruling D12: the title is read from the Roles Library through the role code."
      - letter: D
        header: ENGAGEMENT TYPE
        key: engagement_type
        disposition: field
        target: xpms.rate_card.worker_classification
        type: text
        transform: "Ruling D16: Engagement Type becomes worker_classification and arrangement (canon/rulings/owner-rulings.yaml engagement_types)."
      - letter: E
        header: PAY BASIS
        key: pay_basis
        disposition: field
        target: xpms.rate_card.pay_basis
        type: text
      - letter: F
        header: STANDARD RATE
        key: standard_rate
        disposition: field
        target: xpms.rate_card.standard_rate_minor
        type: numeric
        transform: Dollars to minor units of currency_code.
      - letter: G
        header: MIN GRADE RATE
        key: min_grade_rate
        disposition: field
        target: xpms.rate_card.min_grade_rate_minor
        type: numeric
        transform: Dollars to minor units of currency_code.
      - letter: H
        header: MAX GRADE RATE
        key: max_grade_rate
        disposition: field
        target: xpms.rate_card.max_grade_rate_minor
        type: numeric
        transform: Dollars to minor units of currency_code.
      - letter: I
        header: OT MULTIPLIER
        key: ot_multiplier
        disposition: field
        target: xpms.rate_card.overtime_rule_id
        type: text
        transform: "Ruling D14: the multiplier pair resolves to an overtime_rule; 1.5x text is parsed."
      - letter: J
        header: DT MULTIPLIER
        key: dt_multiplier
        disposition: field
        target: xpms.rate_card.overtime_rule_id
        type: text
        transform: "Ruling D14: the multiplier pair resolves to an overtime_rule."
      - letter: K
        header: PER DIEM RATE
        key: per_diem_rate
        disposition: field
        target: xpms.rate_card.per_diem_rate_minor
        type: numeric
        transform: Dollars to minor units of currency_code.
      - letter: L
        header: DEFAULT GL ACCOUNT
        key: default_gl_account
        disposition: field
        target: xpms.rate_card_resolved.gl_account
        type: numeric
        transform: "Ruling D13: derived from the role's class; not stored."
      - letter: M
        header: DEFAULT GL NAME
        key: default_gl_name
        disposition: field
        target: xpms.rate_card_resolved.gl_account_name
        type: text
        formula: =IFERROR(__xludf.DUMMYFUNCTION("XLOOKUP(TO_TEXT(L2), 'GL Accounts'!$A$2:$A$24, 'GL Accounts'!$B$2:$B$24)"),"Expense · Executive")
        transform: "Ruling D13: derived from the role's class; not stored."
      - letter: N
        header: STATUS
        key: status
        disposition: field
        target: xpms.rate_card.source_status
        type: text
      - letter: O
        header: FLAG
        key: flag
        disposition: field
        target: xpms.rate_card.flag
        type: bool
      - letter: P
        header: NOTES
        key: notes
        disposition: field
        target: xpms.rate_card.notes
        type: text
      - letter: Q
        header: CREATED BY
        key: created_by
        disposition: field
        target: xpms.rate_card.source_created_by
        type: text
      - letter: R
        header: CREATED AT
        key: created_at
        disposition: field
        target: xpms.rate_card.source_created_at
        type: date
      - letter: S
        header: UPDATED AT
        key: updated_at
        disposition: field
        target: xpms.rate_card.source_updated_at
        type: date
    query: select rc.source_row, xpms.pb_text(rc.rate_card_id) as rate_card_id, xpms.pb_text(rc.role_code) as role_code, xpms.pb_text(v.job_title) as job_title, case when rc.worker_classification = 'EMPLOYEE' then 'W2 Daily' when rc.worker_classification = 'VENDOR_SUPPLIED' then 'Vendor Master' when rc.arrangement = 'Retainer' then 'Retainer' else 'Contractor 1099' end as engagement_type, xpms.pb_text(rc.pay_basis) as pay_basis, xpms.pb_num(rc.standard_rate_minor / 100.0) as standard_rate, xpms.pb_num(rc.min_grade_rate_minor / 100.0) as min_grade_rate, xpms.pb_num(rc.max_grade_rate_minor / 100.0) as max_grade_rate, xpms.pb_num(v.ot_multiplier) as ot_multiplier, xpms.pb_num(v.dt_multiplier) as dt_multiplier, xpms.pb_num(rc.per_diem_rate_minor / 100.0) as per_diem_rate, xpms.pb_text(v.gl_account) as default_gl_account, xpms.pb_text(v.gl_account_name) as default_gl_name, xpms.pb_text(rc.source_status) as status, xpms.pb_bool(rc.flag) as flag, xpms.pb_text(rc.notes) as notes, xpms.pb_text(rc.source_created_by) as created_by, xpms.pb_ts(rc.source_created_at) as created_at, xpms.pb_ts(rc.source_updated_at) as updated_at from xpms.rate_card rc join xpms.rate_card_resolved v on v.rate_card_id = rc.rate_card_id
