      - letter: S
        header: QUANTITY
        key: quantity
        disposition: field
        target: app.budget_lines.quantity
        type: numeric
        real_world: price
      - letter: T
        header: RATE
        key: rate
        disposition: computed
        target: app.budget_lines.rate
        type: numeric
        formula: =SUMIFS('PO Line Items'!$H:$H, 'PO Line Items'!$C:$C, $A2) + SUMIFS('Change Orders'!$M:$M, 'Change Orders'!$E:$E, $A2, 'Change Orders'!$W:$W, "Approved")
        sql: coalesce((select sum(x.total_amount) from xpms.v_sheet_po_line_items x where x.expense_ref_id = r.record_id), 0) + coalesce((select sum(x.total_amount) from xpms.v_sheet_change_orders x where x.expense_ref_id = r.record_id and x.status = 'Approved'), 0)
      - letter: U
        header: UNIT BASIS
        key: unit_basis
        disposition: field
        target: app.budget_lines.unit_basis
        type: text
      - letter: V
        header: ESTIMATE
        key: estimate
        disposition: computed
        target: app.budget_lines.estimate
        type: numeric
        formula: =IF(OR(S2="",T2=""),"",ROUND(S2*T2,2))
        sql: case when r.quantity is null then null else round(xpms.pb_n(r.quantity) * r.rate, 2) end
      - letter: W
        header: BUDGET
        key: budget
        disposition: computed
        target: app.budget_lines.budget
        type: numeric
        formula: =IF(V2="","",V2)
        sql: r.estimate
      - letter: X
        header: COMMITTED
        key: committed
        disposition: computed
        target: app.budget_lines.committed
        type: numeric
        formula: =SUMIFS('PO Line Items'!$H:$H, 'PO Line Items'!$C:$C, $A2) + SUMIFS('Change Orders'!$M:$M, 'Change Orders'!$E:$E, $A2, 'Change Orders'!$W:$W, "Approved")
        sql: coalesce((select sum(x.total_amount) from xpms.v_sheet_po_line_items x where x.expense_ref_id = r.record_id), 0) + coalesce((select sum(x.total_amount) from xpms.v_sheet_change_orders x where x.expense_ref_id = r.record_id and x.status = 'Approved'), 0)
      - letter: Y
        header: FORECAST
        key: forecast
        disposition: computed
        target: app.budget_lines.forecast
        type: numeric
        formula: =IF(AND(W2="",X2=""),"",MAX(N(W2),N(X2)))
        sql: case when r.budget is null and r.committed is null then null else greatest(coalesce(r.budget, 0), coalesce(r.committed, 0)) end
      - letter: Z
        header: ACTUAL
        key: actual
        disposition: field
        target: app.budget_lines.actual
        type: text
        real_world: price
      - letter: AA
        header: VARIANCE
        key: variance
        disposition: computed
        target: app.budget_lines.variance
        type: numeric
        formula: =W2-Z2
        sql: coalesce(r.budget, 0) - coalesce(xpms.pb_n(r.actual), 0)
      - letter: AB
