# Playbook column map (Section 2.1). Generated by @xos/canon-import, completed by A01.
# Every column of every sheet has exactly one disposition: field, computed or presentation.
# The importer keeps completed entries on re-run and adds skeleton entries for new columns.
version: 1
sheets:
  - sheet: Cover Page
    key: cover_page
    destination: template-metadata
    entity: xpms.production_template_metadata
    columns:
      - letter: A
        header: ""
        key: a
        disposition: field
        target: xpms.production_template_metadata.value_text
        type: text
        transform: Cover cell stored at its row and column; a formula cell keeps its evaluated value and its formula text as template metadata.
      - letter: B
        header: ""
        key: b
        disposition: field
