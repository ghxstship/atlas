# Owner decision 25 (2026-10-19, approved; Linear RRR-101): how the Playbook and the Bible reconcile.
# Section 2.1 says neither file silently wins. This decision says how each difference resolves, and this
# file holds every entry the decision needs that the importer cannot compute. The importer applies it
# (canon/import/src/decision25.ts), seeds what it decides into xpms.label_mapping and
# xpms.playbook_sourced_value, and canon:check fails on any Playbook to Bible difference the decision
# does not explain and on any entry below that no longer matches a difference.
#
# The rules the importer computes from the data:
#   1. The Bible wins on structure: codes, states, labels and hierarchy. Where the Bible (or the Item
#      Catalog and GL chart, which are canon too) states a value, canon keeps it. The Playbook value stays
#      in xpms.intake, Canceled, only so the Playbook round trip reproduces the source.
#   2. Values the Bible lacks are imported, marked as from the Playbook: the value is stored in canon and
#      xpms.playbook_sourced_value names its Playbook cell, so it can be reviewed later.
#   3. Labels that differ only in casing or punctuation follow the Bible.
#   4. Playbook status labels that are not states of their lifecycle map to the closest existing state.
#      No state is added. Each mapping is listed below and seeded into xpms.label_mapping.
#   5. Em dash substitutions in canon content are accepted (RRR-65). Stand-in items stay as they are,
#      flagged in canon/reports/doctrine-findings.md.
#   6. The CSMIA26 Production Template rows stay private: unpublished, readable only by service_role (RRR-67).
#   7. Bible inconsistencies and unstated relationships (RRR-66) are not covered. They are listed in
#      legal/qa/findings/A56-001.md for the owner and are not decided here; owner decision 39 (2026-10-23,
#      canon/rulings/decision-39.yaml) rules on them.

decision: D25
decided_on: "2026-10-19"
linear: RRR-101

# Findings in canon/reports/doctrine-findings.md that this decision settles, by kind.
accepted_findings:
  em-dash-substituted: "Accepted by owner decision 25 (RRR-65): the spaced hyphen stays."
  guard-reserved-word: "Owner decision 25 (RRR-65): stand-in items stay as they are, flagged here for later replacement."
  ruling: Settled by ruling D11 (grades).

# Rows only the Playbook holds in a Bible list. The Bible wins on structure, so the row is not added;
# the label resolves to the closest existing canon value wherever the Playbook uses it.
playbook_only_rows:
  - sheet: Counterparty Types
    key: Landlord
    domain: counterparty_type
    canon_value: Facilities Services
    note: "The Bible names no landlord counterparty type (it has the role 0000.50.04 Landlord representative). Facilities Services (building services on a recurring scope, GL 5600 like the Playbook's Landlord row) is the closest existing type."

# Standard Library enumeration labels (Playbook Enumerations sheet) that are not canon values. A label that
# differs from a canon value only in casing or punctuation follows the Bible without an entry here.
# basis: closest-state (rule 4) or closest-value (the Bible's list wins; the closest existing value is named).
library_labels:
  - domain: Workflow Status
    label: Inactive
    canon_domain: state
    canon_value: Deferred
    basis: closest-state
    note: Temporarily deactivated or dormant is moved out of the current plan.
  - domain: Workflow Status
    label: Pending
    canon_domain: state
    canon_value: Proposed
    basis: closest-state
    note: Awaiting review or authorization is authored but not yet accepted.
  - domain: Workflow Status
    label: Approved
    canon_domain: state
    canon_value: Ready
    basis: closest-state
    note: "Signed off is accepted, with work not yet started."
  - domain: Workflow Status
    label: In Progress
    canon_domain: state
    canon_value: Active
    basis: closest-state
    note: Actively executing is in progress.
  - domain: Workflow Status
    label: Deployed
    canon_domain: state
    canon_value: Active
    basis: closest-state
    note: Assigned and dispatched to the field is in force.
  - domain: Workflow Status
    label: In Transit
    canon_domain: state
    canon_value: Active
    basis: closest-state
    note: En route is in progress.
  - domain: Workflow Status
    label: Delivered
    canon_domain: state
    canon_value: Complete
    basis: closest-state
    note: Arrived and intake completed is done.
  - domain: Workflow Status
    label: Resolved
    canon_domain: state
    canon_value: Complete
    basis: closest-state
    note: Corrected and verified is done.
  - domain: Workflow Status
    label: Staged
    canon_domain: state
    canon_value: Ready
    basis: closest-state
    note: Positioned in a holding bay with prerequisites met is ready to proceed.
  - domain: Workflow Status
    label: Completed
    canon_domain: state
    canon_value: Complete
    basis: closest-state
    note: Finished completely is Complete.
  - domain: Workflow Status
    label: Open
    canon_domain: state
    canon_value: Active
    basis: closest-state
    note: Active and awaiting expenditure or award is in force.
  - domain: Workflow Status
    label: Estimated
    canon_domain: state
    canon_value: Quoted
    basis: closest-state
    note: A preliminary cost basis is priced but not committed.
  - domain: Payment Status
    label: Pending
    canon_domain: state
    canon_value: Committed
    basis: closest-state
    note: An expense incurred and awaiting its invoice is committed.
  - domain: Payment Status
    label: Approved
    canon_domain: state
    canon_value: Invoiced
    basis: closest-state
    note: "An invoice verified and approved for payment is invoiced, not yet paid."
  - domain: Payment Status
    label: Reconciled
    canon_domain: state
    canon_value: Paid
    basis: closest-state
    note: "Reconciled follows settlement; Paid is the last money state."
  - domain: Payment Status
    label: Disputed
    canon_domain: state
    canon_value: Blocked
    basis: closest-state
    note: Payment held over a discrepancy cannot proceed.
  - domain: Unit of Measure
    label: Flat Fee
    canon_domain: unit
    canon_value: lump sum
    basis: closest-value
    note: A lump sum fee is the canon basis lump sum.
  - domain: Unit of Measure
    label: Run / Trip
    canon_domain: unit
    canon_value: each
    basis: closest-value
    note: One run or trip is counted as each.

