# Playbook labels in Production Template columns that land in the domain schema (finding A47-001, the 18
# targets that waited on this decision). Each names the canon or domain value it maps to. domain is the
# lifecycle or code list mapped into: an app enum (production_state, work_order_state, asset_state,
# shift_state), the canon state list (state), or a canon list (record_kind, record_subtype, phase,
# department, category, counterparty_type, order_type, freight_type).
template_labels:
  - domain: production_state
    label: Active
    canon_value: Active
    basis: same-label
    applies_to: Projects OPERATIONAL STATE
  - domain: production_state
    label: Complete
    canon_value: Complete
    basis: same-label
    applies_to: Projects OPERATIONAL STATE
  - domain: production_state
    label: Scheduled
    canon_value: Active
    basis: closest-state
    applies_to: Projects OPERATIONAL STATE
    note: "A scheduled production is dated and accepted, so it is in force; production_state has no Scheduled."
  - domain: work_order_state
    label: Completed
    canon_value: Complete
    basis: closest-state
    applies_to: Work Orders STATUS
  - domain: work_order_state
    label: In Progress
    canon_value: In Progress
    basis: same-label
    applies_to: Work Orders STATUS
  - domain: work_order_state
    label: Scheduled
    canon_value: Awarded
    basis: closest-state
    applies_to: Work Orders STATUS
    note: "Dated and resourced is awarded to one bid; like In Progress and Complete it needs the awarded bid."
  - domain: asset_state
    label: Active
    canon_value: Available
    basis: closest-state
    applies_to: Asset Inventory STATUS
    note: "An operational unit in the inventory is in service and available; asset_state has no Active."
  - domain: shift_state
    label: Confirmed
    canon_value: Accepted
    basis: closest-state
    applies_to: Crew Shifts STATUS
    note: A confirmed shift is one the worker accepted.
  - domain: state
    label: Scheduled
    canon_value: Scheduled
    basis: same-label
    applies_to: Shipping Manifest STATUS
    note: "Shipments have no lifecycle column and none is added; Scheduled holds while ships_at is set and the freight has not arrived."
  - domain: state
    label: Staged
    canon_value: Ready
    basis: closest-state
    applies_to: Marshalling Yard Log STATUS
    note: "Log entries have no lifecycle column and none is added; a staged vehicle has checked in (gate_queue.arrived_at) and is not released."
  - domain: state
    label: Open
    canon_value: Active
