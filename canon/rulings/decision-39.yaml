# 4. Statement columns removed. Tab 23 holds headings with no statement text; tab 24's record_kind#6 and
#    record_subtype columns repeat tab 25's headers; tab 25's gate, phase_code and phase columns repeat tab 05
#    on its first nine rows; five tab 34 rules are formulas saved with no value. For tab 34 the removed
#    statements are the rule cells of the fields named.
removed_statements:
  - tab: "23"
    columns: [INSTANCES]
  - tab: "24"
    columns: ["record_kind#6", record_subtype]
  - tab: "25"
    columns: [gate, phase_code, phase]
  - tab: "34"
    fields: [Estimate, Budget, Forecast, Variance, Rate]

# 5. Role codes (ruling D12). The Roles Library owns them; Bible tab 27's are retired as the authority.
#    These are the Roles Library codes tab 27 lacks, which the retirement settles.
role_codes:
  owner: Roles Library
  retired: Bible tab 27
  library_only: ["2000.50.02", "5000.50.03", "6000.50.03"]

# 6. GL defaults (ruling D13). An item may carry an explicit account its class does not give (purchase_account or
#    sales_account), and so may a counterparty type (default_account_code). An item posting to a balance-sheet
#    account always carries its own, because no class derives one. The importer reports each such item.
gl_defaults:
  balance_sheet_types: [Asset, Liability, Equity]

# 7. Unit dimensions ratified. A unit no canon file states is added as a canon unit of its dimension.
unit_dimensions:
  - dimension_code: time
    name: Time
    units: [hour, day, week, year]

# 8. Declared gaps (doctrine 3.4, finding A65-019): gated phases with no Active element, ratified by the owner.
#    Their catalog items keep the Proposed state the Item Catalog gives them.
declared_gaps:
  ratified_by: Julian Clarkson
  phases:
    - phase_code: SCP
      reason: No Scope item is Active yet; the Item Catalog proposes every one.
    - phase_code: ENG
      reason: No Engage item is Active yet; the Item Catalog proposes every one.
    - phase_code: AMP
      reason: No Amplify item is Active yet; the Item Catalog proposes every one.
    - phase_code: CLS
      reason: No Close item is Active yet; the Item Catalog proposes every one.
