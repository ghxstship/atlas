# Owner decision of 2026-10-24 on Linear RRR-67: everything relating to the client of the CSMIA26 activation is
# anonymized. The rest of the activation's rows stay as they are, private to GHXSTSHIP: the 14 SOPs and 11
# documents listed in private.standard_library_withheld (migration 1612) never reach another org.
#
# The importer applies this to every text value it writes into the canon seed (canon/import/src/rrr67.ts, called
# from sql.ts textLiteral), so a regenerated 0150_xpms_canon_seed.sql never names the client. Migration 2001 applies
# the same substitutions, through private.rrr67_anonymize, to a database that already holds the earlier seed.
# The source workbooks in canon/source stay as the owner supplied them.

decision: RRR-67
decided_on: "2026-10-24"
linear: RRR-67

# A cell whose whole value is one of these is replaced whole: the client's contact, split over the
# Personnel Roster's name columns, and the client's tax identifier in the Vendor Directory.
values:
  "Isabella": "Client"
  "Acker": "Lead"
  "Izzy": "Client"
  "13-4029182": "00-0000000"

# Then these substrings, in this order, so a longer phrase is replaced before a shorter one inside it.
replacements:
  - ["isabella@spotify.com", "client.lead@example.com"]
  - ["https://www.spotify.com", "https://www.example.com"]
  - ["Isabella Acker (Spotify)", "the client lead"]
