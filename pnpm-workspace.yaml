packages:
  - apps/*
  - packages/*
  - canon/import
  - infra

onlyBuiltDependencies:
  - unrs-resolver

# pdfjs-dist (Atlas file previews, A142) offers @napi-rs/canvas for rendering in Node; Atlas renders PDFs
# only in the browser, so the native binary is never installed.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

# Every override lives here. pnpm ignores this list when the root package.json has a `pnpm.overrides`
# field, which is how the unzipper override below silently stopped applying (A94): keep package.json
# free of a `pnpm` field. Accepted audit advisories are in infra/security/audit-allowlist.json.
overrides:
  # gate 11 audit (A54): patched releases of transitive dependencies.
  "@xmldom/xmldom@<0.8.15": 0.8.15
  uuid@<11.1.1: 11.1.1
  # exceljs 4.4.0 pins unzipper 0.10, which pulls in binary and buffers 0.1.1; buffers declares no
  # license (owner decision 17, ADR 0034). unzipper 0.12 (MIT) dropped both and keeps the Parse API
  # exceljs's streaming reader uses.
  exceljs>unzipper: 0.12.3
  # RRR-242. ajv 8 (stylelint, @xos/api's OpenAPI tooling) asks for fast-uri ^3; 3.1.9 fixes
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-333x-w4r6-6crp and GHSA-xhq7-xmqj-769h.
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  # @expo/cli 57.0.30 (the Compass build tool, not its bundle) takes node-forge ^1.3.1; 1.4.3, a patch release in
  # the same major, fixes the eleven advisories the audit allowlist accepted for 1.4.0 (ADR 0001, 2026-11-09).
  node-forge@<1.4.3: 1.4.3
  # @sentry/bundler-plugins (Atlas's build-time source map upload) is the one production path to glob 9 to 14.0.1
  # (GHSA-3g3m-2fjr-6pw4). It calls only glob(patterns, { absolute, nodir, ...options }), which glob 14 keeps; 14's
  # breaking changes are its Pattern and walker internals, its debug option and ignore patterns that start with /.
  # Expo's tools keep glob 13 (development only, a warning) until they move.
  "@sentry/bundler-plugins>glob": 14.0.4
  # eas-cli (the Compass build tool) takes minimatch 5.1.2; 5.1.9, the same major, fixes GHSA-3ppc-4f35-3m26,
  # GHSA-7r86-cg39-jmmj and GHSA-23c5-xmqv-rm74.
  minimatch@>=5.0.0 <5.1.9: 5.1.9
  # RRR-242. @expo/cli 57.0.30 pins zod ^3.25.76, which has no fix for GHSA-mrhx-c7xc-m3w5 (high). It
  # uses zod only for its dev tools plugin schemas (object, string, enum, union, literal, url, strict,
  # safeParse), which zod 4 keeps. @expo/cli 57.0.33 drops zod: remove this line when expo takes it.
  "@expo/cli>zod": 4.6.6
  # RRR-242. expo-router 57 uses query-string 7.1.3, the last CommonJS release, which takes
  # decode-uri-component 0.2 (GHSA-qr28-fpjm-wq7f high, GHSA-vcc3-ghjq-m6fr). The fix, 0.5.1, is an ES
  # module only, so the patch below reads its default export (Metro and Node 22.12's require of an ES
  # module both give it). query-string 8 and later export only a default, which expo-router's
  # `import * as` cannot use. Remove both when expo-router moves off query-string 7: pnpm then fails
  # the install on the unused patch.
  query-string@7.1.3>decode-uri-component: 0.5.1

patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
