# Local Semgrep rules (Section 18 gate 11), run with the registry rulesets by infra/security/semgrep.sh.
# They cover the two ways this codebase builds query text: node-postgres calls (canon import, scripts)
# and PostgREST filter strings (supabase-js `.or()` and `.filter()`).
rules:
  - id: xos-pg-query-interpolated
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL text built by string interpolation reaches a node-postgres query. Pass values as parameters
      ($1, $2) and quote identifiers with a fixed allowlist.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
    pattern-either:
      - pattern: $CLIENT.query(`...${$X}...`, ...)
      - pattern: $CLIENT.query("..." + $X + "...", ...)
      - pattern: $CLIENT.query("..." + $X, ...)

  # A search term typed by a person reaches a PostgREST `or` filter. A comma or a parenthesis in it would
  # add filter clauses, so the term must pass through a sanitizer first: `safeTerm()` or a `.replace()`
  # that removes the reserved characters. Server values (ISO times, session ids) are not sources.
  - id: xos-postgrest-search-term-unsanitized
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A search term reaches a PostgREST filter string without passing through safeTerm() or a
      .replace() of the reserved characters (comma, parentheses, percent). Sanitize it first.
    metadata:
      category: security
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $O.query
          - pattern: $O.search
          - pattern: $O.q
          - pattern: $O.term
    pattern-sanitizers:
      - pattern-either:
          - pattern: $X.replace(...)
          - pattern: safeTerm(...)
    pattern-sinks:
      - pattern-either:
          - pattern: $Q.or(...)
          - pattern: $Q.filter($COL, $OP, ...)

  # A69-005: CSV written by hand skipped formula neutralization, so a vendor name such as
  # =HYPERLINK(...) ran in the spreadsheet that opened the export. Every CSV field goes through
  # csvField() (packages/data/src/csv.ts); the CLI keeps its own neutralizing csvCell because it does
  # not depend on @xos/data.
  - id: xos-csv-quoting-outside-csv-field
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      CSV quoting written by hand skips formula neutralization. Write each field with csvField()
      from @xos/data/csv, which neutralizes cells a spreadsheet would run as formulas.
    metadata:
      category: security
      cwe: "CWE-1236: Improper Neutralization of Formula Elements in a CSV File"
    paths:
      exclude:
        - packages/data/src/csv.ts
        - packages/cli/src/csv.ts
        - "**/e2e/**"
    pattern-either:
      - pattern: $X.replace(/"/g, '""')
      - pattern: $X.replaceAll('"', '""')

  # A69-003: the first X-Forwarded-For entry is the client's own text, because every proxy appends the
  # address it saw. Reading it let a caller claim an allowed office address past the org IP
  # allow-list. Read the address with clientAddress() from @xos/data/client-address.
  - id: xos-forwarded-for-first-entry
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      The first X-Forwarded-For entry is written by the client. Use clientAddress() from
      @xos/data/client-address, which reads the entry the trusted proxy appended.
    metadata:
      category: security
      cwe: "CWE-348: Use of Less Trusted Source"
    pattern-either:
      - pattern: $H.get("x-forwarded-for")?.split(",")[0]
      - pattern: $H.get("x-forwarded-for").split(",")[0]
      - pattern: $H.get("x-forwarded-for")?.split(",").at(0)
      - pattern: $H.get("x-forwarded-for")?.split(",").shift()
      - patterns:
          - pattern-inside: |
              const $V = $H.get("x-forwarded-for");
              ...
          - pattern-either:
              - pattern: $V.split(",")[0]
              - pattern: $V?.split(",")[0]
