; Mutual TLS in front of clamd. Only a client certificate signed by the XOS scanning CA is accepted; the
; upload-scan Edge Function presents it (XOS_CLAMAV_TLS_CERT and XOS_CLAMAV_TLS_KEY).
foreground = no
pid = /tmp/stunnel.pid
output = /dev/stdout

[clamd]
accept = :::3311
connect = 127.0.0.1:3310
cert = /tmp/xos-tls/server.pem
key = /tmp/xos-tls/server.key
CAfile = /tmp/xos-tls/ca.pem
verifyChain = yes
requireCert = yes
sslVersionMin = TLSv1.3
