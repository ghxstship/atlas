# Local ClamAV (clamd) for the upload-scan Edge Function (A22-011, owner decision 10, ADR 0034).
#
#   docker compose -f infra/scanning/docker-compose.yaml -p xos4-clamav up -d
#
# Then set XOS_CLAMAV_HOST=host.docker.internal and XOS_CLAMAV_PORT=3310 in supabase/functions/.env
# (see infra/scanning/README.md). The image is pinned in ADR 0001 (clamav/clamav 1.5.4); it is
# published for linux/amd64 only, so Apple silicon runs it under emulation. clamd downloads its
# signature database on first start, which takes a few minutes; the health check waits for it.
# Production runs the same image: infra/runbooks/production.md, "Upload scanning (ClamAV)".

name: xos4-clamav

services:
  clamd:
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.5.4}
    platform: linux/amd64
    ports:
      - "127.0.0.1:${XOS_CLAMAV_PORT:-3310}:3310"
    environment:
      # Stream size cap: the largest upload bucket accepts 50 MiB.
      CLAMD_CONF_StreamMaxLength: "60M"
      CLAMD_CONF_MaxScanSize: "150M"
      CLAMD_CONF_MaxFileSize: "60M"
    volumes:
      - signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  signatures:
