name: Weekly backup

# Encrypted logical backups to separate storage (Section 9, infra/runbooks/backup-and-restore.md). Each job dumps one
# project with infra/ci/backup-weekly.sh, encrypts the archive to the owner's public key
# (infra/backup/backup-public-key.asc) and keeps it as an artifact for 35 days. The production job fails until the owner
# commits that key and sets its connection string, so a missing backup is never silent, and a failed run posts to the
# on-call channel. Staging holds no customer data, so its job waits for its secret with a notice and fails only once it
# has one (infra/runbooks/security-owner-steps.md).

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-weekly
  cancel-in-progress: false

jobs:
  staging:
    name: Encrypted logical backup of staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip without the staging secret
        id: gate
        env:
          HAS_SECRET: ${{ secrets.STAGING_DB_URL != '' }}
        run: |
          if [ "$HAS_SECRET" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Staging backup skipped::Add the STAGING_DB_URL repository secret to back up staging (infra/runbooks/security-owner-steps.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          version: 2.120.0
      - name: Dump and encrypt
        if: steps.gate.outputs.run == 'true'
        env:
          XOS_BACKUP_DB_URL: ${{ secrets.STAGING_DB_URL }}
          XOS_BACKUP_SECRET_NAME: STAGING_DB_URL
        run: infra/ci/backup-weekly.sh staging "$RUNNER_TEMP/backup"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          name: xos-staging-backup
          path: ${{ runner.temp }}/backup/*.gpg
          retention-days: 35
          if-no-files-found: error

  production:
    name: Encrypted logical backup of production (read-only login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The connection string is a secret of this environment, which only main may use (ADR 0033, decision 47).
    environment: production-backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CLI names the Postgres image whose pg_dump and psql the script runs; it does not dump itself, because it
      # always switches to the postgres role, which the backup login (migration 1650) cannot.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Dump and encrypt
        env:
          XOS_BACKUP_DB_URL: ${{ secrets.PRODUCTION_BACKUP_DB_URL }}
          XOS_BACKUP_SECRET_NAME: PRODUCTION_BACKUP_DB_URL
        run: infra/ci/backup-weekly.sh production "$RUNNER_TEMP/backup" --reader
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xos-production-backup
          path: ${{ runner.temp }}/backup/*.gpg
          retention-days: 35
          if-no-files-found: error

  # GitHub emails a failed scheduled run only to whoever last changed the cron line, so the channel hears it too.
  alert:
    name: Alert on a failed backup
    needs: [staging, production]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Post to the on-call channel
        env:
          XOS_ALERT_WEBHOOK_URL: ${{ secrets.XOS_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNBOOK_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/infra/runbooks/backup-and-restore.md
        run: |
          infra/ci/post-alert.sh "Weekly backup failed. Run: $RUN_URL Runbook: $RUNBOOK_URL"
