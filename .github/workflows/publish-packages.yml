name: Publish packages

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Publishes an existing tag with this workflow as it stands on the default branch, for a tag whose own
  # copy of the workflow cannot publish (v4.0.0 passed npm a path it read as a GitHub repository).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v4.0.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Version, tests, build and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Tag equals every package version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::${TAG} is not a version tag"; exit 1; }
          VERSION="${TAG#v}"
          for manifest in packages/sdk-ts/package.json packages/cli/package.json; do
            ACTUAL="$(node -p "require('./${manifest}').version")"
            [ "$ACTUAL" = "$VERSION" ] || { echo "::error::${manifest} is ${ACTUAL}, tag is ${TAG}"; exit 1; }
          done
          grep -qx "version = \"${VERSION}\"" packages/sdk-python/pyproject.toml || { echo "::error::pyproject.toml does not say ${VERSION}"; exit 1; }
      - run: pnpm turbo run test --filter=@ghxstship/xos-sdk --filter=@ghxstship/xos-cli --filter=@xos/sdk-python
      - name: Build and pack npm packages
        run: |
          VERSION="${TAG#v}"
          pnpm --filter @ghxstship/xos-sdk build
          pnpm --filter @ghxstship/xos-cli build
          mkdir -p "$RUNNER_TEMP/npm"
          (cd packages/sdk-ts && pnpm pack --pack-destination "$RUNNER_TEMP/npm")
          (cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP/npm")
          # pnpm names a scoped package's archive <scope>-<name>-<version>.tgz.
          tar -tzf "$RUNNER_TEMP/npm/ghxstship-xos-sdk-${VERSION}.tgz" | grep -q package/dist/index.js
          tar -tzf "$RUNNER_TEMP/npm/ghxstship-xos-cli-${VERSION}.tgz" | grep -q package/dist/main.js
          # The packed CLI must depend on this exact SDK version, never workspace:*.
          SDK_RANGE="$(tar -xzOf "$RUNNER_TEMP/npm/ghxstship-xos-cli-${VERSION}.tgz" package/package.json \
            | node -e 'let s="";process.stdin.on("data",(c)=>(s+=c)).on("end",()=>console.log(JSON.parse(s).dependencies["@ghxstship/xos-sdk"]))')"
          [ "$SDK_RANGE" = "$VERSION" ] || { echo "::error::the packed CLI depends on @ghxstship/xos-sdk ${SDK_RANGE}, not ${VERSION}"; exit 1; }
      - name: Build Python distributions
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build packages/sdk-python --outdir "$RUNNER_TEMP/pypi"
          python -m twine check --strict "$RUNNER_TEMP/pypi"/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/pypi/*
          if-no-files-found: error
          retention-days: 30

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ghxstship/xos-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: npm
      # The SDK first: the CLI depends on the exact SDK version.
      - name: Publish @ghxstship/xos-sdk and @ghxstship/xos-cli
        env:
          # Only the first publish uses NPM_TOKEN: npm adds a trusted publisher to a package that exists, and
          # the owner then deletes the secret, after which npm exchanges this job's OIDC token instead
          # (infra/ci/README.md, section 5).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          publish() {
            if npm view "$1@${VERSION}" version >/dev/null 2>&1; then
              echo "$1@${VERSION} is already published; skipping."
            else
              # No --provenance: npm signs provenance only for packages built in a public repository, and
              # this one is private (owner decision, 2026-10-24).
              npm publish "$2" --access public
            fi
          }
          # "./" keeps npm from reading "npm/<file>.tgz" as a GitHub owner/repo shorthand.
          publish @ghxstship/xos-sdk "./npm/ghxstship-xos-sdk-${VERSION}.tgz"
          publish @ghxstship/xos-cli "./npm/ghxstship-xos-cli-${VERSION}.tgz"

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/xos-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
          # PEP 740 attestations need a public repository; this one is private (owner decision, 2026-10-24).
          attestations: false
