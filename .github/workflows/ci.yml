name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Main runs finish so the slow visual job can report; branch runs are superseded by newer pushes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Format, guard, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm guard:finish
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Apply migrations from empty
        run: supabase db start
      - name: Run pgTAP suites
        run: supabase test db

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --exit-code 1

  visual:
    name: Storybook axe and visual baselines (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every story in four modes across three engines is several thousand tests; one runner cannot
    # finish them in time, so Playwright shards them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xos/ui exec playwright install --with-deps chromium firefox webkit
      # Axe (gate 8) blocks from the first run. Until the Linux baselines are committed, missing
      # screenshots are written and uploaded instead of compared (gate 9); remove the env then.
      - run: pnpm turbo run test:visual --filter=@xos/ui -- --shard=${{ matrix.shard }}/8
        env:
          VISUAL_UPDATE_SNAPSHOTS: missing
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: packages/ui/test/visual/__screenshots__
          if-no-files-found: ignore

  ai-evals:
    name: Aurora AI evals (gate 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs only where the Anthropic key is configured; unit tests use a fake model client.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANTHROPIC_API_KEY != ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.ANTHROPIC_API_KEY != ''
      - run: pnpm --filter @xos/ai evals
        if: env.ANTHROPIC_API_KEY != ''
