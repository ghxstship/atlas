name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Main runs finish so the slow visual job can report; branch runs are superseded by newer pushes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Format, guard, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm guard:finish
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the stack images from GHCR (infra/ci/README.md)
        run: infra/ci/supabase-images.sh db
      - name: Apply migrations from empty
        run: supabase db start
      - name: Run pgTAP suites
        run: supabase test db
      # database.types.ts must match what the migrations generate (Section 3.15).
      - name: Database types match the migrations
        run: pnpm --filter @xos/data types:check
      # The data dictionary in the docs site is generated from the catalog comments (Sections 3.15 and 7.1).
      - name: Data dictionary matches the migrations
        run: pnpm --filter @xos/docs dictionary:check
      # Section 9: a backup restores and verifies (row counts, key-table checksums, pgTAP smoke).
      - name: Backup and restore drill
        run: infra/ci/restore-drill.sh
      - name: PowerSync readiness (sync rules against the schema)
        continue-on-error: true
        run: infra/ci/powersync-check.sh
      # Gate 11: Supabase security and performance advisors, failing on any WARN.
      - name: Supabase advisors
        run: sh infra/security/supabase-advisors.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --exit-code 1

  route-js-budget:
    name: Route JavaScript budget (gate 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@xos/atlas --filter=@xos/gateway --filter=@xos/docs --filter=@xos/console
      # Fails when a key page passes 200 KB gzip, or the ceiling recorded for it in
      # packages/testing/bundle-ceilings.json (pages still over budget, ADR 0027).
      - run: pnpm --filter @xos/testing budget:js -- --chunks

  visual:
    name: Storybook axe and visual baselines (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    # The baselines are rendered in this image at the pinned Playwright, so CI renders with the same
    # fonts and libraries; the runner's own packages would shift anti-aliasing on some stories.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    # GitHub mounts its own HOME into job containers, owned by another user; Firefox refuses to start
    # unless HOME belongs to the running user.
    env:
      HOME: /root
    timeout-minutes: 45
    # Every story in four modes across three engines is several thousand tests; one runner cannot
    # finish them in time, so Playwright shards them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Axe (gate 8) and the screenshot baselines (gate 9) both block. On an intended visual change,
      # regenerate the baselines in mcr.microsoft.com/playwright at the pinned version.
      - run: pnpm turbo run test:visual --filter=@xos/ui -- --shard=${{ matrix.shard }}/8
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-results-${{ matrix.shard }}
          path: node_modules/.cache/playwright-visual
          if-no-files-found: ignore

  # Gate 6. Chromium only: the Firefox and WebKit legs (E2E_ENGINES) triple the minutes and wait on
  # the owner (A24-008). Journeys run against production builds, since dev compiles each route on
  # first visit and typing before hydration is the race they guard against. Gateway's external role
  # journeys also drive Atlas, so its job serves both apps.
  e2e:
    name: Playwright ${{ matrix.suite }} (${{ matrix.app }}) (gates 6, 8)
    runs-on: ubuntu-24.04
    # Atlas runs about 150 journeys and page checks, about 40 minutes on a laptop.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Journeys (gate 6) and axe on every signed-in page per role (gate 8) run on separate runners;
      # together they pass the time limit of one.
      matrix:
        include:
          - { app: atlas, suite: journeys }
          - { app: atlas, suite: axe }
          - { app: gateway, suite: journeys }
          - { app: gateway, suite: axe }
          - { app: docs, suite: journeys }
    env:
      E2E_ENGINES: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/${{ matrix.app }}
      # The full stack (Auth, PostgREST, Storage, Mailpit) with migrations and the demo seed.
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      - name: Write the app environment from the stack
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          # XOS_API_HOST: e2e/api-host.spec.ts reaches the API host by sending Host: api.localhost (RRR-119).
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nATLAS_SITE_URL=http://127.0.0.1:3006\nGATEWAY_SITE_URL=http://127.0.0.1:3127\nSUPABASE_INBUCKET_URL=http://127.0.0.1:55424\nXOS_API_HOST=api.localhost\n' "$ANON" > apps/atlas/.env.local
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nGATEWAY_SITE_URL=http://127.0.0.1:3127\nGATEWAY_PLATFORM_HOSTS=127.0.0.1,localhost\n' "$ANON" > apps/gateway/.env.local
          echo "E2E_ATLAS_URL=http://127.0.0.1:3006" >> "$GITHUB_ENV"
          echo "E2E_API_HOST=api.localhost" >> "$GITHUB_ENV"
          echo "E2E_GATEWAY_URL=http://127.0.0.1:3127" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_URL=http://127.0.0.1:55421" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55422/postgres" >> "$GITHUB_ENV"
          echo "E2E_INBUCKET_URL=http://127.0.0.1:55424" >> "$GITHUB_ENV"
          # The local stack's well-known development service key; the import and report journeys
          # run their workers against it.
          echo "E2E_SUPABASE_SERVICE_KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=@xos/${{ matrix.app }} ${{ matrix.app == 'gateway' && '--filter=@xos/atlas' || '' }}
      - name: Start the production server
        if: matrix.app != 'docs'
        run: |
          PORT=$([ "${{ matrix.app }}" = atlas ] && echo 3006 || echo 3127)
          (cd apps/${{ matrix.app }} && nohup pnpm exec next start --port "$PORT" > /tmp/app.log 2>&1 &)
          if [ "${{ matrix.app }}" = gateway ]; then (cd apps/atlas && nohup pnpm exec next start --port 3006 > /tmp/atlas.log 2>&1 &); fi
          for i in $(seq 60); do curl -fs -o /dev/null "http://127.0.0.1:$PORT" && break; sleep 2; done
          echo "E2E_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          # Production builds offer no pseudo-locales; the ar-XB journey runs in e2e-pseudo-locales.
          echo "E2E_PRODUCTION_BUILD=1" >> "$GITHUB_ENV"
      - name: Journeys
        if: matrix.suite == 'journeys'
        run: pnpm exec playwright test
        working-directory: apps/${{ matrix.app }}
      # Gate 8: axe on every signed-in page per role, both themes, desktop and 375 px.
      - name: Axe on every page
        if: matrix.suite == 'axe'
        run: pnpm test:a11y
        working-directory: apps/${{ matrix.app }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.app }}-${{ matrix.suite }}
          path: |
            apps/${{ matrix.app }}/node_modules/.cache/playwright
            /tmp/*.log
          if-no-files-found: ignore

  # Gate 16: pseudo-locales exist only on next dev, which the configs start themselves. Atlas runs the
  # ar-XB journey, and both apps check en-XA strings and truncation (A53).
  e2e-pseudo-locales:
    name: Pseudo-locale journeys on next dev (gate 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_ENGINES: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/atlas
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      - name: Write the app environments from the stack
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nATLAS_SITE_URL=http://127.0.0.1:3006\nGATEWAY_SITE_URL=http://127.0.0.1:3127\n' "$ANON" > apps/atlas/.env.local
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nGATEWAY_SITE_URL=http://127.0.0.1:3127\nGATEWAY_PLATFORM_HOSTS=127.0.0.1,localhost\n' "$ANON" > apps/gateway/.env.local
          echo "E2E_SUPABASE_URL=http://127.0.0.1:55421" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55422/postgres" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=@xos/atlas^... --filter=@xos/gateway^...
      - name: Atlas (ar-XB journey, en-XA strings, truncation)
        run: pnpm exec playwright test views-help.spec.ts pseudo-locales.spec.ts -g "right to left|en-XA|ar-XB"
        working-directory: apps/atlas
        env:
          E2E_SKIP_AURORA: "1"
      - name: Gateway (en-XA strings, truncation)
        run: pnpm exec playwright test pseudo-locales.spec.ts
        working-directory: apps/gateway
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-pseudo-locales
          path: apps/*/node_modules/.cache/playwright
          if-no-files-found: ignore

  # Gate 19: every Section 11.9 template, both paper sizes and both locales, passes PDF/UA-1.
  verapdf:
    name: veraPDF PDF/UA-1 for generated documents (gate 19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the pinned veraPDF image
        run: docker pull --platform linux/amd64 verapdf/cli:v1.30.2
      - name: Render every Section 11.9 template and validate PDF/UA-1
        run: pnpm --filter @xos/data documents:verapdf

  # Gate 20: no breaking change to the OpenAPI document since the latest v* tag (passes with a notice
  # until the first tag).
  api-breaking-changes:
    name: API breaking changes (gate 20, oasdiff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: oasdiff against the latest v* tag
        run: infra/ci/oasdiff.sh --format githubactions

  # Section 2.1 and gate 14: canon hashes, counts, generated files, and every Playbook to Bible
  # difference explained (owner decision 25, ADR 0033).
  canon:
    name: Canon check (Section 2.1, gate 14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canon hashes, counts, generated files and Playbook to Bible differences
        run: pnpm --filter @xos/canon-import canon:check
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canon-reports
          path: canon/reports/
          if-no-files-found: ignore

  # Gate 11: Semgrep with pinned rulesets and two tested local rules.
  semgrep:
    name: Semgrep (gate 11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep rule tests and scan (semgrep/semgrep:1.140.0)
        run: sh infra/security/semgrep.sh

  # Gate 11: dependency advisories. Any production advisory fails, and a critical one anywhere in the
  # tree (build and test tooling included; malware advisories are critical). Accepted advisories, each
  # with a reason and a review date, are in infra/security/audit-allowlist.json.
  dependency-audit:
    name: Dependency audit (gate 11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No install, so no pnpm store to cache: setup-node's cache step would fail on the missing path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit against the allowlist
        run: node --experimental-strip-types --no-warnings infra/security/src/cli.ts audit

  # Gate 11 and Section 9 supply chain: production licenses against the allowlist (packages awaiting
  # counsel are in packages/config/license-exceptions.json), a CycloneDX SBOM of the production install
  # kept as an artifact (releases attach theirs in release.yml), and every action pin checked against
  # the commit of its upstream tag.
  supply-chain:
    name: Licenses, SBOM and action pins (gate 11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # The production install runs on the Node line Vercel builds with (22.x, the latest release;
      # infra/runbooks/production.md), not .nvmrc's older 22.14.0: pnpm leaves out an optional package
      # whose engines the running Node misses, so on 22.14.0 the install missed one that ships (rollup's
      # @napi-rs/lzma-linux-x64-gnu needs 22.20), and `pnpm licenses list`, which checks only os, cpu
      # and libc, failed looking for it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          check-latest: true
          cache: pnpm
      - name: Actions pinned to the commits of their tags (git ls-remote)
        run: node --experimental-strip-types --no-warnings infra/security/src/cli.ts pins --remote
      # Production dependencies only: the license check and the SBOM cover what ships.
      - run: pnpm install --frozen-lockfile --prod
      - name: License check
        run: pnpm --filter @xos/config licenses:check
      - name: CycloneDX SBOM (anchore/syft:v1.54.1) and third-party notices
        run: sh infra/security/sbom.sh "$GITHUB_SHA" sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  # Gate 11 on the hosted staging branch: the Supabase advisors through the Management API, with the
  # Auth and platform lints a local stack cannot show (the database job runs the local ones). Staging
  # changes when main does, so this runs on pushes to main, not on pull requests. Needs the
  # SUPABASE_ACCESS_TOKEN repository secret (owner step); without it the job passes with a notice.
  # Accepted lints are in infra/security/advisors-accepted.json.
  supabase-advisors-staging:
    name: Supabase advisors on staging (gate 11)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Skip without the access token
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Supabase advisors on staging skipped::Add the SUPABASE_ACCESS_TOKEN repository secret to run them (infra/security/README.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Security and performance advisors through the Management API
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The persistent staging branch of the production project; a repository variable overrides it.
          PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF || 'rmrzfolncwhnhygmfxnw' }}
        run: node --experimental-strip-types --no-warnings infra/security/src/cli.ts advisors "$PROJECT_REF"

  # Gate 9, core screens: the browser runs in the pinned image; the stack and next dev run beside it.
  core-screen-visual:
    name: Core-screen visual baselines (${{ matrix.app }}) (gate 9)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [atlas, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - run: docker pull --platform linux/amd64 mcr.microsoft.com/playwright:v1.64.0-noble
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      # Every core screen is a picture of the demo tenant at one instant, so nothing on it moves
      # with the date of the run: the database is migrated and seeded with its clock there, and
      # next dev and the browsers follow it (E2E_CLOCK_OFFSET_MS, packages/testing/ci/visual-clock.sh).
      - name: Put the stack on the visual clock
        run: packages/testing/ci/visual-clock.sh >> "$GITHUB_ENV"
      - name: Write the app environment from the stack
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nATLAS_SITE_URL=http://127.0.0.1:3006\nGATEWAY_SITE_URL=http://127.0.0.1:3127\n' "$ANON" > apps/atlas/.env.local
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nGATEWAY_SITE_URL=http://127.0.0.1:3127\nGATEWAY_PLATFORM_HOSTS=127.0.0.1,localhost\n' "$ANON" > apps/gateway/.env.local
      - run: pnpm turbo run build --filter=@xos/${{ matrix.app }}^...
      - name: Start next dev
        run: |
          PORT=$([ "${{ matrix.app }}" = atlas ] && echo 3006 || echo 3127)
          CLOCK="--require $GITHUB_WORKSPACE/packages/testing/clock/node-clock.cjs"
          (cd apps/${{ matrix.app }} && NODE_OPTIONS="$CLOCK" nohup pnpm exec next dev --port "$PORT" > /tmp/app.log 2>&1 &)
          for i in $(seq 90); do curl -fs -o /dev/null "http://127.0.0.1:$PORT/auth/sign-in" && break; sleep 2; done
          echo "E2E_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
      - name: Core screens in the pinned Playwright image
        run: packages/testing/ci/visual-in-container.sh ${{ matrix.app }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-screen-visual-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/node_modules/.cache/playwright-visual
            /tmp/app.log
          if-no-files-found: ignore
