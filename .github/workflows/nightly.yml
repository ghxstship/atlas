name: Nightly

# Real-browser and load checks that take too long for every push. The route JavaScript budget in ci.yml
# guards the same gate 10 budget on every push from the build manifests.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI budgets (gate 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/atlas
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      - run: pnpm turbo run build --filter=@xos/atlas --filter=@xos/gateway --filter=@xos/docs
      - name: Serve the three production builds and run Lighthouse
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          export SUPABASE_URL=http://127.0.0.1:55421 SUPABASE_ANON_KEY="$ANON"
          (cd apps/atlas && ATLAS_SITE_URL=http://127.0.0.1:3006 nohup pnpm exec next start --port 3006 > /tmp/atlas.log 2>&1 &)
          (cd apps/gateway && GATEWAY_SITE_URL=http://127.0.0.1:3127 nohup pnpm exec next start --port 3127 > /tmp/gateway.log 2>&1 &)
          (cd apps/docs && nohup pnpm exec next start --port 3014 > /tmp/docs.log 2>&1 &)
          for port in 3006 3127 3014; do
            for i in $(seq 60); do curl -fs -o /dev/null "http://127.0.0.1:$port" && break; sleep 2; done
          done
          # The Chromium installed above. playwright-core is not hoisted, so it resolves through the
          # app's @playwright/test; from the root it failed and Lighthouse fell back to the runner's Chrome.
          CHROME_PATH=$(cd apps/atlas && node -e "console.log(require('@playwright/test').chromium.executablePath())")
          export CHROME_PATH
          pnpm --filter @xos/testing lighthouse
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: |
            packages/testing/node_modules/.cache/lighthouse
            /tmp/*.log
          if-no-files-found: ignore

  load-smoke:
    name: k6 smoke against the CI stack (Section 5.1 scripts stay runnable)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      - run: pnpm turbo run build --filter=@xos/atlas
      # The API allows each caller 600 requests a minute. On the three demo users, the platform and
      # tenant runs together pass that inside one window (the tenant run got 429 on half its reads),
      # so each virtual user signs in as its own load user in the demo org (fixtures/load-tenants.sql).
      - name: Load 20 load users into the demo org
        run: |
          docker exec -i supabase_db_xos4 psql -U postgres -d postgres -X -q -v tenants=1 -v users=20 \
            -v first_tenant=99 -v join_org=demo-productions -v password="'xos-demo-2026'" \
            -f - < packages/testing/load/fixtures/load-tenants.sql
          echo "LOAD_USERS=$(docker exec supabase_db_xos4 psql -U postgres -d postgres -XAtc \
            "select string_agg(email, ',' order by email) from auth.users where email like 'load-99-%@load.example.test'")" >> "$GITHUB_ENV"
      - name: Smoke the three scripts through grafana/k6:2.3.0
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          export SUPABASE_ANON_KEY="$ANON"
          (cd apps/atlas && SUPABASE_URL=http://127.0.0.1:55421 ATLAS_SITE_URL=http://127.0.0.1:3006 nohup pnpm exec next start --port 3006 > /tmp/atlas.log 2>&1 &)
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:3006 && break; sleep 2; done
          SUPABASE_URL=http://host.docker.internal:55421 ATLAS_URL=http://host.docker.internal:3006 \
            sh packages/testing/load/run.sh smoke
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-smoke
          path: |
            packages/testing/node_modules/.cache/k6
            /tmp/atlas.log
          if-no-files-found: ignore

  # Section 9 testing: the OWASP ZAP baseline (spider plus passive rules, no attacks) against the staging
  # deployments, nightly rather than per push because staging deploys from its own branch. Both sit behind
  # Vercel deployment protection, so the job needs the VERCEL_AUTOMATION_BYPASS_SECRET repository secret
  # (owner step); without it the job passes with a notice. ZAP sends the bypass header only to the target
  # host. Accepted alerts and the rules that must never alert are in infra/security/zap/baseline-rules.tsv.
  zap-baseline:
    name: ZAP baseline (${{ matrix.app }} staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: atlas, url: "https://atlas-staging.ghxstship.tech" }
          - { app: gateway, url: "https://gateway-staging.ghxstship.tech" }
    steps:
      - name: Skip without the bypass secret
        id: gate
        env:
          HAS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          if [ "$HAS_SECRET" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=ZAP baseline skipped::Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret to scan staging (infra/security/README.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Pull the pinned ZAP image
        if: steps.gate.outputs.run == 'true'
        run: docker pull ghcr.io/zaproxy/zaproxy:2.17.0
      - name: Baseline scan and verdict
        if: steps.gate.outputs.run == 'true'
        env:
          TARGET: ${{ matrix.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: sh infra/security/zap-baseline.sh "$TARGET" zap
      # The reports are scrubbed of the bypass value before this step (infra/security/src/cli.ts zap).
      - if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-${{ matrix.app }}
          path: zap/
          if-no-files-found: ignore

  # Gate 17: policy-filtered list queries under 50 ms at p95 on 1,000,000 rows. The script runs in one
  # transaction that rolls back and prints a verdict per query and person.
  rls-benchmark:
    name: RLS benchmark (gate 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: infra/ci/supabase-images.sh db
      - run: supabase db start
      - name: Run the benchmark and fail on any FAIL verdict
        run: |
          DB=$(docker ps --format '{{.Names}}' | grep '^supabase_db_')
          docker exec -i "$DB" psql -U postgres -d postgres -X -f - < supabase/tests/0399_rls_benchmark.psql | tee /tmp/rls.txt
          ! grep -q 'FAIL' /tmp/rls.txt

  # Owner decision 22 (ADR 0033): AI evals run nightly, not on every push. Runs only where the
  # Anthropic key is configured; the monthly spend cap is set on the key in the Anthropic console.
  ai-evals:
    name: Aurora AI evals (gate 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs only where the Anthropic key is configured; unit tests use a fake model client.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANTHROPIC_API_KEY != ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.ANTHROPIC_API_KEY != ''
      - run: pnpm --filter @xos/ai evals
        if: env.ANTHROPIC_API_KEY != ''

  # Owner decision 13 (ADR 0033): the journeys in Firefox and WebKit run nightly; Chromium runs on
  # every push in ci.yml.
  e2e-engines:
    name: Playwright journeys (${{ matrix.app }}, ${{ matrix.engine }}) (gate 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [atlas, gateway]
        engine: [firefox, webkit]
    env:
      E2E_ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }} chromium
        working-directory: apps/${{ matrix.app }}
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      # The file handover secret (A103, ADR 0061): a fresh value for each run, which the file-download function reads
      # from supabase/functions/.env and Atlas from its environment, so classified PDFs and images download marked.
      - name: Generate the file handover secret
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SECRET"
          echo "XOS_FILE_HANDOVER_SECRET=$SECRET" > supabase/functions/.env
          echo "XOS_FILE_HANDOVER_SECRET=$SECRET" >> "$GITHUB_ENV"
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      - name: Write the app environment from the stack
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nATLAS_SITE_URL=http://127.0.0.1:3006\nGATEWAY_SITE_URL=http://127.0.0.1:3127\nSUPABASE_INBUCKET_URL=http://127.0.0.1:55424\nXOS_FILE_HANDOVER_SECRET=%s\n' "$ANON" "$XOS_FILE_HANDOVER_SECRET" > apps/atlas/.env.local
          printf 'SUPABASE_URL=http://127.0.0.1:55421\nSUPABASE_ANON_KEY=%s\nGATEWAY_SITE_URL=http://127.0.0.1:3127\nGATEWAY_PLATFORM_HOSTS=127.0.0.1,localhost\n' "$ANON" > apps/gateway/.env.local
          echo "E2E_ATLAS_URL=http://127.0.0.1:3006" >> "$GITHUB_ENV"
          echo "E2E_GATEWAY_URL=http://127.0.0.1:3127" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_URL=http://127.0.0.1:55421" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55422/postgres" >> "$GITHUB_ENV"
          echo "E2E_INBUCKET_URL=http://127.0.0.1:55424" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_KEY=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=@xos/${{ matrix.app }} ${{ matrix.app == 'gateway' && '--filter=@xos/atlas' || '' }}
      - name: Start the production server
        run: |
          PORT=$([ "${{ matrix.app }}" = atlas ] && echo 3006 || echo 3127)
          (cd apps/${{ matrix.app }} && nohup pnpm exec next start --port "$PORT" > /tmp/app.log 2>&1 &)
          if [ "${{ matrix.app }}" = gateway ]; then (cd apps/atlas && nohup pnpm exec next start --port 3006 > /tmp/atlas.log 2>&1 &); fi
          for i in $(seq 60); do curl -fs -o /dev/null "http://127.0.0.1:$PORT" && break; sleep 2; done
          echo "E2E_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          echo "E2E_PRODUCTION_BUILD=1" >> "$GITHUB_ENV"
      - run: pnpm exec playwright test
        working-directory: apps/${{ matrix.app }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.app }}-${{ matrix.engine }}
          path: |
            apps/${{ matrix.app }}/node_modules/.cache/playwright
            /tmp/*.log
          if-no-files-found: ignore

  # Owner decision 14 (ADR 0033): Compass Maestro flows nightly on GitHub runners (gate 7), airplane
  # mode and queue drain included (on Android, where Maestro can set airplane mode). GitHub's Apple
  # Silicon macOS runners cannot run Docker (no nested virtualization), so iOS runs on the Intel image,
  # where Colima runs the CI stack in a Linux VM. macos-15-intel is GitHub's last Intel image, supported
  # until August 2027 (infra/ci/README.md, "Compass Maestro jobs").
  maestro-ios:
    name: Compass Maestro on iOS (gate 7)
    runs-on: macos-15-intel
    timeout-minutes: 150
    env:
      MAESTRO_VERSION: 2.0.10
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Docker in a Colima VM
        run: |
          brew install docker colima
          colima start --runtime docker --cpu 2 --memory 6 --disk 40
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
          docker info --format 'Docker {{.ServerVersion}} in Colima: {{.NCPU}} CPUs, {{.MemTotal}} bytes'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      # SUPABASE_URL, SUPABASE_ANON_KEY, a registered kiosk and the Field Tech's kiosk PIN.
      - name: Prepare the Maestro run against the CI stack
        run: apps/compass/scripts/maestro-ci-env.sh >> "$GITHUB_ENV"
      - name: Build Compass for the simulator against the CI stack
        working-directory: apps/compass
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          export EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:55421
          export EXPO_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          # The runner has no audio input, so the simulator could never record a voice note: this test
          # build swaps in the silent fake recorder (src/runtime/voiceRecorder.ts; refused in EAS builds).
          export EXPO_PUBLIC_XOS_FAKE_RECORDER=1
          # A simulator has no NFC radio: the test tag stands in (src/runtime/nfc.ts; refused in EAS builds).
          export EXPO_PUBLIC_XOS_FAKE_NFC=1
          pnpm exec expo prebuild --platform ios --no-install
          (cd ios && pod install)
          # The Intel runner's simulator is x86_64; one architecture instead of two halves the build.
          xcodebuild -workspace ios/Compass.xcworkspace -scheme Compass -configuration Release \
            -sdk iphonesimulator -derivedDataPath build ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = [k for k, v in devices.items() if '.iOS-' in k and any(d['name'].startswith('iPhone') for d in v)]
          newest = max(runtimes, key=lambda k: [int(n) for n in re.findall(r'\d+', k.split('.iOS-')[1])])
          print(next(d['udid'] for d in devices[newest] if d['name'].startswith('iPhone')))
          ")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Compass.app
          for service in location-always camera microphone; do
            xcrun simctl privacy "$UDID" grant "$service" pro.ghxstship.compass || true
          done
      # Maestro sets airplane mode only on Android. For the airplane-mode flows on iOS, the network helper
      # (apps/compass/scripts/maestro-network.ts) stops and restarts the CI stack's API gateway instead.
      - name: Run the field flows, the offline ones through the network helper
        run: |
          SUPABASE_PROJECT_ID=xos4 node --experimental-strip-types --no-warnings \
            apps/compass/scripts/maestro-network.ts serve &
          sleep 1
          apps/compass/scripts/maestro-ci.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-ios
          path: node_modules/.cache/maestro
          if-no-files-found: ignore

  maestro-android:
    name: Compass Maestro on Android (gate 7)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: 2.0.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Without /dev/kvm the emulator runs unaccelerated (-accel off): it took 13 minutes to boot, then
      # adb lost it (Broken pipe) before any flow ran.
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      # Services no test uses stay off; the images come from GHCR first (infra/ci/README.md).
      - run: infra/ci/supabase-images.sh start
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      # SUPABASE_URL (the host's 127.0.0.1, where Maestro's scripts run), the anon key and the kiosk.
      - name: Prepare the Maestro run against the CI stack
        run: apps/compass/scripts/maestro-ci-env.sh >> "$GITHUB_ENV"
      - name: Build the release APK against the CI stack (the emulator reaches the host at 10.0.2.2)
        working-directory: apps/compass
        run: |
          export EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:55421
          export EXPO_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          # An emulator has no NFC radio: the test tag stands in (src/runtime/nfc.ts; refused in EAS builds).
          export EXPO_PUBLIC_XOS_FAKE_NFC=1
          pnpm exec expo prebuild --platform android --no-install
          # Release builds refuse cleartext HTTP and the CI stack is plain http://10.0.2.2, so this CI
          # build allows it. Store builds keep Android's default.
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          # The emulator is x86_64: one ABI instead of four (the first nightly spent 23 minutes here).
          (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64)
      - name: Run the field flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install apps/compass/android/app/build/outputs/apk/release/app-release.apk
            apps/compass/scripts/maestro-ci.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android
          path: node_modules/.cache/maestro
          if-no-files-found: ignore
