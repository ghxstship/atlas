name: Nightly

# Real-browser and load checks that take too long for every push. The route JavaScript budget in ci.yml
# guards the same gate 10 budget on every push from the build manifests.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI budgets (gate 10)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/atlas
      # Services no test uses stay off, which also keeps image pulls under the registry rate limit.
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      - run: pnpm turbo run build --filter=@xos/atlas --filter=@xos/gateway --filter=@xos/docs
      - name: Serve the three production builds and run Lighthouse
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          export SUPABASE_URL=http://127.0.0.1:55421 SUPABASE_ANON_KEY="$ANON"
          (cd apps/atlas && ATLAS_SITE_URL=http://127.0.0.1:3006 nohup pnpm exec next start --port 3006 > /tmp/atlas.log 2>&1 &)
          (cd apps/gateway && GATEWAY_SITE_URL=http://127.0.0.1:3127 nohup pnpm exec next start --port 3127 > /tmp/gateway.log 2>&1 &)
          (cd apps/docs && nohup pnpm exec next start --port 3014 > /tmp/docs.log 2>&1 &)
          for port in 3006 3127 3014; do
            for i in $(seq 60); do curl -fs -o /dev/null "http://127.0.0.1:$port" && break; sleep 2; done
          done
          export CHROME_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          pnpm --filter @xos/testing lighthouse
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: |
            packages/testing/node_modules/.cache/lighthouse
            /tmp/*.log
          if-no-files-found: ignore

  load-smoke:
    name: k6 smoke against the CI stack (Section 5.1 scripts stay runnable)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: pnpm install --frozen-lockfile
      # Services no test uses stay off, which also keeps image pulls under the registry rate limit.
      - run: supabase start -x studio,imgproxy,logflare,vector,postgres-meta,supavisor
      - run: pnpm turbo run build --filter=@xos/atlas
      - name: Smoke the three scripts through grafana/k6:2.3.0
        run: |
          ANON=$(supabase status -o env | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          export SUPABASE_ANON_KEY="$ANON"
          (cd apps/atlas && SUPABASE_URL=http://127.0.0.1:55421 ATLAS_SITE_URL=http://127.0.0.1:3006 nohup pnpm exec next start --port 3006 > /tmp/atlas.log 2>&1 &)
          for i in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:3006 && break; sleep 2; done
          SUPABASE_URL=http://host.docker.internal:55421 ATLAS_URL=http://host.docker.internal:3006 \
            sh packages/testing/load/run.sh smoke

  # Gate 17: policy-filtered list queries under 50 ms at p95 on 1,000,000 rows. The script runs in one
  # transaction that rolls back and prints a verdict per query and person.
  rls-benchmark:
    name: RLS benchmark (gate 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - run: supabase db start
      - name: Run the benchmark and fail on any FAIL verdict
        run: |
          DB=$(docker ps --format '{{.Names}}' | grep '^supabase_db_')
          docker exec -i "$DB" psql -U postgres -d postgres -X -f - < supabase/tests/0399_rls_benchmark.psql | tee /tmp/rls.txt
          ! grep -q 'FAIL' /tmp/rls.txt
