name: Release SBOM

# Section 9 supply chain: every release carries a CycloneDX SBOM of the production dependencies and the
# third-party notices list generated from it (legal/open-source-licenses.md, section 3). A version tag
# attaches both to the tag's GitHub release, creating a draft for the owner to complete when none exists
# yet; publishing a release attaches them again, so a release made by hand gets them too.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-sbom-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  sbom:
    name: CycloneDX SBOM on the GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 22.23.3, as in CI's supply-chain job (ADR 0001): the install then holds every optional
      # package that ships on Vercel's 22.x, including those whose engines .nvmrc's 22.14.0 misses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: pnpm
      # Production dependencies only: the SBOM lists what ships, not the build and test tooling.
      - run: pnpm install --frozen-lockfile --prod
      - name: CycloneDX SBOM (anchore/syft:v1.54.1) and third-party notices
        run: sh infra/security/sbom.sh "${TAG#v}" "$RUNNER_TEMP/sbom"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.TAG }}
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 90
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          set -- "$RUNNER_TEMP/sbom/xos-${VERSION}.cdx.json" "$RUNNER_TEMP/sbom/xos-${VERSION}-third-party-notices.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$@" --clobber
          else
            gh release create "$TAG" "$@" --draft --verify-tag --title "$TAG" \
              --notes "Draft created with the release SBOM; the owner writes the notes and publishes it (docs/release-checklist.md)."
          fi
