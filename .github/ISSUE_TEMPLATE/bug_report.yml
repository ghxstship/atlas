name: Bug report
description: Something in Atlas, Gateway, Compass or the API does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Atlas, Gateway, Compass, Public API, SDK or CLI, Docs]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a known starting point.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
