name: Ask for a private way to report a security finding
description: Your email to support@ghxstship.pro bounced, or had no answer within 3 business days. This asks for a private channel and holds no details.
title: Request for a private way to report a security finding
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public. Do not describe the finding here:** no steps, addresses, screenshots or impact, in the title or in a comment. We will answer here with a private way to send them.
  - type: dropdown
    id: reason
    attributes:
      label: Why you are asking
      options:
        - My email to support@ghxstship.pro bounced
        - I had no answer within 3 business days
    validations:
      required: true
  - type: checkboxes
    id: no-details
    attributes:
      label: Before you submit
      options:
        - label: This issue holds no details of the finding.
          required: true
