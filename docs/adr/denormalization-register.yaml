# Denormalization register (Section 3.15, ADR 0002, ADR 0068, gate 29). This file is the source: the pgTAP catalog
# lints read it through supabase/tests/1282_denormalization_register.psql, and docs/adr/denormalization-register.md is
# its human view. Both are generated; after editing this file run `pnpm --filter @xos/schemas generate:denormalization`.
#
# Lists are sorted by name. Each allow-list entry has a kind and a note saying why the column is allowed; kind
# `finding` marks a violation with an open finding under legal/qa/findings/, named in `finding`.
version: 1

# Stored derived values and materialized views kept for measured performance: objects, source, refresh rule, reason.
derived:
  - objects:
      - app.cues.project_id
    source: "`app.run_of_show.project_id`"
    refresh: Stamped by trigger on insert; never updated (migration 0412)
    reason: Compass PowerSync filters rows by project without a join (Section 13)
    adr: "0022"
  - objects:
      - app.inspection_results.project_id
    source: "`app.inspections.project_id`"
    refresh: Stamped by trigger on insert (0420)
    reason: PowerSync project filter, as above
    adr: "0022"
  - objects:
      - app.shift_swaps.project_id
    source: "`app.shifts.project_id`"
    refresh: Stamped by trigger on insert (0462)
    reason: PowerSync project filter, as above
    adr: "0022"
  - objects:
      - app.credentials.project_id
    source: "`app.credential_categories.project_id`"
    refresh: Stamped by trigger; changing it is refused (0470)
    reason: PowerSync project filter, as above
    adr: "0022"
  - objects:
      - app.access_grid.project_id
    source: "`app.credential_categories.project_id`"
    refresh: Stamped by trigger; changing it is refused (0470)
    reason: PowerSync project filter, as above
    adr: "0022"
  - objects:
      - app.access_scans.project_id
    source: "`app.credentials.project_id`"
    refresh: Stamped by trigger; changing it is refused (0470)
    reason: PowerSync project filter, as above
    adr: "0022"
  - objects:
      - app.incident_media.project_id
    source: "`app.incidents.project_id`"
    refresh: Stamped by trigger; changing it is refused (0470)
    reason: PowerSync project filter, as above
    adr: "0022"
  - objects:
      - app.usage_rollups
    source: "`app.usage_events`"
    refresh: Written once per closed month by the monthly rollup job (0510)
    reason: Billing reads closed months without scanning partitioned usage events
    adr: "0021"
  - objects:
      - private.sync_scope_grants
    source: Membership, assignment, shift and engagement tables through the RLS helpers
    refresh: Triggers on each source table plus a nightly full refresh (0942)
    reason: PowerSync parameter queries cannot call RLS helpers or join (gate 17 benchmark, A03F)
    adr: "0022"
  - objects:
      - app.occupancy_counters.alert_level_percent
      - app.occupancy_counters.current_count
    source: Sum of `app.occupancy_counts.delta` for the counter, and the highest of the 80, 90 and 100 percent alert levels that sum meets
    refresh: Written only by `app.record_occupancy_count` while it holds the counter row lock; the ledger is append-only (`t95_append_only`) with no caller write grants, so neither value can drift. pgTAP 1042 checks both against the ledger (A22-007)
    reason: "Every door tap compares the count with the 80, 90 and 100 percent alert levels under that lock; summing a ledger that grows through a long event would lengthen the lock on every tap. Not yet measured: if a benchmark shows the sum is cheap, replace both with a security_invoker view"
    adr: "0016"
  - objects:
      - app.occupancy_counts.count_after
    source: Running sum of `delta` over the counter's ledger, in id order
    refresh: Set once on insert by `app.record_occupancy_count` under the same lock; append-only afterwards (A22-007)
    reason: The door counter screen and the incident record show the count at each entry without a window function over the whole ledger
    adr: "0016"
  - objects:
      - app.form_templates.fields
      - app.form_template_versions.fields
    source: The form definition itself (document-shaped by design)
    refresh: "`form_templates.fields` is the working draft; publishing copies it into an append-only version (`t95_append_only`), so a definition never changes under its submissions (A22-008)"
    reason: Forms are designed and versioned as whole documents with nested choices, scoring and `show_if` conditions; the builder, Compass offline rendering and the PDF export read one document per version
    adr: "0002"
  - objects:
      - app.form_submissions.answers
      - app.form_submissions.max_score
      - app.form_submissions.score
    source: Answers to the fields of the submission's `form_template_version_id`, keyed by field key
    refresh: Validated against that immutable version by the submit RPC; the version never changes, so the field keys stay valid (A22-008)
    reason: An answer set is the filled-in copy of one document version, stored and exported whole; `max_score` and `score` are fixed by the same immutable version and answers at submission
    adr: "0002"
  - objects:
      - app.training_quiz_questions.options
      - app.training_quiz_keys.correct_option
    source: The answer options of one question, a short ordered list (2 to 6 distinct labels)
    refresh: Options are distinct, and when they change each live key moves to its option's new position; removing the keyed option is refused (migration 1042, pgTAP 1042). Questions and keys change only while the course is a draft (A22-008)
    reason: A question's options are read, shown and graded together; the key stays in its own table so learners never read it
    adr: "0002"
  - objects:
      - app.survey_questions.choices
      - app.survey_answers.choice
    source: The choice labels of one survey question; an answer stores the label chosen
    refresh: Survey questions take no updates from callers once created, and `app.respond_to_survey` accepts only a listed label, so a stored choice always names a current option (A22-008)
    reason: Results count answers per label in one pass, and an anonymous answer stays meaningful without joining back to a choice row
    adr: "0002"
  - objects:
      - app.api_keys.scopes
      - app.oauth_grants.scopes
    source: Capability groups, the first segments of the codes in `packages/schemas/capabilities.yaml` (a small closed set)
    refresh: Guard triggers (`guard_api_key`, `guard_oauth_grant`) refuse any value that is not a registry group on every write; the group set changes only by ADR under the contract freeze (ADR 0014), and such a migration rewrites the arrays (A22-009)
    reason: The api-token exchange copies a key's scopes into the JWT claim in one row read, and `private.person_capability_reach` tests membership per request (A22-001)
    adr: "0014"
  - objects:
      - app.scim_identities.groups
    source: Group display names in the identity provider's last SCIM payload
    refresh: Replaced whole on every SCIM sync by `app.scim_provision`; roles and teams are re-derived from `app.scim_group_mappings` on each sync, so the array is a payload snapshot, never edited (A22-009)
    reason: The provider owns group membership; storing its last answer lets support see what the provider sent without a junction table that would only mirror it
    adr: "0002"
  - objects:
      - app.org_legal_entities.tax_identifier_last4
      - app.person_work_details.passport_number_last4
      - app.supplier_diversity_certifications.certificate_number_last4
      - app.vendor_bank_accounts.account_last4
    source: The last four letters or digits of the number encrypted in the same row (`tax_identifier`, `passport_number`, `certificate_number`, `account_number`)
    refresh: Written only with the ciphertext, by the encrypting RPC (`app.set_org_legal_entity_tax_identifier`, `app.set_my_passport_number`, `app.set_supplier_diversity_certificate_number`, `app.set_vendor_bank_account`); each table's guard trigger refuses a write of either outside it (1200, 1340, 2010, 2011)
    reason: The number is Restricted and encrypted under a Vault key no signed-in caller holds, so the last four cannot be computed when a row is read; readers tell records apart by it, as the v1 API's `account_last4` does (ADR 0057)
    adr: "0057"

# Column names that describe the row itself wherever they appear. The restated-column lint never compares them and
# never follows a foreign key made only of them.
own_names:
  - name: body
    note: The row's own text.
  - name: created_at
    note: ADR 0002 row stamp.
  - name: created_by
    note: ADR 0002 row stamp.
  - name: deleted_at
    note: ADR 0002 row stamp.
  - name: description
    note: The row's own text.
  - name: id
    note: The row's own key.
  - name: label
    note: The row's own text.
  - name: name
    note: The row's own name. A child named under a project, venue or org shares only the column name.
  - name: note
    note: The row's own text.
  - name: notes
    note: The row's own text.
  - name: ordinal
    note: The row's place among its siblings.
  - name: org_id
    note: ADR 0002 tenant key, derived by trigger on every tenant table and never accepted from the caller.
  - name: position
    note: The row's place among its siblings.
  - name: sort_order
    note: The row's place among its siblings.
  - name: source_created_at
    note: Canon provenance stamp of the source workbook row (xpms).
  - name: source_created_by
    note: Canon provenance stamp of the source workbook row (xpms).
  - name: source_row
    note: Canon provenance stamp of the source workbook row (xpms).
  - name: source_status
    note: Canon provenance stamp of the source workbook row (xpms).
  - name: source_updated_at
    note: Canon provenance stamp of the source workbook row (xpms).
  - name: title
    note: The row's own text.
  - name: updated_at
    note: ADR 0002 row stamp.
  - name: updated_by
    note: ADR 0002 row stamp.

# Every json and jsonb column of an app, private or xpms table, with its ADR 0002 exception: rich-text, audit-diff,
# provider-payload, or registered (a derived entry above carries the reason).
json:
  - column: app.ai_suggestion_fields.proposed_value
    kind: provider-payload
    note: A field value the AI model proposed, kept as it answered until a person accepts or edits it.
  - column: app.audit_events.diff
    kind: audit-diff
    note: The audit ledger's diff of each write.
  - column: app.automation_run_steps.request_body
    kind: provider-payload
    note: Body sent to the operation (migration 1481).
  - column: app.automation_run_steps.response_body
    kind: provider-payload
    note: The operation's answer, trimmed to its identifying fields (migration 1481).
  - column: app.automation_runs.event_payload
    kind: provider-payload
    note: The event as webhooks send it, the run's input (migration 1481).
  - column: app.domain_events.data
    kind: provider-payload
    note: Outbound webhook payload.
  - column: app.form_submissions.answers
    kind: registered
    note: Answers to one immutable form version (A22-008).
  - column: app.form_template_versions.fields
    kind: registered
    note: Published form definition (A22-008).
  - column: app.form_templates.fields
    kind: registered
    note: Draft form definition (A22-008).
  - column: app.idempotency_keys.response_body
    kind: provider-payload
    note: The API response returned verbatim on replay.
  - column: app.import_row_results.before_image
    kind: audit-diff
    note: The target's changed columns before an import wrote them, used to undo it.
  - column: app.integration_connections.provider_settings
    kind: provider-payload
    note: Provider configuration the connector validates, such as calendar ids and default accounts. Never secrets.
  - column: app.integration_inbound_events.payload
    kind: provider-payload
    note: The part of the provider's payload the worker needs, at most 64 KB (migration 1400).
  - column: app.notifications.message_args
    kind: provider-payload
    note: Display arguments the catalog messages render for every channel; never relational.
  - column: app.org_domains.dns_records
    kind: provider-payload
    note: DNS records as the email or hosting provider gave them (migration 1355).
  - column: app.platform_operator_actions.details
    kind: audit-diff
    note: What an operator action changed, as display values (migration 1470).
  - column: app.stripe_events.payload
    kind: provider-payload
    note: Stripe event as sent, after signature verification.
  - column: app.sync_mutations.result
    kind: provider-payload
    note: The result returned to every replay of a Compass mutation.
  - column: app.time_entry_audit.new_values
    kind: audit-diff
    note: Clock times after a change.
  - column: app.time_entry_audit.old_values
    kind: audit-diff
    note: Clock times before a change.
  - column: private.account_deletions.result
    kind: audit-diff
    note: What an account deletion erased and kept, as returned to the person (migration 1112).
  - column: private.account_security_events.detail
    kind: audit-diff
    note: Facts of a security event in the person's own log (migration 1560).
  - column: private.platform_emails.args
    kind: provider-payload
    note: Template arguments for the email provider, cleared once sent (migration 1382).

# Every array column of an app, private or xpms table. Arrays of uuids are refused outright (pgTAP 1280).
arrays:
  - column: app.api_keys.scopes
    kind: reviewed
    note: Capability groups checked against the registry on every write (A22-009).
  - column: app.oauth_grants.scopes
    kind: reviewed
    note: Capability groups checked against the registry on every write (A22-009).
  - column: app.person_work_details.accessibility_needs
    kind: reviewed
    note: A set of fixed enum values a person picks, never joined on; a free-text note carries the rest (migration 1340).
  - column: app.person_work_details.dietary_needs
    kind: reviewed
    note: A set of fixed enum values a person picks, never joined on; a free-text note carries the rest (migration 1340).
  - column: app.scim_identities.groups
    kind: reviewed
    note: Group names in the identity provider's last SCIM payload, replaced whole on each sync (A22-009).
  - column: app.survey_questions.choices
    kind: reviewed
    note: The ordered answer texts of one question (A22-008).
  - column: app.training_quiz_questions.options
    kind: reviewed
    note: The ordered answer texts of one question; the quiz key follows its option (A22-008, migration 1042).
  - column: app.work_detail_events.categories
    kind: reviewed
    note: The set of work detail categories an access touched, in the person's append-only log (migration 1340).
  - column: app.work_detail_events.changed_columns
    kind: reviewed
    note: Column names an edit changed, in the person's append-only log; a log payload, never a relationship (migration 1340).
  - column: app.work_detail_shares.categories
    kind: reviewed
    note: The set of work detail categories a share grants, read whole (migration 1340).

# Every column with the same name and type as a non-key column of the table one of its foreign keys references (own
# names left out): registered (a derived entry above), fact (kept as it was when written while the parent can
# change), own (the row's own value: it can differ from the parent's, or the row needs it without the link, which is
# optional) or finding.
restated:
  - column: app.access_grid.project_id
    parent: app.credential_categories.project_id
    kind: registered
    note: Copied from the category by `private.copy_parent_project` (derived entry).
  - column: app.access_scans.project_id
    parent: app.credentials.project_id
    kind: registered
    note: Copied from the credential by `private.copy_parent_project` (derived entry).
  - column: app.accommodation_assignments.check_in_on
    parent: app.accommodation_blocks.check_in_on
    kind: own
    note: The guest's first night, inside the block's dates.
  - column: app.accommodation_assignments.check_out_on
    parent: app.accommodation_blocks.check_out_on
    kind: own
    note: The guest's departure, inside the block's dates.
  - column: app.advance_submissions.advance_recipient_id
    parent: app.advance_recipient_tokens.advance_recipient_id
    kind: own
    note: Who answered, required on every answer; for an answer through a token, `private.guard_advance_submission` requires the token's recipient.
  - column: app.api_keys.expires_at
    parent: app.service_accounts.expires_at
    kind: own
    note: The key's own expiry, at most a year ahead (`private.guard_api_key`); the service account has its own.
  - column: app.applications.currency_code
    parent: app.opportunities.currency_code
    kind: own
    note: Currency of the fee the applicant proposes; the posting's pay currency is a separate fact.
  - column: app.approval_decisions.decided_at
    parent: app.approval_instances.decided_at
    kind: own
    note: When one approver decided; the instance's is when the whole approval ended.
  - column: app.approval_instances.currency_code
    parent: app.approval_policies.currency_code
    kind: fact
    note: Currency of the amount submitted, fixed with the instance; the policy's is the currency of its threshold.
  - column: app.approval_instances.document_type
    parent: app.approval_policies.document_type
    kind: fact
    note: Type of the document submitted, fixed with the instance; the policy's is the type it gates.
  - column: app.asset_custody.project_id
    parent: app.engagements.project_id
    kind: own
    note: Project the asset is out for; the custodian's engagement can be for another project or for none.
  - column: app.asset_custody.venue_id
    parent: app.projects.venue_id
    kind: own
    note: Where the asset is kept, not the project's primary venue.
  - column: app.asset_lot_movements.project_id
    parent: app.engagements.project_id
    kind: own
    note: Project the quantity is out for; the custodian's engagement can be for another project or for none.
  - column: app.attachment_versions.checksum_sha256
    parent: app.document_versions.checksum_sha256
    kind: own
    note: Hash of the attachment's own stored file, set when its upload completes.
  - column: app.attachment_versions.version_number
    parent: app.document_versions.version_number
    kind: own
    note: Numbered within the attachment by the database.
  - column: app.attendance_counts.integration_connection_id
    parent: app.integration_sync_runs.integration_connection_id
    kind: own
    note: Connection the figures came from, required; the optional sync run is one of its runs.
  - column: app.attendance_counts.project_id
    parent: app.integration_sync_runs.project_id
    kind: own
    note: Project measured; a run can cover every project of its connection.
  - column: app.attendance_counts.project_id
    parent: app.scope_nodes.project_id
    kind: own
    note: Project measured; the optional scope node narrows it.
  - column: app.automation_run_steps.action_type
    parent: app.automation_actions.action_type
    kind: fact
    note: What the step ran, kept as it ran; the action can be edited later.
  - column: app.automation_run_steps.duration_ms
    parent: app.automation_runs.duration_ms
    kind: own
    note: The step's own duration; the run's spans every step.
  - column: app.automation_run_steps.error_code
    parent: app.automation_runs.error_code
    kind: own
    note: The step's own failure; the run's is why the run failed or was skipped.
  - column: app.automation_run_steps.error_message
    parent: app.automation_runs.error_message
    kind: own
    note: The step's own failure message.
  - column: app.automation_run_steps.finished_at
    parent: app.automation_runs.finished_at
    kind: own
    note: When the step ended.
  - column: app.automation_run_steps.started_at
    parent: app.automation_runs.started_at
    kind: own
    note: When the step started.
  - column: app.automation_runs.attempts
    parent: app.job_queue.attempts
    kind: fact
    note: The run's record of its attempts; the queue row is working state.
  - column: app.automation_runs.finished_at
    parent: app.job_queue.finished_at
    kind: fact
    note: When the run ended, kept on the run; the queue row is working state.
  - column: app.automation_runs.owner_person_id
    parent: app.automations.owner_person_id
    kind: fact
    note: Person the run acted as, fixed when it started; the automation's owner changes when someone edits it.
  - column: app.beos.project_id
    parent: app.fulfillments.project_id
    kind: own
    note: The order's project, which numbers it; the fulfillment link is optional.
  - column: app.bids.currency_code
    parent: app.applications.currency_code
    kind: own
    note: Currency the bid's lines are priced in; the application's proposed fee is optional and separate.
  - column: app.billing_draws.currency_code
    parent: app.invoices.currency_code
    kind: own
    note: A draw is planned before its invoice exists; the invoice link is optional.
  - column: app.billing_draws.project_id
    parent: app.invoices.project_id
    kind: own
    note: A draw is planned before its invoice exists; the invoice link is optional.
  - column: app.budget_lines.xyz
    parent: xpms.elements.xyz
    kind: own
    note: The line's XYZ tag; `private.guard_budget_line` requires its category's tag, and the element is optional.
  - column: app.calendars.time_zone
    parent: app.projects.time_zone
    kind: own
    note: Zone the calendar's days are read in, set per calendar.
  - column: app.capability_statements.venue_id
    parent: app.projects.venue_id
    kind: own
    note: A venue that provides a capability, not necessarily the primary venue.
  - column: app.change_order_lines.quantity
    parent: app.budget_lines.quantity
    kind: own
    note: Quantity of the change, not of the budget line.
  - column: app.change_order_lines.unit_price_minor
    parent: app.budget_lines.unit_price_minor
    kind: own
    note: Price of the change, not of the budget line.
  - column: app.change_order_lines.urid
    parent: app.budget_lines.urid
    kind: own
    note: Category of the change, which can differ from the line's.
  - column: app.change_order_state_transitions.reason
    parent: app.change_orders.reason
    kind: own
    note: Why the state changed; the change order's reason is why the change is needed.
  - column: app.change_orders.project_id
    parent: app.budgets.project_id
    kind: finding
    note: The budget is required and belongs to one project, which `private.guard_change_order` requires here.
    finding: A108-003
  - column: app.client_approval_requests.requested_by
    parent: app.change_orders.requested_by
    kind: own
    note: Member who asked the client, from the session; not who requested the change.
  - column: app.clock_punches.engagement_id
    parent: app.shifts.engagement_id
    kind: own
    note: Who punched; the shift link is optional.
  - column: app.clock_punches.engagement_id
    parent: app.time_entries.engagement_id
    kind: own
    note: Who punched; the time entry built from punches is linked later.
  - column: app.clock_punches.kiosk_device_id
    parent: app.time_entries.kiosk_device_id
    kind: own
    note: Kiosk the punch came from.
  - column: app.clock_punches.membership_id
    parent: app.shifts.membership_id
    kind: own
    note: Who punched; the shift link is optional.
  - column: app.clock_punches.membership_id
    parent: app.time_entries.membership_id
    kind: own
    note: Who punched; the time entry built from punches is linked later.
  - column: app.clock_punches.project_id
    parent: app.engagements.project_id
    kind: own
    note: Project worked; the engagement link is optional.
  - column: app.clock_punches.project_id
    parent: app.kiosk_devices.project_id
    kind: own
    note: Project worked; a kiosk can serve every project.
  - column: app.clock_punches.project_id
    parent: app.shifts.project_id
    kind: own
    note: Project worked; the shift link is optional.
  - column: app.clock_punches.project_id
    parent: app.time_entries.project_id
    kind: own
    note: Project worked; the time entry is linked later.
  - column: app.clock_punches.shift_id
    parent: app.time_entries.shift_id
    kind: own
    note: Shift worked, when there is one; the time entry is linked later.
  - column: app.content_reports.author_person_id
    parent: app.comments.author_person_id
    kind: fact
    note: "Author of the item as reported, the one column naming the author of a post (through its membership), a comment or a message alike; `app.report_content` sets it from the item, the comment's author never changes (`private.guard_comment`), and the report goes with the item. The policies and `content_reports_not_own` read it so an author never sees a report about their own content (1630)."
  - column: app.content_reports.author_person_id
    parent: app.content_moderation_decisions.author_person_id
    kind: own
    note: The report names the author when it is filed; the decision link is optional and set only once a moderator decides.
  - column: app.content_reports.chat_message_id
    parent: app.content_moderation_decisions.chat_message_id
    kind: own
    note: The message reported, needed before any decision; the decision names it by id without a foreign key, so it outlives the message.
  - column: app.content_reports.comment_id
    parent: app.content_moderation_decisions.comment_id
    kind: own
    note: The comment reported, needed before any decision; the decision names it by id without a foreign key.
  - column: app.content_reports.feed_post_id
    parent: app.content_moderation_decisions.feed_post_id
    kind: own
    note: The post reported, needed before any decision; the decision names it by id without a foreign key.
  - column: app.content_reports.subject_kind
    parent: app.content_moderation_decisions.subject_kind
    kind: own
    note: What was reported, needed before any decision; the decision link is optional.
  - column: app.correction_state_transitions.reason
    parent: app.time_entry_corrections.reason
    kind: own
    note: Why the state changed; the correction's reason is why the entry is wrong.
  - column: app.credentials.project_id
    parent: app.credential_categories.project_id
    kind: registered
    note: Copied from the category by `private.copy_parent_project` (derived entry).
  - column: app.credentials.project_id
